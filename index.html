NODES['m7-form']={kicker:'Module 7 · Choosing the functional form',title:'The Bending Crystal',
  intro:'The crystal bends light the way the right equation bends a line: to match how the business actually works. Pick the shape from the mechanism, read the coefficients in the right units, and beware of what happens past the edge of the data.',
  lessons:[
   {title:'Shape follows the mechanism',
    teach:`<p>OLS needs the equation to be linear in the <b>coefficients</b>, not in the variables. X², ln(X), and ln(Y) are all fine, because each coefficient still just multiplies something and gets added.</p>
    <div class="ex"><b>Linear</b> Y = β₀ + β₁X → each extra unit of X adds β₁ (constant effect)<br>
    <b>Double-log</b> ln Y = β₀ + β₁ln X → β₁ is the <b>elasticity</b>: 1% more X → about β₁% more Y<br>
    <b>Semilog on X</b> Y = β₀ + β₁ln X → slope = β₁ / X (diminishing effect)<br>
    <b>Semilog on Y</b> ln Y = β₀ + β₁X → one more unit of X → about 100·β₁% more Y<br>
    <b>Quadratic</b> Y = β₀ + β₁X + β₂X² → slope = β₁ + 2β₂X (the effect changes with X)</div>
    <p>In a <b>linear</b> model the slope is constant but the elasticity is not: elasticity = β₁·X̄/Ȳ. Don’t choose a form just for a slightly higher R² — and you can’t compare R² at all once Y is logged in one model and not the other.</p>`,
    practice:[
     {type:'sort',q:'Which form tells each business story?',cats:['Linear','Double-log','Semilog on X (ln X)','Quadratic'],
      items:[{t:'Each extra delivery truck adds the same $4,000 of weekly revenue',c:0},{t:'A 1% price cut always lifts unit sales by about 1.8%, at any price level',c:1},{t:'The first $100 of extra income adds more food spending than the tenth $100',c:2},{t:'Crowding: output rises with staff up to a point, then falls',c:3}],
      why:'Constant unit effect → linear; constant elasticity → double-log; diminishing effect → ln X; a turning point → quadratic.'},
     {make:r=>{const b=round(rr(r,8,14),2),xb=round(rr(r,15,25),1),yb=round(rr(r,250,360),0),e=b*xb/yb;return {type:'num',
      exhibit:Exhibit.eq(`FoodExp = 92.3 + ${b}·Income &nbsp;·&nbsp; Income in $100s · mean Income = ${xb} · mean FoodExp = $${yb}`),
      q:'Compute the <b>elasticity at the means</b> for this linear model.',a:e,tol:.006,hint:'Elasticity = β₁ × X̄ / Ȳ',
      solution:`${b} × ${xb} / ${yb} = ${round(e,3)}.`,why:`A 1% rise in income is associated with about a ${round(e,2)}% rise in food spending — at the means. In a linear model the elasticity changes along the line.`};}},
    ]},
   {title:'Curves, lags, and the edge of the data',
    teach:`<p><b>Quadratic:</b> with Y = β₀ + β₁X + β₂X², the slope at a point is <b>β₁ + 2β₂X</b>. If β₁ > 0 and β₂ < 0 the curve rises then falls, peaking at <b>X* = −β₁ / (2β₂)</b>.</p>
    <p><b>Lags:</b> when cause and effect don’t happen together — advertising this month, sales next month — model the delay: Salesₜ = β₀ + β₁Advertisingₜ₋₁ + εₜ. The lag should come from how the business works, not a search for significance.</p>
    <p><b>Extrapolation:</b> every form is only checked inside the range you observed. Outside it, a polynomial can swing wildly, a log model can flatten too soon, and a straight line can miss a turning point.</p>
    <div class="ex">Residuals that <b>curve</b> systematically around zero (negative → positive → negative) say the shape is wrong: add the missing curve and re-estimate before trusting anything else.</div>`,
    practice:[
     {make:r=>{const b1=round(rr(r,40,90),1),b2=-round(rr(r,.8,2.5),2),X=ri(r,5,15),s=b1+2*b2*X;return {type:'num',
      exhibit:Exhibit.eq(`Profit = 120 + ${b1}·Ads − ${-b2}·Ads² &nbsp;·&nbsp; Ads in $000s`),
      q:`What is the slope — the change in predicted profit from one more $1,000 of ads — when Ads = <b>${X}</b>?`,a:s,tol:.02,hint:'Slope = β₁ + 2β₂X',
      solution:`${b1} + 2 × (−${-b2}) × ${X} = ${round(s,2)}.`,why:'In a quadratic the payoff from one more unit depends on where you start.'};}},
     {type:'mc',q:'A model of sales on house size was fit to homes from 800 to 3,000 sq. ft. A developer asks for a forecast for a 9,000 sq. ft. estate. Best response?',
      opts:['Warn that it’s far outside the data','Use it — with a high R² the model travels','Use whichever form gives the larger number','It’s fine as long as the model is quadratic'],a:0,
      why:'Predictions outside the observed range are where a wrong functional form does the most damage.'},
    ]},
  ],
  puzzles:[
   {type:'sort',q:'Match each mechanism to the functional form that fits it.',cats:['Linear','Double-log','Semilog on X (ln X)','Semilog on Y (ln Y)','Quadratic'],
    items:[{t:'Every extra customer adds the same $35 in revenue',c:0},{t:'Price responds to square footage with a stable elasticity',c:1},{t:'Training hours help, but each extra hour helps less',c:2},{t:'Each extra year of experience raises salary by about 4%',c:3},{t:'Delivery time falls with more drivers until congestion makes it rise',c:4}],
    why:'Pick the form that matches the mechanism — constant effect, constant elasticity, diminishing returns, constant % growth, or a turning point — not the prettiest R².'},
   {make:r=>{const b1=round(rr(r,6,14),2),b2=-round(rr(r,.15,.45),3),xs=-b1/(2*b2);return {type:'num',
    exhibit:Exhibit.eq(`Output = 40 + ${b1}·Staff − ${-b2}·Staff²`),
    q:'At what staffing level does predicted output <b>peak</b>?',a:xs,tol:.06,unit:'staff',hint:'The peak is where the slope β₁ + 2β₂X equals zero: X* = −β₁ / (2β₂).',
    solution:`X* = −${b1} / (2 × −${-b2}) = ${round(xs,2)}.`,why:'Past the peak, adding staff lowers predicted output — something a linear model could never show.'};}},
   {type:'mc',q:'Why can OLS estimate Y = β₀ + β₁X + β₂X² even though the relationship is curved?',
    opts:['It’s still linear in the coefficients','OLS bends the fitted line automatically','The X² term raises R² enough to allow it','It can’t — a curve needs another estimator'],a:0,
    why:'OLS requires linearity in the coefficients, not in the variables. Y = β₀ + X^β₁ would not qualify.'},
   {make:r=>{const a=round(rr(r,3.8,4.6),4),b=round(rr(r,.92,1.12),4),S=ri(r,15,32)*100,p=Math.exp(a+b*Math.log(S));return {type:'num',
    exhibit:Exhibit.eq(`ln(Price) = ${a} + ${b}·ln(SQFT)`),
    q:`Predict the price, in dollars, of a <b>${S.toLocaleString()}</b> sq. ft. house.`,a:p,tol:p*.01,pre:'$',hint:'Compute ln(SQFT), plug it in to get ln(Price), then exponentiate: Price = e^(ln Price).',
    solution:`ln(${S}) = ${round(Math.log(S),4)}; ln(Price) = ${a} + ${b} × ${round(Math.log(S),4)} = ${round(a+b*Math.log(S),4)}; Price ≈ e^${round(a+b*Math.log(S),4)} ≈ ${money(p,0)}.`,
    why:`Interpret in logs, report in dollars. Here ${b} is the elasticity: 1% more space → about ${b}% higher price.`};}},
   {type:'mc',q:'Advertising runs this month, but customers take weeks to notice, compare, and buy. Which model fits the mechanism?',
    opts:['Salesₜ = β₀ + β₁Advertisingₜ₋₁ + εₜ','Salesₜ = β₀ + β₁Advertisingₜ + εₜ','Drop advertising — it isn’t significant this month','Salesₜ₋₁ = β₀ + β₁Advertisingₜ + εₜ'],a:0,
    why:'A lag represents the real timing of the decision; using only current advertising can understate the campaign.'},
   {make:r=>{const d=genResid(r,'curve');return {type:'mc',exhibit:residPlot(d,'Fitted value'),
    q:'A straight-line model leaves these residuals. What should you do first?',
    opts:['Add the missing curve and re-estimate','Nothing — the residuals still average zero','Drop the observations at both ends','Switch to robust standard errors'],a:0,
    why:'A systematic curve means the average relationship is misspecified. Fixing standard errors can’t repair the wrong shape.'};}},
   {type:'mc',q:'Model A (linear) has R² = 0.41; Model B (Y on ln X) has R² = 0.39. Theory predicts diminishing returns. Which should you prefer?',
    opts:['Model B — it fits the mechanism; the gap is trivial','Model A — with the same Y, higher R² should win','Neither — an R² below 0.5 is too weak to use','Average the two models’ forecasts to be safe'],a:0,
    why:'With the same Y, R² is comparable — but a tiny fit gap is no reason to pick a form that contradicts the theory.'},
  ]};

/* ==== content/m8.js ==== */
/* ==========================================================================
   MODULE 8 — Multicollinearity
   Stone: the Twin Prisms (perfect vs imperfect, consequences, high R² with
   weak t-tests, correlations and VIFs, remedies and their risks).
   ========================================================================== */
// two predictors that move together: a regression with a strong F-test but weak individual t-tests
function genCollinear(r){
  for(let tries=0;tries<300;tries++){
    const n=ri(r,12,16),tv=[],on=[],y=[];
    for(let i=0;i<n;i++){const a=round(rr(r,10,60),1);tv.push(a);on.push(round(a*rr(r,.55,.65)+rngGauss(r)*1.2,1));}
    for(let i=0;i<n;i++)y.push(round(200+3.1*tv[i]+2.4*on[i]+rngGauss(r)*22,1));
    const res=Stats.ols(tv.map((v,i)=>[v,on[i]]),y,['TV_Ads','Online_Ads']);
    if(res.pF<.001&&res.coef[1].p>.12&&res.coef[2].p>.12&&res.R2>.85)return {res,tv,on,y};
  }
  return null;
}
NODES['m8-multi']={kicker:'Module 8 · Multicollinearity',title:'The Twin Prisms',
  intro:'Two prisms, nearly identical, split the same beam of light. When two drivers tell almost the same story, the regression still fits — but it can’t tell who deserves the credit.',
  lessons:[
   {title:'Perfect, imperfect, and what it costs',
    teach:`<p><b>Perfect</b> multicollinearity: one X is an exact linear function of others — distance in miles <i>and</i> kilometers, or a dummy for every category plus an intercept. OLS can’t estimate separate coefficients at all. It’s rare and easy to spot.</p>
    <p><b>Imperfect</b> multicollinearity: Xs move strongly together but not exactly — TV and online ad budgets. OLS still works, and if the other assumptions hold the estimates stay <b>unbiased</b>. The cost is <b>precision</b>:</p>
    <div class="ex">Standard errors rise → |t| falls → p-values rise<br>Coefficients swing when you add or drop a related variable or a few observations<br>Overall fit (R²) barely changes</div>
    <p>The classic warning sign: <b>high R² and a significant F-test, but few or no significant individual t-tests</b>. Together the variables clearly matter; the model just can’t separate them.</p>`,
    practice:[
     {type:'sort',q:'Perfect or imperfect multicollinearity?',cats:['Perfect','Imperfect'],
      items:[{t:'Store size in square feet and in square meters',c:0},{t:'TV and online ad spending, which usually rise together',c:1},{t:'Dummies for North, South, East, and West, plus an intercept',c:0},{t:'Household income and years of education',c:1}],
      why:'Perfect = an exact linear relationship (same information twice); imperfect = strong but not exact overlap.'},
     {type:'mc',q:'Two related ad variables are both in the model. Compared with a model where they were unrelated, their coefficients are…',
      opts:['Still unbiased, but less precise','Biased toward zero, and less precise','Biased away from zero','Unchanged, with the same standard errors'],a:0,
      why:'Multicollinearity is a precision problem, not automatically a bias problem: the aim is still on target, just shakier.'},
    ]},
   {title:'Detecting it — and deciding what to do',
    teach:`<p><b>Correlation</b> between pairs of Xs is a quick screen (worry above about |r| = 0.7–0.8), but a <i>group</i> of variables can overlap without any single high pair.</p>
    <p>A <b>VIF</b> (variance inflation factor) asks how predictable one X is from all the others. Regress that X on the other Xs (an auxiliary regression) and take its R²:</p>
    <div class="ex">VIF = 1 / (1 − R²<sub>aux</sub>) &nbsp;·&nbsp; above 5 = warning, above 10 = serious (no universal cutoff)</div>
    <p><b>Remedies, in order:</b> 1 · often <b>do nothing</b> — if signs are right and the estimates are useful, leave it. 2 · drop a variable only if theory says it’s <b>redundant</b> — otherwise you trade imprecision for omitted-variable bias. 3 · get more data, if you can.</p>`,
    practice:[
     {make:r=>{const R=round(rr(r,.55,.95),2),v=1/(1-R);return {type:'num',q:`Regressing Cadence on the other explanatory variables gives an auxiliary R² of <b>${R}</b>. What is Cadence’s VIF?`,a:v,tol:.02,
      hint:'VIF = 1 / (1 − auxiliary R²)',solution:`1 / (1 − ${R}) = ${round(v,2)}.`,why:v>10?'Above 10: serious multicollinearity for Cadence.':v>5?'Above 5: a warning sign.':'Below 5: usually not a concern on its own.'};}},
     {type:'mc',q:'Price has a VIF of 8, the expected negative sign, and p = 0.002. What should you do about the multicollinearity?',
      opts:['Probably nothing — the estimate is still usable','Drop price to bring its VIF down','Drop every variable with a VIF above 5','Collect a new sample before using the model'],a:0,
      why:'A high VIF doesn’t automatically mean removing a variable. Adjust only if multicollinearity is actually damaging the estimates you need.'},
    ]},
  ],
  puzzles:[
   {make:r=>{const d=genCollinear(r);if(!d)return {type:'mc',q:'High R² and a significant F-test, but no individual t-test is significant. What is the classic explanation?',opts:['Multicollinearity — the variables matter jointly but can’t be separated','The model is useless','Heteroskedasticity','A coding error'],a:0,why:'Joint significance with individual weakness is the signature of overlapping predictors.'};
    return {type:'mc',exhibit:Exhibit.excel(d.res,'Sales ($000)'),
     q:`The F-test is highly significant and R² = ${round(d.res.R2,2)}, but neither ad coefficient is significant on its own. Best reading?`,
     opts:['They matter jointly but can’t be told apart','Advertising has no clear effect on sales','The model is misspecified and should be discarded','One variable must be dropped to remove the bias'],a:0,
     why:'High R² + significant F + weak t-tests is the classic warning sign of multicollinearity: precision, not bias.'};}},
   {make:r=>{const rr_=round(rr(r,.80,.97),2),v=1/(1-rr_*rr_);return {type:'num',
    q:`A model has just two explanatory variables, and their correlation is <b>r = ${rr_}</b>. With only two Xs, the auxiliary R² is r². What is the VIF for each?`,a:v,tol:.05,
    hint:'Auxiliary R² = r²; then VIF = 1 / (1 − r²).',solution:`r² = ${round(rr_*rr_,4)}; VIF = 1 / (1 − ${round(rr_*rr_,4)}) = ${round(v,2)}.`,
    why:`${v>10?'Serious':v>5?'A warning-level':'Mild'} multicollinearity. Note how fast VIF climbs as r approaches 1.`};}},
   {type:'mc',q:'Which statement about the consequences of imperfect multicollinearity is correct?',
    opts:['Unbiased, but larger SEs and unstable estimates','Biased coefficients and a sharply lower R²','OLS can no longer be computed at all','Higher t-scores, so more looks significant'],a:0,
    why:'Not bias — less precision, larger p-values, unexpected signs more likely, and big swings when related variables are added or dropped.'},
   {type:'mc',q:'Dropping Infrastructure makes Cadence’s p-value fall from 0.80 to 0.0002. What’s the risk in celebrating?',
    opts:['Cadence may now carry omitted-variable bias','None — a lower p-value means a better model','None — only the p-value moved, not the estimate','R² will collapse once a variable is dropped'],a:0,
    why:'Better significance is not automatically a better specification. Theory decides whether a variable belongs.'},
   {type:'sort',q:'Sort each response to multicollinearity.',cats:['Defensible','Not defensible'],
    items:[{t:'Leave it alone: signs are as expected and the key estimate is precise enough to decide',c:0},{t:'Drop whichever variable has the weaker p-value in this sample',c:1},{t:'Drop one of two variables that measure the same concept, keeping the one theory favors',c:0},{t:'Remove every variable with a VIF above 5',c:1},{t:'Collect more observations if that’s feasible',c:0}],
    why:'Diagnose first; adjust only if it’s hurting the model you need — and let theory, not p-values, choose what stays.'},
   {type:'mc',q:'Why does multicollinearity damage interpretation more than forecasting?',
    opts:['Joint predictions hold up; separate effects don’t','Forecasts become biased while coefficients don’t','It lowers R², which matters only for forecasts','It harms both equally in practice'],a:0,
    why:'If the Xs keep moving together as they did in the sample, joint predictions still work; it’s the “who gets the credit” question that suffers.'},
   {type:'mc',q:'No pair of explanatory variables has a correlation above 0.5, yet one VIF is 14. How is that possible?',
    opts:['Several other variables together predict it well','The VIF must have been miscalculated','VIFs are built from pairwise correlations only','It signals perfect multicollinearity'],a:0,
    why:'Correlation is a pairwise screen; VIF uses all the other Xs at once, so it catches group overlap.'},
  ]};

/* ==========================================================================
   MODULE 9 — Serial correlation
   Stone: the Echoing Ice (positive vs negative, residuals over time, pure vs
   impure, Durbin–Watson and its limits, effect on standard errors).
   ========================================================================== */
// Durbin–Watson 5% critical values [dL, dU] by sample size T and number of predictors k
const DWT={20:{1:[1.20,1.41],2:[1.10,1.54],3:[1.00,1.68]},25:{1:[1.29,1.45],2:[1.21,1.55],3:[1.12,1.65]},
           30:{1:[1.35,1.49],2:[1.28,1.57],3:[1.21,1.65]},40:{1:[1.44,1.54],2:[1.39,1.60],3:[1.34,1.66]}};
const SC_KIND={pos:'Positive serial correlation — residuals stay on one side in long runs',none:'No serial correlation — residuals jump around with no pattern',neg:'Negative serial correlation — residuals tend to flip sign every period'};
function genAR(r,rho,n=30){const e=[];let prev=0;for(let t=0;t<n;t++){prev=rho*prev+rngGauss(r)*(rho?Math.sqrt(1-rho*rho):1);e.push(prev);}
  const m=e.reduce((a,b)=>a+b,0)/n;return e.map(v=>round((v-m)*10,2));}
const timePlot=e=>Exhibit.scatter(e.map((_,i)=>i+1),e,{xl:'Time period',yl:'Residual',hline:0,connect:true,title:'Residuals over time'});
const dwOf=e=>{let num=0,den=0;e.forEach((v,i)=>{den+=v*v;if(i)num+=(v-e[i-1])**2;});return num/den;};

NODES['m9-serial']={kicker:'Module 9 · Serial correlation',title:'The Echoing Ice',
  intro:'Shout into the ice and it answers a moment later. When today’s residual helps predict tomorrow’s, the model’s “noise” isn’t really noise — and its p-values claim more certainty than they’ve earned.',
  lessons:[
   {title:'When errors echo over time',
    teach:`<p>In time-series data, the error in one period can be related to the error in the next. That breaks Classical Assumption 4 (no serial correlation).</p>
    <div class="ex"><b>Positive</b> (ρ &gt; 0): residuals keep the same sign for runs of periods — the common business case, because shocks take time to work through.<br>
    <b>Negative</b> (ρ &lt; 0): residuals tend to flip sign each period. Possible, but less common.<br>ρ is estimated as the correlation between eₜ and eₜ₋₁.</div>
    <p><b>Pure</b> serial correlation: the model is correctly specified but the errors still persist. <b>Impure</b>: the pattern is a <i>symptom</i> of a specification error — an omitted variable that moves over time, a missing <b>trend</b> or <b>seasonality</b>, a missing <b>lag</b>, or the wrong <b>functional form</b>.</p>
    <p><b>Consequences (pure case):</b> coefficients stay unbiased, but OLS is no longer BLUE and the usual <b>standard errors are biased — typically too small</b>, so t-statistics look too big and p-values too optimistic.</p>`,
    practice:[
     {make:r=>{const k=pick(['pos','none','neg']),rho={pos:.85,none:0,neg:-.75}[k],e=genAR(r,rho,24);const keys=['pos','none','neg'];return {type:'mc',exhibit:timePlot(e),
      q:'Residuals from a monthly sales model, in time order. What do they show?',opts:keys.map(x=>SC_KIND[x]),a:keys.indexOf(k),
      why:'Runs of same-signed residuals mean positive serial correlation; sign-flipping every period means negative; no pattern means none.'};}},
     {type:'sort',q:'Pure or impure serial correlation?',cats:['Pure','Impure (a specification problem)'],
      items:[{t:'A correctly specified model where supply shocks take several quarters to fade',c:0},{t:'Quarterly sales model with no holiday-quarter dummy',c:1},{t:'A straight line fit to costs that fall fast and then level off',c:1},{t:'Retail sales model that omits a slowly cycling consumer-confidence index',c:1}],
      why:'Impure serial correlation is the model telling you something is missing: a seasonal pattern, the right shape, or a persistent variable.'},
    ]},
   {title:'The Durbin–Watson test',
    teach:`<div class="ex">DW = Σ(eₜ − eₜ₋₁)² / Σeₜ² &nbsp;·&nbsp; ≈ 0 strong positive · ≈ 2 none · ≈ 4 strong negative</div>
    <p>To test for <b>positive</b> first-order serial correlation (H₀: ρ ≤ 0, Hₐ: ρ &gt; 0), look up <b>dL</b> and <b>dU</b> for your sample size T and number of predictors k:</p>
    <div class="ex">DW &lt; dL → <b>reject H₀</b> (positive serial correlation)<br>DW &gt; dU → <b>do not reject</b><br>dL ≤ DW ≤ dU → <b>inconclusive</b> — proceed with caution</div>
    <p><b>Limits:</b> DW requires an intercept, only checks <b>first-order</b> correlation, and is <b>not valid when a lagged dependent variable</b> (Yₜ₋₁) is an explanatory variable. The inconclusive zone is part of the test, not a mistake.</p>
    <p><b>Response:</b> diagnose first — look for an omitted trend, seasonality, a missing lag, or the wrong form. Advanced fixes (GLS, Newey–West standard errors) are for pure serial correlation and are beyond this course.</p>`,
    practice:[
     {make:r=>{const num=round(rr(r,20,140),1),den=round(rr(r,60,110),1),dw=num/den;return {type:'num',q:`For a regression’s residuals, Σ(eₜ − eₜ₋₁)² = <b>${num}</b> and Σeₜ² = <b>${den}</b>. What is the Durbin–Watson statistic?`,a:dw,tol:.006,
      hint:'DW = Σ(eₜ − eₜ₋₁)² ÷ Σeₜ²',solution:`${num} / ${den} = ${round(dw,3)}.`,why:dw<1.2?'Well below 2 — a sign of positive serial correlation (check dL/dU to decide).':dw>2.6?'Well above 2 — a hint of negative serial correlation.':'Fairly close to 2 — compare with dU before relaxing.'};}},
     {type:'mc',q:'Which equation makes the Durbin–Watson test unreliable?',
      opts:['Salesₜ = β₀ + β₁Priceₜ + β₂Salesₜ₋₁ + εₜ','Salesₜ = β₀ + β₁Priceₜ + β₂Incomeₜ + εₜ','Salesₜ = β₀ + β₁Advertisingₜ₋₁ + εₜ','Salesₜ = β₀ + β₁Priceₜ + β₂Q4ₜ + εₜ'],a:0,
      why:'DW is not valid when the lagged dependent variable (Salesₜ₋₁) is an explanatory variable. A lagged X like Advertisingₜ₋₁ is fine.'},
    ]},
  ],
  puzzles:[
   {make:r=>{const k=pick(['pos','neg','none']),rho={pos:.88,none:0,neg:-.8}[k],e=genAR(r,rho,28),keys=['pos','none','neg'];return {type:'mc',exhibit:timePlot(e),
    q:'Quarterly residuals in time order. Which pattern is this?',opts:keys.map(x=>SC_KIND[x]),a:keys.indexOf(k),
    why:k==='pos'?'Long runs above and below zero: positive serial correlation — the most common case in business time series.':k==='neg'?'Residuals keep flipping sign: negative serial correlation.':'No visible persistence — consistent with independent errors.'};}},
   {make:r=>{const n=8,rho=pick([.75,.6,-.5]);let e=genAR(r,rho,n).map(v=>round(v/4,2));const d=e.map((v,i)=>i?round(v-e[i-1],2):'—');
    const num=d.slice(1).reduce((s,v)=>s+v*v,0),den=e.reduce((s,v)=>s+v*v,0),dw=num/den;return {type:'num',
    exhibit:Exhibit.table(['t','eₜ','eₜ − eₜ₋₁'],e.map((v,i)=>[i+1,fmtNum(v),d[i]==='—'?'—':fmtNum(d[i])])),
    q:'Compute the Durbin–Watson statistic for these residuals.',a:dw,tol:.012,
    hint:'Square and add the differences (skip t = 1), square and add the residuals, then divide: DW = Σ(eₜ − eₜ₋₁)² / Σeₜ². The calculator’s sumsq(…) helps.',
    solution:`Σ(eₜ − eₜ₋₁)² = ${round(num,4)}; Σeₜ² = ${round(den,4)}; DW = ${round(dw,3)}.`,
    why:dw<1.5?'Low DW: residuals move together from one period to the next.':dw>2.5?'High DW: residuals tend to reverse each period.':'Near 2: little first-order pattern.'};}},
   {make:r=>{const T=pick([20,25,30,40]),k=pick([1,2,3]),[dL,dU]=DWT[T][k],zone=pick(['rej','inc','no']);
    const dw=zone==='rej'?round(rr(r,.4,dL-.08),2):zone==='inc'?round(rr(r,dL+.03,dU-.03),2):round(rr(r,dU+.08,2.3),2);
    const opts=['Reject H₀ — evidence of positive serial correlation','Inconclusive — don’t over-trust the p-values','Do not reject H₀ — no evidence of positive serial correlation'];
    return {type:'mc',exhibit:Exhibit.table(['T','k','DW','dL (5%)','dU (5%)'],[[T,k,dw,dL.toFixed(2),dU.toFixed(2)]]),
     q:'Test for positive first-order serial correlation at the 5% level. Decision?',opts,a:{rej:0,inc:1,no:2}[zone],
     why:`DW = ${dw} is ${zone==='rej'?`below dL = ${dL}: reject H₀`:zone==='inc'?`between dL = ${dL} and dU = ${dU}: inconclusive`:`above dU = ${dU}: do not reject H₀`}.`};}},
   {type:'mc',q:'A time-series demand model shows strong positive serial correlation, but every coefficient has p < 0.01. What should a manager conclude?',
    opts:['The p-values are probably too optimistic','The model is extra reliable, since all are significant','The coefficients must be biased; ignore the signs','Serial correlation only affects R², not the tests'],a:0,
    why:'Serial correlation can make weak evidence look strong. In the pure case the coefficients are unbiased; the reported precision is what you can’t trust.'},
   {type:'sort',q:'Sort each statement about pure serial correlation.',cats:['True','False'],
    items:[{t:'OLS coefficients are still unbiased',c:0},{t:'OLS is still the minimum-variance (BLUE) estimator',c:1},{t:'The usual standard errors and t-tests become unreliable',c:0},{t:'It always means a variable was omitted',c:1}],
    why:'Pure serial correlation hurts efficiency and inference, not the center of the estimates. Impure serial correlation is the one caused by specification errors.'},
   {type:'mc',q:'Monthly ice-cream sales residuals are positive every summer and negative every winter. What’s the best first move?',
    opts:['Add seasonal dummies and re-estimate','Apply a standard-error correction right away','Drop the summer months from the sample','Ignore it — DW only matters for annual data'],a:0,
    why:'That pattern is impure serial correlation from missing seasonality. Fix the specification before reaching for statistical patches.'},
   {type:'mc',q:'DW = 1.31 with T = 25 and k = 3 (dL = 1.12, dU = 1.65). What does “inconclusive” mean for a decision?',
    opts:['It can’t confirm or rule it out — proceed with caution','There is no meaningful serial correlation to worry about','There is positive serial correlation, just weaker','The test was set up or run incorrectly'],a:0,
    why:'The inconclusive zone is part of the Durbin–Watson test, not an error.'},
  ]};

/* ==========================================================================
   INTERPRETATION DESK — "explain it" questions (one or two per area).
   The player writes a short interpretation, sees a model answer, and ticks
   the key points they covered (2/3 of them counts as a pass).
   ========================================================================== */
const EXPLAIN=(m,title,puzzles)=>{NODES[`m${m}-explain`]={explain:true,kicker:`Interpretation desk · ${AREAS_SHORT[m]}`,title,puzzles:puzzles.map(p=>({type:'explain',...p}))};};
const AREAS_SHORT={1:'Regression basics',2:'Fit and multiple regression',3:'Building a model',4:'Assumptions and residuals',5:'Hypothesis tests',
  6:'Causation and specification',7:'Functional form',8:'Multicollinearity',9:'Serial correlation',10:'Heteroskedasticity'};

EXPLAIN(1,'Explain a coefficient',[
 {exhibit:Exhibit.eq('Sales ($000) = 42.0 + 3.6·Ads ($000) − 1.9·CompetitorStores'),
  q:'Your VP asks what the <b>3.6</b> on Ads means and whether it proves advertising works. Answer in a few sentences.',
  model:'Holding the number of competitor stores constant, each extra $1,000 of advertising is associated with about $3,600 more in sales. That is an estimated association in this sample, not proof that ads cause the sales — other factors that move with advertising could be involved, and we’d want its precision (standard error) and a credible design before treating it as causal.',
  points:['Gives the size in real units ($1,000 of ads ↔ about $3,600 of sales)','Says “holding competitor stores constant” (other included factors fixed)','Calls it an association, not proof of cause','Mentions checking precision or what else could explain it'],
  why:'A complete interpretation covers units, the “holding constant” condition, and what the number can’t prove.'},
]);
EXPLAIN(2,'Explain R² and adjusted R²',[
 {exhibit:Exhibit.table(['Model','Drivers','R²','Adjusted R²'],[['A','Price, Ads','0.71','0.69'],['B','Price, Ads, Day of week code','0.72','0.66']]),
  q:'A colleague wants Model B because its R² is higher. Explain which model you’d prefer and why.',
  model:'R² always rises (or stays the same) when you add a variable, so B’s slightly higher R² doesn’t show the new variable helps. Adjusted R² penalizes extra variables, and it falls from 0.69 to 0.66, so the added driver isn’t earning its place. I’d prefer Model A unless theory gives a strong reason the extra variable belongs — and neither R² says anything about causation.',
  points:['R² can’t fall when a variable is added, so a higher R² alone means little','Adjusted R² falls for B — the extra variable isn’t worth it','Prefers Model A (unless theory says otherwise)','Notes fit is not proof of a good or causal model'],
  why:'Compare models with adjusted R² and theory, not raw R².'},
]);
EXPLAIN(3,'Explain a dummy variable',[
 {exhibit:Exhibit.eq('Margin (%) = 11.2 + 0.4·Size + 3.1·Defense + 1.4·Government &nbsp;·&nbsp; base group: Commercial'),
  q:'Explain what the <b>3.1</b> on Defense means, and why there is no Commercial dummy in the model.',
  model:'Holding contract size constant, Defense contracts have a predicted margin about 3.1 percentage points higher than Commercial contracts — the left-out base group. Commercial has no dummy because including a dummy for every category alongside the intercept would make them sum to the intercept column (perfect multicollinearity, the dummy-variable trap); with k categories you include k − 1 dummies.',
  points:['3.1 percentage points higher margin than the base group','Names Commercial as the comparison (base/reference) group','Holding size constant','Explains the dummy-variable trap / k − 1 dummies'],
  why:'Every dummy coefficient is a comparison with the omitted base group.'},
]);
EXPLAIN(4,'Explain a residual plot',[
 {make:r=>({exhibit:residPlot(genResid(r,'spray'),'Store size'),
  q:'Explain what this residual plot tells you about the model and what it means for a manager reading its p-values.',
  model:'The residuals fan out as store size grows — the errors are much bigger for large stores. That is heteroskedasticity: the constant-variance assumption fails. The coefficients aren’t biased by this alone, but the usual standard errors are wrong, so the reported p-values and confidence intervals can’t be trusted as printed; robust standard errors (after checking the model’s form) are the usual response.',
  points:['Spread grows with store size (a fan / spray)','Names it heteroskedasticity / non-constant variance','Coefficients still unbiased','Standard errors and p-values are unreliable']})},
]);
EXPLAIN(5,'Explain a significance result',[
 {exhibit:Exhibit.table(['','Coefficient','Std. error','t','p-value'],[['Training hours','0.84','0.29','2.90','0.006'],['Bonus ($000)','0.02','0.01','2.10','0.042']]),
  q:'Productivity is measured in units per day. Explain whether each driver is statistically significant and whether that makes it important.',
  model:'Both coefficients are statistically significant at the 5% level (p = 0.006 and 0.042), so the data give evidence that neither effect is zero. Significance isn’t importance, though: an extra training hour goes with about 0.84 more units a day, while $1,000 of bonus goes with only 0.02 — tiny in practical terms. Whether to act depends on size and cost, and significance alone doesn’t prove either one causes productivity.',
  points:['Both are significant at 5% (p below 0.05)','Significance means evidence the effect isn’t zero — not that it’s large','Compares practical size: training 0.84 vs bonus 0.02 units','Notes significance doesn’t prove causation (or that cost matters)'],
  why:'Statistical significance and economic importance are different questions.'},
]);
EXPLAIN(6,'Explain a changing coefficient',[
 {exhibit:Exhibit.table(['Model','Competitors coefficient','t'],[['With population','−10,605','−5.07'],['Without population','−1,684','−0.81']]),
  q:'When population is dropped, the competition coefficient shrinks and loses significance. Explain what’s going on and which model to trust.',
  model:'This is omitted-variable bias. Population affects sales and is correlated with the number of competitors (busy areas attract more competitors), so when it’s left out, the competition coefficient absorbs part of population’s positive effect and is pulled toward zero. The model with population is more credible: theory says population belongs, and its inclusion lets competition show its real negative effect.',
  points:['Names omitted-variable bias','Population affects sales AND moves with competition','The competition estimate is biased toward zero when population is dropped','Trusts the model that includes population, on theory grounds'],
  why:'Bias needs both conditions: the omitted variable matters, and it’s correlated with an included one.'},
]);
EXPLAIN(7,'Explain a log model',[
 {exhibit:Exhibit.eq('ln(Price) = 4.24 + 1.02·ln(SQFT)'),
  q:'Explain what the <b>1.02</b> means in plain language, and one caution about using this model for a very large estate.',
  model:'In a double-log model the coefficient is an elasticity: a 1% increase in square footage is associated with about a 1.02% increase in expected price — roughly proportional. To forecast a price you compute ln(Price) and exponentiate back to dollars. Using it for an estate far bigger than the homes in the data is extrapolation: the constant-elasticity shape may not hold outside the observed range.',
  points:['Calls 1.02 an elasticity','1% more square footage → about 1.02% higher price','Forecasts need converting back from logs (exponentiate)','Warns against extrapolating beyond the data’s range'],
  why:'Interpret in percentages, report in dollars, and stay inside the data.'},
]);
EXPLAIN(8,'Explain multicollinearity',[
 {exhibit:Exhibit.table(['','Coefficient','p-value','VIF'],[['TV ads','2.9','0.31','11.4'],['Online ads','2.1','0.38','11.4'],['Model: R² = 0.91, F-test p < 0.001','','','']]),
  q:'A manager concludes that neither ad channel works because neither is significant. Explain why that’s the wrong conclusion and what you’d do.',
  model:'The overall F-test is highly significant and R² is high, so the two channels matter jointly. Their VIFs above 10 show severe multicollinearity: TV and online spend move together, so the model can’t separate their individual effects and their standard errors are inflated — that’s why the individual p-values look weak. The estimates aren’t biased, just imprecise. I wouldn’t drop a channel to “fix” it (that risks omitted-variable bias); I’d report their combined effect or get more varied data.',
  points:['Jointly significant: F-test and R² show the ads matter together','High VIFs = severe multicollinearity; the two move together','Weak t-tests come from inflated standard errors, not irrelevance','Don’t just drop one — risk of omitted-variable bias'],
  why:'Multicollinearity hides individual effects; it doesn’t erase them.'},
]);
EXPLAIN(9,'Explain a Durbin–Watson result',[
 {exhibit:Exhibit.table(['T','k','DW','dL (5%)','dU (5%)'],[[30,2,'0.94','1.28','1.57']]),
  q:'This is a quarterly sales model. Explain the Durbin–Watson result and what it means for the model’s p-values.',
  model:'DW = 0.94 is below dL = 1.28, so we reject the null and conclude there is positive first-order serial correlation: errors in one quarter tend to carry into the next. The coefficients may still be unbiased, but the standard errors are likely understated, so the p-values look more convincing than they should. First check for something missing — a trend, seasonality, a lag, or the wrong form — before reaching for a statistical correction.',
  points:['DW below dL → reject H₀: positive serial correlation','Errors persist from one period to the next','Standard errors understated → p-values too optimistic','Check for a missing trend, seasonality, lag, or wrong form first'],
  why:'Durbin–Watson is a credibility check on time-series significance.'},
]);
EXPLAIN(10,'Explain two tests that disagree',[
 {exhibit:Exhibit.table(['Test','LM','df','p-value'],[['Breusch–Pagan','2.16','2','0.340'],['White','12.81','5','0.025']]),
  q:'The two heteroskedasticity tests disagree. Explain why that can happen and what you would do next.',
  model:'They aren’t contradicting each other. Breusch–Pagan only looks for error variance that changes linearly with the predictors and found nothing (p = 0.34). White also searches squared and interaction patterns and found one (p = 0.025). Before treating it as pure heteroskedasticity, I’d check the residual plot for a curve — a U-shape points to a missing nonlinear term in the equation. Fix the form, re-test, and if the variance still changes, use robust standard errors.',
  points:['Breusch–Pagan searches only linear patterns','White also searches squared/interaction patterns — a wider search','Not a contradiction: White found something BP couldn’t look for','Check functional form first, then robust standard errors if needed'],
  why:'Don’t choose the test that gives the answer you prefer.'},
]);

const regionById=id=>COURSE.regions.find(r=>r.id===id);
const liveNodes=reg=>reg.nodes.filter(id=>NODES[id]&&!NODES[id].sealed);
const regionDone=id=>{const r=regionById(id);if(!r)return true;const l=liveNodes(r);return l.length>0&&l.every(n=>SAVE.done[n]);};
const regionUnlocked=id=>{if(id==='hub')return true;const r=regionById(id);return !r.requires||regionDone(r.requires);};
function nodeState(id){const n=NODES[id];if(!n||n.sealed)return 'sealed';if(SAVE.done[id])return 'done';return SAVE.locked[id]?'frozen':'todo';}
const lessonId=(id,j)=>`${id}#L${j+1}`;
const lessonsOf=id=>NODES[id]?.lessons||[];
const lessonsDone=id=>lessonsOf(id).filter((_,j)=>SAVE.lessons[lessonId(id,j)]).length;
function lessonState(id,j){if(SAVE.lessons[lessonId(id,j)])return 'lessonDone';if(j>0&&!SAVE.lessons[lessonId(id,j-1)])return 'blocked';return SAVE.done[id]?'none':'lesson';}

  const rule=L&&!prev?(ld<L?`<p class="rule">Restore it with <b>at most one miss</b>. Miss ${FREEZE_AT} or more and it freezes until you finish its ${L} waypoints (${ld} done so far). Feeling unsure? The waypoints are on the path just before this stone.</p>`

  const b=btn(prev?'Study again':'Challenge the stone','primary');card.querySelector('.acts').appendChild(b);b.focus();
  b.onclick=()=>startSession(n.title,n.kicker,n.puzzles.map((_,idx)=>({node:id,idx})),items=>{

    if(wasDone){SAVE.done[id].best=Math.max(first,SAVE.done[id].best);persist();toast(`Studied again · ${first} / ${items.length} on the first try`);return;}

        toast(`<b>${esc(n.title)}</b> froze over · ${miss} misses. Finish its ${L} waypoints to thaw it.`,4200);}

let shake=0;
/* ice shell on frozen stones: grows on freeze, cracks as waypoints are finished, shatters on thaw */
const ICEFX={};const nowS=()=>performance.now()/1000;
function iceFrame(id){const L=lessonsOf(id).length,f=L?lessonsDone(id)/L:0,C=SPR.iceCracks;
  if(f<=0||!C)return SPR.ice;return f<.6||!C[1]?C[0]:C[1];}
function drawIce(g,o){
  const id=o.node,fx=ICEFX[id];
  if(fx){const e=nowS()-fx.t0;
    if(fx.k==='freeze'&&e<.7){const p=1-(1-e/.7)**3,S=SPR.ice,top=o.y+2-S.oy,h=S.h*p;
      g.save();g.beginPath();g.rect(o.x-S.ox-10,top+S.h-h,S.w+20,h+6);g.clip();const a=g.globalAlpha;g.globalAlpha=a*(.4+.6*p);
      drawSpr(g,S,o.x,o.y+2,.94+.06*p);g.globalAlpha=a;g.restore();return;}
    if(fx.k==='thaw'&&e<1.2){const C=SPR.iceCracks,S=C?C[C.length-1]:SPR.ice;
      if(e<.45){const j=e*6;drawSpr(g,S,o.x+rand(-j,j),o.y+2);return;}
      const k=(e-.45)/.75,a=g.globalAlpha;g.globalAlpha=a*(1-k)**1.5;drawSpr(g,S,o.x,o.y+2+k*6,1+k*.18);g.globalAlpha=a;return;}
    if(fx.k==='crack'&&e<.5&&SAVE.locked[id]){drawSpr(g,iceFrame(id),o.x+rand(-2,2)*(1-e*2),o.y+2);return;}
    delete ICEFX[id];}
  if(SAVE.locked[id])drawSpr(g,iceFrame(id),o.x,o.y+2);
}
function iceBurst(o,n){for(let i=0;i<n;i++){const a=rand(0,TAU),v=rand(30,160);emit({t:'spark',x:o.x+rand(-14,14),y:o.y-rand(10,70),vx:Math.cos(a)*v,vy:Math.sin(a)*v*.6,l:0,m:rand(.6,1.4),sz:rand(3,7)});}}
function crackFx(id){const o=stoneObj(id);ICEFX[id]={k:'crack',t0:nowS()};shake=.18;if(o&&FX.particles)iceBurst(o,18);}
function freezeFx(id){const o=stoneObj(id);ICEFX[id]={k:'freeze',t0:nowS()};shake=.45;if(!o||!FX.particles)return;
  for(let i=0;i<70;i++){const a=rand(0,TAU),v=rand(30,160);emit({t:'spark',x:o.x+rand(-14,14),y:o.y-rand(10,70),vx:Math.cos(a)*v,vy:Math.sin(a)*v*.6,l:0,m:rand(.6,1.4),sz:rand(3,7)});}}
function thawFx(id){const o=stoneObj(id);ICEFX[id]={k:'thaw',t0:nowS()};if(!o||!FX.particles)return;setTimeout(()=>iceBurst(o,60),450);shake=.25;
  for(let i=0;i<50;i++){emit({t:'mote',warm:1,x:o.x+rand(-20,20),y:o.y-rand(0,80),vx:rand(-20,20),vy:rand(-60,-20),l:0,m:rand(1,2),sz:rand(2,5),ph:rand(0,9)});}}
/* ---------- practice final: 2 questions from every module, mixed ---------- */
const EXAM_PER=2;
function examPool(){const pool={};for(const [id,n] of Object.entries(NODES)){const m=/^m(\d+)-[a-z]+$/.exec(id);if(!m||n.sealed||!n.puzzles||n.explain)continue;
  (pool[+m[1]]=pool[+m[1]]||[]).push(...n.puzzles.map((_,idx)=>({node:id,idx})));}return pool;}
function openExam(){
  const pool=examPool(),mods=Object.keys(pool).map(Number).sort((a,b)=>a-b),N=mods.length*EXAM_PER,E=SAVE.exam;
  showCard(`<div class="kicker">Village exam hall</div><h2>Practice final</h2>
    <p class="say">${N} questions — ${EXAM_PER} from each of Modules ${mods[0]}–${mods[mods.length-1]}, drawn at random from the study stones and shuffled, with fresh numbers where a question uses data. The clock runs while you work.</p>
    <p class="say"><b>Practice mode:</b> you see whether each answer is right and can try again; your score counts first tries. <b>Exam conditions:</b> one attempt per question, a countdown on each (75 s multiple choice, 2 min sorting, 2½ min calculations), and no feedback until the end — then you review every miss with its answer.</p>
    <p class="meta">Items don’t work here; the calculator does. Misses go to the review board.</p>
    ${E?`<p class="meta">Best: <b>${E.best} / ${E.n}</b> · last: ${E.last} / ${E.n} in ${fmtClock(E.time)} · taken ${E.count} time${E.count>1?'s':''}</p>`:''}<div class="acts"></div>`);
  const draw=()=>shuffle(mods.flatMap(m=>shuffle(pool[m]).slice(0,EXAM_PER)));
  const b=btn('Practice mode','sol'),c=btn('Exam conditions','primary');card.querySelector('.acts').append(b,c);c.focus();
  b.onclick=()=>startSession('Practice final','Village exam hall',draw(),res=>examResult(res,mods,false),'exam');
  c.onclick=()=>startSession('Practice final · exam conditions','Village exam hall',draw(),res=>examResult(res,mods,true),'examc');
}
setInterval(()=>{const c=document.getElementById('exClock');if(c&&run?.mode==='exam')c.textContent=fmtClock(Date.now()-run.t0);},500);
function examResult(items,mods,strict){
  const n=items.length,score=items.filter(x=>!x.missed).length;
  const by=m=>items.filter(x=>+/^m(\d+)/.exec(x.node)[1]===m);
  const prev=SAVE.exam;SAVE.exam={best:Math.max(score,prev?.best||0),last:score,n,time:examTime,count:(prev?.count||0)+1};SAVE.examHist=[...(SAVE.examHist||[]),{s:score,n,t:examTime,ts:Date.now(),c:strict?1:0}].slice(-12);persist();
  const weak=mods.filter(m=>by(m).some(x=>x.missed));
  const rows=mods.map(m=>{const its=by(m),ok=its.filter(x=>!x.missed).length;return `<tr><td class="mod">Module ${m}</td><td class="n ${ok===its.length?'ok':'no'}">${ok} / ${its.length}</td><td>${[...new Set(its.filter(x=>x.missed).map(x=>esc(NODES[x.node].title)))].join(', ')||'—'}</td></tr>`;}).join('');
  setTimeout(()=>{showCard(`<div class="kicker">Village exam hall · results</div><h2>${score} / ${n} on the first try</h2>
    <p class="say">${score>=n*.9?'Excellent — exam-ready across the board.':score>=n*.75?'Solid. Tighten up the modules marked below.':score>=n*.5?'Getting there. Revisit the stones listed below, and do their waypoints if you skipped them.':'Plenty to review — work through the waypoints and stones listed below, then try again.'} Time: <b>${fmtClock(examTime)}</b>.${prev?` Best so far: ${SAVE.exam.best} / ${n}.`:''}</p>
    <table class="tb exres"><tr><th>Module</th><th class="n">Right first try</th><th>Revisit</th></tr>${rows}</table>
    ${strict&&weak.length?`<details class="tools" open><summary>Review your ${n-score} miss${n-score>1?'es':''}</summary>${items.filter(x=>x.missed).map(x=>{const p=x.p,ans=p.type==='mc'?p.opts[p.a]:p.type==='num'?`${p.pre||''}${p.fmt?p.fmt(p.a):fmtNum(p.a,Math.abs(p.a)<10?3:2)}${p.unit?' '+p.unit:''}`:p.type==='order'?p.items.join(' → '):p.items.map(t=>`${t.t} → <i>${p.cats[t.c]}</i>`).join('<br>');
      return `<div class="miss"><p class="q">${p.q}${x.timedOut?' <em>(time ran out)</em>':''}</p><p><b>Answer:</b> ${ans}</p>${p.solution?`<p class="meta">${p.solution}</p>`:''}<p class="meta">${p.why||''}</p></div>`;}).join('')}</details>`:''}
    ${weak.length?`<p class="meta">Missed questions are pinned to the review board by the fire.</p>`:''}<div class="acts"></div>`);
    if(!SAVE.seen.barkExam){SAVE.seen.barkExam=1;quillSay('Your first practice final. Whatever the score, the misses are the gift — each one is now waiting on the review board.');}
    chime('restore');const a=btn('Take it again','primary'),c=btn('Close','sol');card.querySelector('.acts').append(a,c);a.onclick=openExam;c.onclick=closeCard;},60);
}
let examTime=0;
const reviewCount=()=>{const due=dueKeys().filter(k=>!SAVE.missed.some(m=>m.node+'|'+m.idx===k));return SAVE.missed.length+due.length;};
function openReview(){
  const miss=SAVE.missed.map(m=>({node:m.node,idx:m.idx})),due=dueKeys().filter(k=>!SAVE.missed.some(m=>m.node+'|'+m.idx===k)).map(k=>{const [node,idx]=k.split('|');return {node,idx:+idx};});
  if(!miss.length&&!due.length){
    const Q=SAVE.qs||{},next=Object.values(Q).filter(q=>q.box>0&&q.due).sort((a,b)=>a.due-b.due)[0];
    showCard(`<div class="kicker">Review board</div><h2>Nothing due right now</h2><p class="say">Two kinds of questions come back here: ones you <b>missed</b>, and ones you got right that are due for a <b>spaced refresher</b> — after 1 day, then 3, 7, 16 and 35. Spacing reviews out like this is the most reliable way to remember material on exam day.</p>${next?`<p class="meta">Next refresher due ${new Date(next.due).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}.</p>`:''}`);return;}
  const pickN=[...shuffle(miss).slice(0,6),...due].slice(0,8);
  showCard(`<div class="kicker">Review board</div><h2>${miss.length} missed · ${due.length} due for a refresher</h2>
    <p class="say">Here are ${pickN.length}, missed ones first, with fresh numbers where the question uses data. Get a missed question right first time and it comes off the board; get a refresher right and it comes back later, at a longer gap.</p><div class="acts"></div>`);
  const b=btn('Start review','primary');card.querySelector('.acts').appendChild(b);b.focus();
  b.onclick=()=>{startSession('Review board','Spaced review',pickN,items=>{
    let cleared=0;for(const it of items)if(!it.missed){SAVE.missed=SAVE.missed.filter(m=>!(m.node===it.node&&m.idx===it.idx));cleared++;}
    persist();toast(`Review done · ${cleared} of ${items.length} right first time · ${reviewCount()} left`);},'review');};
}

function renderLog(){

  let h=`<button class="close" id="logClose" aria-label="Close">×</button><div class="kicker">Quest log</div><h2>The course map</h2>`;

    const un=regionUnlocked(r.id),dn=regionDone(r.id);
    h+=`<section class="reg ${un?'':'locked'}"><div class="rh"><b>${esc(r.name)}</b><span>${dn?'Restored':un?'Open':'Sealed — restore '+esc(regionById(r.requires).name)+' first'}</span></div><div class="rs">${esc(r.sub)}</div><ul>`;
    for(const id of r.nodes){const n=NODES[id],st=nodeState(id),L=lessonsOf(id).length;h+=`<li>${icon(st)}<span>${esc(n?.title||id)}${L?`<small> · waypoints ${lessonsDone(id)}/${L}</small>`:''}</span><em>${st==='done'?`${SAVE.done[id].best} / ${n.puzzles.length}`:st==='sealed'?'later build':st==='frozen'?'frozen':''}</em></li>`;}
    const cs=r.nodes.filter(id=>NODES[id]?.cache);if(cs.length)h+=`<li class="cl"><i class="ic cache"></i><span>Supply caches found</span><em>${cs.filter(id=>SAVE.caches[id+'#C']).length} / ${cs.length}</em></li>`;
    h+=`</ul></section>`;
  }
  const acc=SAVE.stats.answered?Math.round(100*SAVE.stats.first/SAVE.stats.answered):0;
  h+=`<p class="meta">${invText()?`Carrying: ${invText()} · `:''}${SAVE.stats.answered} answered · ${acc}% right on the first try · ${SAVE.missed.length} pinned for review</p>
  <details class="tools" id="acctSec"><summary>Account &amp; cloud save</summary><div id="acctBox"></div></details>
  <details class="tools"><summary>Save &amp; transfer</summary><p class="meta">Progress saves in this browser automatically. To move it to another device, copy this code and paste it there.</p>

  $('copyCode').onclick=async()=>{try{await navigator.clipboard.writeText($('saveCode').value);$('toolMsg').textContent='Copied.';}catch(e){$('saveCode').select();$('toolMsg').textContent='Select the code above and copy it.';}};
  $('importBtn').onclick=()=>{const ta=$('saveCode');ta.readOnly=false;ta.value='';ta.focus();$('toolMsg').textContent='Paste your code, then press Load.';
    const b=$('importBtn');b.textContent='Load';b.onclick=()=>{try{const s=JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))));if(s.v!==1)throw 0;SAVE={...blankSave(),...s,reset:Date.now()};persist();travel(SAVE.scene,'start');L.classList.add('hidden');toast('Progress loaded.');}catch(e){$('toolMsg').textContent='That code could not be read.';}};};
  $('resetBtn').onclick=()=>{const b=$('resetBtn');if(b.dataset.arm){SAVE={...blankSave(),reset:Date.now()};persist();travel('hub','start');L.classList.add('hidden');toast('Progress reset.');}else{b.dataset.arm=1;b.textContent='Tap again to erase everything';}};

let nearI=null,fading=false;
const readBtn=$('readBtn');
// which interactable (if any) a tap at world point (wx,wy) is aimed at: its sprite body, above the anchor
function tapPick(wx,wy){let best=null,bd=1e9;for(const it of INTER){const dx=wx-it.x,dy=wy-(it.y-34);const d=Math.hypot(dx,dy*.7);if(d<48&&d<bd){bd=d;best=it;}}return best;}
function tryRead(){if(nearI&&!uiOpen())nearI.act();}
readBtn.onclick=tryRead;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='q'&&card.classList.contains('hidden'))toggleLog();if(k==='m'&&card.classList.contains('hidden'))toggleMap();if(k==='n'&&card.classList.contains('hidden'))toggleNotes();
  if(k==='escape'){closeCard();['log','map','notes'].forEach(x=>$(x).classList.add('hidden'));}
  if(k==='enter'&&!uiOpen())tryRead();});
function travel(to,spawnKey){
  fading=true;const f=$('fade');f.classList.add('on');
  setTimeout(()=>{setScene(to,spawnKey);persist();const reg=regionById(to);
    banner(reg?reg.name:COURSE.hubName,reg?reg.sub:COURSE.hubSub);
    f.classList.remove('on');setTimeout(()=>fading=false,250);},420);
}
function updateWorldLogic(dt){
  // gates
  for(const gt of GATES){gt.cool-=dt;const d=Math.hypot(player.x-gt.x,player.y-gt.y);
    gt.light.col=regionUnlocked(gt.to)?[255,200,120]:[120,140,200];
    if(d<44&&gt.cool<=0&&!fading){
      if(regionUnlocked(gt.to)){gt.cool=2;travel(gt.to,gt.spawnKey);}
      else{gt.cool=1.4;const r=regionById(gt.to);toast(`<b>${esc(r.name)}</b> is sealed. Restore every stone in ${esc(regionById(r.requires).name)} first.`);
        const nx=(player.x-gt.x)/(d||1),ny=(player.y-gt.y)/(d||1);player.vx=nx*220;player.vy=ny*220;tapTarget=null;}
    }}
  // stone lights follow quest state
  for(const L of lights)if(L.node){const s=nodeState(L.node);L.col=s==='done'?[120,230,150]:s==='sealed'?[110,125,190]:s==='frozen'?[140,205,255]:[255,205,120];L.i=s==='sealed'?.45:.85;}
  for(const o of objects)if(o.cache&&!SAVE.caches[o.cache+'#C']&&FX.particles&&Math.hypot(player.x-o.x,player.y-o.y)<380&&R()<dt*5)emit({t:'spark',x:o.x+rand(-12,12),y:o.y-rand(4,22),vx:rand(-6,6),vy:rand(-22,-8),l:0,m:rand(.6,1.2),sz:rand(2,4)});
  // tapped an object from afar: use it once we're close enough
  if(tapTarget?.it&&Math.hypot(player.x-tapTarget.it.x,player.y-tapTarget.it.y)<tapTarget.it.r){const it=tapTarget.it;tapTarget=null;if(!uiOpen())it.act();}
  // nearest interactable
  let best=null,bd=1e9;for(const it of INTER){const d=Math.hypot(player.x-it.x,player.y-it.y);if(d<it.r&&d<bd){bd=d;best=it;}}
  if(best!==nearI){nearI=best;readBtn.classList.toggle('hidden',!best);}
  if(best)readBtn.querySelector('span').textContent=best.label();
}

   Signed out, the game saves in this browser exactly as before. Signed in, every
   save is also written to saves/{uid} and pulled back on sign-in and when the tab
   regains focus. Two saves are merged: newest wins for position/settings/items,
   but finished stones, waypoints, caches and dialogue are kept from both, so
   playing on two devices never loses progress. A reset or an imported code
   replaces the cloud copy instead of merging. */

};

// sign-in only works on domains authorised in the Firebase console
const CLOUD_OK=/^(grittymcduff\.github\.io|localhost|127\.0\.0\.1)$/.test(location.hostname);
const CLOUD={fb:null,user:null,busy:false,timer:0,last:0,err:''};

async function fbLoad(){
  if(CLOUD.fb)return CLOUD.fb;
  if(window.__FB_MOCK)return CLOUD.fb=window.__FB_MOCK;           // test harness
  const u=m=>`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}.js`;
  const [A,Au,F]=await Promise.all([import(u('app')),import(u('auth')),import(u('firestore'))]);
  const app=A.initializeApp(FB_CONFIG),auth=Au.getAuth(app),db=F.getFirestore(app);
  return CLOUD.fb={
    onUser:cb=>Au.onAuthStateChanged(auth,cb),
    signIn:async()=>{const p=new Au.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
      try{await Au.signInWithPopup(auth,p);}catch(e){if(e.code==='auth/popup-blocked')return Au.signInWithRedirect(auth,p);throw e;}},
    signOut:()=>Au.signOut(auth),

    put:(uid,data)=>F.setDoc(F.doc(db,'saves',uid),data),
  };
}

/* merge two saves (see header) */
function mergeSaves(a,b){
  if(!b)return a;if(!a)return b;
  if((a.reset||0)!==(b.reset||0))return (a.reset||0)>(b.reset||0)?a:b;
  const [n,o]=(a.t||0)>=(b.t||0)?[a,b]:[b,a];
  const m=JSON.parse(JSON.stringify(n));
  for(const k of ['lessons','caches','seen'])m[k]={...(o[k]||{}),...(n[k]||{})};
  m.done={...(o.done||{})};
  for(const [id,v] of Object.entries(n.done||{}))m.done[id]=m.done[id]?{best:Math.max(m.done[id].best,v.best),ts:Math.min(m.done[id].ts||v.ts,v.ts||m.done[id].ts)}:v;
  m.locked={...(m.locked||{})};for(const id in m.done)delete m.locked[id];
  // items from caches only the older save opened
  for(const cid in o.caches||{})if(!(n.caches||{})[cid]){const it=NODES[cid.slice(0,-2)]?.cache?.item;if(it)m.inv[it]=(m.inv[it]||0)+1;}
  m.qs={...(o.qs||{})};for(const [k,v] of Object.entries(n.qs||{}))if(!m.qs[k]||v.n>=m.qs[k].n)m.qs[k]=v;
  m.days={...(o.days||{})};for(const [k,v] of Object.entries(n.days||{}))m.days[k]=Math.max(v,m.days[k]||0);
  if((o.examHist||[]).length>(n.examHist||[]).length)m.examHist=o.examHist;
  m.stats={answered:Math.max(n.stats?.answered||0,o.stats?.answered||0),first:Math.max(n.stats?.first||0,o.stats?.first||0)};
  return m;
}
const saveKey=s=>JSON.stringify({...s,t:0});

function cloudQueue(){if(!CLOUD.user)return;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudPush,2500);}
async function cloudPush(){
  if(!CLOUD.user)return;clearTimeout(CLOUD.timer);
  try{await CLOUD.fb.put(CLOUD.user.uid,{save:JSON.stringify(SAVE),t:SAVE.t||Date.now(),name:CLOUD.user.displayName||''});CLOUD.last=Date.now();CLOUD.err='';}
  catch(e){CLOUD.err='Could not reach the cloud — progress is still saved on this device.';}
  renderAcct();
}
async function cloudPull(first){
  if(!CLOUD.user||CLOUD.busy)return;CLOUD.busy=true;
  try{
    const d=await CLOUD.fb.get(CLOUD.user.uid);
    const remote=d?.save?JSON.parse(d.save):null;
    if(remote&&remote.v===1){
      const before=saveKey(SAVE),m=mergeSaves(SAVE,{...blankSave(),...remote,audioV:remote.audioV});
      if(saveKey(m)!==before){SAVE={...blankSave(),...m,inv:{...blankSave().inv,...(m.inv||{})}};migrateAudio();
        try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}
        syncMusic();syncSfx();renderHud();if(!$('log').classList.contains('hidden'))renderLog();
        if(first)toast('Cloud progress loaded.');}
      if(saveKey(m)!==saveKey(remote))await cloudPush();else{CLOUD.last=Date.now();CLOUD.err='';}
    }else await cloudPush();                                   // first sign-in: upload this device's progress
  }catch(e){CLOUD.err='Could not reach the cloud — progress is still saved on this device.';}
  CLOUD.busy=false;renderAcct();
}

/* ---------- chimes: small synthesized cues for big moments ---------- */
let chimeAC=null;
function chime(kind){
  const s=SAVE.sfx||{on:true,vol:.1};if(SAVE.muted||!s.on)return;
  try{chimeAC=chimeAC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const ac=chimeAC,t0=ac.currentTime+.02,out=ac.createGain();out.gain.value=Math.min(.5,Math.max(.12,s.vol*3.5));out.connect(ac.destination);
  const hz=n=>440*2**((n-69)/12);
  const SEQ={restore:[72,76,79,84],region:[67,72,76,79,84,88],thaw:[79,83,86],cache:[93,100,105],freeze:[88,83,79,76]};
  (SEQ[kind]||SEQ.restore).forEach((n,i)=>{const o=ac.createOscillator(),g=ac.createGain(),st=t0+i*(kind==='freeze'?.07:.11);
    o.type=kind==='freeze'?'sine':'triangle';o.frequency.value=hz(n);g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.35,st+.01);g.gain.exponentialRampToValueAtTime(.001,st+(kind==='region'?1.6:1.1));
    o.connect(g).connect(out);o.start(st);o.stop(st+1.7);});
  if(kind==='freeze'){const len=ac.sampleRate*.5,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len)**2;
    const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();src.buffer=b;f.type='highpass';f.frequency.value=3000;g.gain.value=.25;src.connect(f).connect(g).connect(out);src.start(t0);}
}

/* ---------- study report: where you're strong, where to focus, and one-tap targeted practice ----------
   Built from SAVE.qs (every answered question: attempts, first-try hits, last three outcomes).
   "Mastery" for an area = average of each answered question's last three outcomes, so recent
   work counts and old mistakes fade. Areas need 3+ answered questions before they're rated. */
const AREAS={
  1:'Regression basics — signs, cause vs. coincidence, reading a coefficient',
  2:'How the best-fit line works, holding factors constant, and R²',
  3:'Building a model step by step, odd data points, and categories (dummies)',
  4:'The ground rules behind regression, and reading residual plots',
  5:'Testing whether an effect is real: t-tests, p-values, confidence ranges, F-tests',
  6:'Cause and effect from experiments, and choosing which variables belong',
  7:'Choosing the right shape: curves, logs, and time delays',
  8:'Overlapping factors the model can’t tell apart (multicollinearity)',
  9:'Errors that carry over from one period to the next (serial correlation)',
  10:'Errors that grow with size (heteroskedasticity) and the tests for it',
};
const modOf=node=>+(/^m(\d+)/.exec(node)||[])[1];
const stoneOf=node=>node.split('#')[0];
function areaQuestions(m){  // every question that belongs to an area: stone challenges, waypoint practice, caches
  const out=[];for(const [id,n] of Object.entries(NODES)){if(modOf(id)!==m||!n.puzzles)continue;n.puzzles.forEach((_,i)=>out.push(id+'|'+i));}
  return out;}
function computeReport(){
  const Q=SAVE.qs||{},areas=[];let calc={n:0,ok:0},con={n:0,ok:0},ms=0;
  for(const [k,q] of Object.entries(Q)){const t=q.c?calc:con;t.n+=q.n;t.ok+=q.ok;ms+=q.ms||0;}
  for(let m=1;m<=10;m++){
    const keys=areaQuestions(m),seen=keys.filter(k=>Q[k]);
    const recent=seen.map(k=>{const h=Q[k].h;return [...h].reduce((s,c)=>s+ +c,0)/h.length;});
    const att=seen.reduce((s,k)=>s+Q[k].n,0),first=seen.reduce((s,k)=>s+Q[k].ok,0);
    const mastery=seen.length>=3?recent.reduce((a,b)=>a+b,0)/recent.length:null;
    const stones=[...new Set(keys.map(k=>stoneOf(k.split('|')[0])))].filter(id=>NODES[id]&&!id.includes('#'));
    const stoneM=stones.map(id=>{const ks=seen.filter(k=>stoneOf(k.split('|')[0])===id);if(ks.length<2)return null;
      return {id,m:ks.reduce((s,k)=>{const h=Q[k].h;return s+[...h].reduce((a,c)=>a+ +c,0)/h.length;},0)/ks.length};}).filter(Boolean).sort((a,b)=>a.m-b.m);
    const region=COURSE.regions.find(r=>r.nodes.some(id=>modOf(id)===m));
    const pinned=(SAVE.missed||[]).filter(x=>modOf(x.node)===m).length;
    areas.push({m,name:AREAS[m],total:keys.length,seen:seen.length,att,first,mastery,weakStone:stoneM[0],region,open:region?regionUnlocked(region.id):true,pinned});
  }
  // what to study next: weakest rated areas first, then open areas you haven't really started
  const rated=areas.filter(a=>a.mastery!==null&&a.mastery<.8).sort((a,b)=>a.mastery-b.mastery);
  const fresh=areas.filter(a=>a.mastery===null).sort((a,b)=>a.m-b.m);
  const focus=[...rated,...fresh].slice(0,3);
  const days=SAVE.days||{},today=new Date();let week=0,streak=0;
  for(let i=0;i<7;i++){const d=new Date(today-i*864e5).toLocaleDateString('en-CA');if(days[d])week++;}
  for(let i=0;i<365;i++){const d=new Date(today-i*864e5).toLocaleDateString('en-CA');if(days[d])streak++;else if(i>0)break;}
  return {areas,focus,calc,con,ms,week,streak,total:SAVE.stats.answered,first:SAVE.stats.first};
}

   if(C&&C.s.n+C.u.n>=5)h+=`<div class="today"><div><b>How well you know what you know</b><span>When you said <i>sure</i>: ${C.s.n?pct(C.s.ok/C.s.n):'—'} right (${C.s.n}) · when <i>not sure</i>: ${C.u.n?pct(C.u.ok/C.u.n):'—'} right (${C.u.n}).${sw.length?` <b>${sw.length} question${sw.length>1?'s':''} you were sure about but missed</b> — the riskiest gaps going into an exam.`:''}</span></div>${sw.length?'<button class="go" id="swGo">Practice these</button>':''}</div>`;}

      <div class="am">${a.seen} of ${a.total} questions tried${a.att?` · ${a.first} of ${a.att} right first time`:''}${!a.open?' · region not reached yet':''} · <button class="lnk" data-pr="${a.m}">practice</button></div></div>`;}
  h+=`</div>`;
  if(H.length>1){const mx=Math.max(...H.map(x=>x.n));h+=`<h3 class="rh">Practice final history</h3><div class="spark">${H.map(x=>`<i title="${x.s}/${x.n}" style="height:${Math.max(6,x.s/mx*100)}%"><span>${x.s}</span></i>`).join('')}</div>`;}
  h+=`<p class="meta">Mastery uses each question’s last three attempts, so improvement shows up quickly. Areas are rated after 3 different questions. ${mins?`About ${mins} min of question time so far.`:''}</p>`;
  const P=$('report');P.innerHTML=h;$('repClose').onclick=()=>P.classList.add('hidden');
  P.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{P.classList.add('hidden');practiceArea(+b.dataset.pr);});
  $('dailyGo')&&($('dailyGo').onclick=()=>{P.classList.add('hidden');openDaily();});
  $('swGo')&&($('swGo').onclick=()=>{P.classList.add('hidden');const ks=shuffle(Object.entries(SAVE.qs).filter(([k,q])=>q.sw&&NODES[k.split('|')[0]]).map(([k])=>k)).slice(0,8);
    startSession('Sure — but missed','Calibration practice',ks.map(k=>{const [node,idx]=k.split('|');return {node,idx:+idx};}),res=>{toast(`${res.filter(x=>!x.missed).length} / ${res.length} right this time`);},'focus');});
}
/* six questions from one area: missed and least-practised first, a few fresh ones mixed in */
function practiceArea(m){
  const Q=SAVE.qs||{},keys=areaQuestions(m);  // every area is open for practice, even before its region is reached
  const score=k=>{const q=Q[k];if(!q)return .55+Math.random()*.2;const h=q.h;return [...h].reduce((s,c)=>s+ +c,0)/h.length+Math.random()*.25;};
  const pickd=keys.map(k=>[k,score(k)]).sort((a,b)=>a[1]-b[1]).slice(0,6).map(x=>x[0]);
  if(!pickd.length){toast('Nothing to practice in that area yet.');return;}
  const items=shuffle(pickd).map(k=>{const [node,idx]=k.split('|');return {node,idx:+idx};});
  startSession(`Focused practice`,AREAS[m],items,res=>{const ok=res.filter(x=>!x.missed).length;
    toast(`Focused practice · ${ok} / ${res.length} on the first try`,3200);setTimeout(()=>{renderReport();$('report').classList.remove('hidden');},400);},'focus');
}
function toggleReport(){const P=$('report');if(P.classList.contains('hidden')){$('log').classList.add('hidden');$('map').classList.add('hidden');$('notes').classList.add('hidden');renderReport();P.classList.remove('hidden');keys.clear();}else P.classList.add('hidden');}
$('repBtn').onclick=toggleReport;
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='p'&&card.classList.contains('hidden')&&!(e.target instanceof HTMLInputElement))toggleReport();if(e.key==='Escape')$('report').classList.add('hidden');});

/* ==== js/09_sfx.js ==== */
/* ---------- ambient sound + footsteps (Web Audio, from recorded clips) ----------
   - Footsteps: one crunch per step from a sprite of 10 slices per surface
     (snow / gravel on paths and the plaza; none while gliding on ice), pitch and
     level varied a little so it never sounds like a loop; louder when jogging.
   - Wind: two seamless wind/room-tone loops layered; level per region.
   - Birds: an occasional distant bird call in the woods, hollow and village,
     not at night or under the aurora.
   Controlled by "Ambient sounds" in the Effects panel (saved). */
const Sfx=(()=>{
  let ac=null,master=null,started=false,on=true,vol=.7,lastSlot=-1,birdT=0,region='hub';
  const B={};const SLOT=.4,NSLOT=10;
  const FILES={snow:'sfx_steps_snow.mp3',gravel:'sfx_steps_gravel.mp3',wind1:'amb_wind_1.mp3',wind2:'amb_wind_2.mp3',
               birds1:'amb_birds_1.mp3',birds2:'amb_birds_2.mp3',birds3:'amb_birds_3.mp3'};
  const WIND={hub:[.55,.35],woods:[.6,.5],hollow:[.4,.3],reach:[.75,.6]};
  const BIRDS={hub:.5,woods:.8,hollow:.6,reach:0};
  const wind=[];
  async function load(k){try{const r=await fetch(ART.base+FILES[k]);B[k]=await ac.decodeAudioData(await r.arrayBuffer());}catch(e){}}
  function startWind(){for(const [i,k] of ['wind1','wind2'].entries()){if(!B[k]||wind[i])continue;
    const s=ac.createBufferSource(),g=ac.createGain();s.buffer=B[k];s.loop=true;g.gain.value=0;s.connect(g).connect(master);
    s.start(0,i*7.3);wind[i]=g;}setRegion(region,true);}
  function setRegion(id,force){if(id===region&&!force)return;region=id;if(!ac)return;
    const w=WIND[id]||WIND.hub;wind.forEach((g,i)=>g&&g.gain.setTargetAtTime(w[i],ac.currentTime,2.5));}
  function level(){if(master)master.gain.setTargetAtTime(on?vol:0,ac.currentTime,.3);}
  function tick(dt){
    if(!ac||!on)return;birdT-=dt;
    if(birdT<=0){birdT=25+Math.random()*45;
      const g=BIRDS[region]||0,dark=todKey==='night'||todKey==='aurora',ks=['birds1','birds2','birds3'].filter(k=>B[k]);
      if(g&&!dark&&ks.length){const k=ks[Math.floor(Math.random()*ks.length)],s=ac.createBufferSource(),gn=ac.createGain(),p=ac.createStereoPanner();
        s.buffer=B[k];gn.gain.value=g*(.6+Math.random()*.4);p.pan.value=Math.random()*1.4-.7;s.connect(gn).connect(p).connect(master);
        const off=Math.random()*Math.max(0,s.buffer.duration-12);s.start(0,off,10+Math.random()*6);
        gn.gain.setValueAtTime(0,ac.currentTime);gn.gain.linearRampToValueAtTime(g,ac.currentTime+1.5);
        gn.gain.setTargetAtTime(0,ac.currentTime+8,1.5);}}
  }
  return{
    async start(){if(started)return;started=true;
      ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0;master.connect(ac.destination);level();
      birdT=8+Math.random()*10;
      await Promise.all(Object.keys(FILES).map(load));startWind();},
    step(surface,speed,side){
      if(!ac||!on||surface===2)return;const k=surface===1?'gravel':'snow',b=B[k];if(!b)return;
      let slot=Math.floor(Math.random()*NSLOT);if(slot===lastSlot)slot=(slot+1)%NSLOT;lastSlot=slot;
      const s=ac.createBufferSource(),g=ac.createGain(),p=ac.createStereoPanner();
      s.buffer=b;s.playbackRate.value=.9+Math.random()*.18+(speed>200?.06:0);
      g.gain.value=(surface===1?.3:.45)*Math.min(1,.45+speed/260)*(.85+Math.random()*.3);p.pan.value=side*.12;
      s.connect(g).connect(p).connect(master);s.start(0,slot*SLOT,SLOT-.02);},
    set(o,v){on=o;vol=v;if(ac&&ac.state==='suspended')ac.resume();level();},
    setRegion,tick,get started(){return started;},
  };
})();
const sfxOn=$('sfxOn'),sfxVol=$('sfxVol');
function syncSfx(){const s=SAVE.sfx||{on:true,vol:.1};sfxOn.checked=s.on;sfxVol.value=Math.round(s.vol*100);Sfx.set(s.on&&!SAVE.muted,s.vol);syncMute();}
// quick mute for music + ambience (top bar); narration has its own switch
const muteBtn=$('muteBtn');
function syncMute(){muteBtn.textContent=SAVE.muted?'🔇':'🔊';muteBtn.title=SAVE.muted?'Sound is muted — click to unmute music and ambience':'Mute music and ambience';muteBtn.setAttribute('aria-pressed',SAVE.muted?'true':'false');}
muteBtn.onclick=()=>{SAVE.muted=!SAVE.muted;Music.start();Sfx.start();syncMusic();syncSfx();persist();toast(SAVE.muted?'Music and ambience muted.':'Sound on.');};
sfxOn.onchange=()=>{SAVE.sfx={...(SAVE.sfx||{}),on:sfxOn.checked};Sfx.start();syncSfx();persist();};
sfxVol.oninput=()=>{SAVE.sfx={...(SAVE.sfx||{}),vol:sfxVol.value/100};Sfx.start();syncSfx();};
sfxVol.onchange=persist;
{const go=()=>{removeEventListener('pointerdown',go);removeEventListener('keydown',go);Sfx.start();syncSfx();Sfx.setRegion(curScene||'hub');};
 addEventListener('pointerdown',go);addEventListener('keydown',go);}
syncSfx();

}
