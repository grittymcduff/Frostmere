<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Frostmere — Study Quest</title>
<style>
  html,body{margin:0;height:100%;background:#070b16;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;

  #card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,88vw);padding:20px 22px;

  #card .opts button.no{background:rgba(190,70,60,.25);border-color:#e07a6e}

  #readBtn{animation-name:popb} @keyframes popb{from{opacity:0;transform:translate(-50%,8px)}}

  #hud .t1{font-size:17px} #hud .line{margin-top:6px;font-size:12px;color:#cfe6ff}

  .topbtns button{padding:9px 14px;font:inherit;font-size:13px;color:#ffe2a8;cursor:pointer;min-height:40px}
  #fxBtn{position:static} #fx{top:62px}
  #readBtn span{pointer-events:none}
  #card{z-index:7;width:min(580px,94vw);max-height:min(88vh,88dvh);overflow:auto;box-sizing:border-box;padding:22px 22px 18px;color:#f3ead8}

  .chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:6px 12px;min-height:38px;font-size:13.5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,214,150,.25)}

  ol.ord{padding:0;margin:0;list-style:none;counter-reset:o}ol.ord li{counter-increment:o;display:flex;align-items:center;gap:8px;padding:8px 10px;margin:6px 0;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,214,150,.18);font-size:15px}
  ol.ord li::before{content:counter(o);font-size:12px;opacity:.6;width:16px}ol.ord li span{flex:1}
  ol.ord li.good{border-color:#7fd39a}ol.ord li.bad{border-color:#e07a6e}
  .mv{width:40px;height:40px;border-radius:8px;border:1px solid rgba(255,214,150,.3);background:rgba(0,0,0,.2);color:#ffe2a8;cursor:pointer;font-size:12px}
  .mv:disabled{opacity:.25;cursor:default}
  .xl,.tb,.eqbox,.fig{font-family:Calibri,'Segoe UI',Arial,sans-serif}
  .xl{background:#fbfbf8;color:#1d1d1d;border-radius:8px;padding:10px 8px 6px;margin:8px 0;font-size:12px}

  .xl table:first-of-type{width:auto}
  .tb{background:rgba(255,255,255,.04);border-radius:8px;font-size:14px}.tb th{font-weight:normal;opacity:.7;padding:6px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.15)}
  .tb td{padding:5px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
  .scroll{overflow-x:auto}

  #log h2{margin:2px 0 10px;font-size:20px;color:#ffe2a8;font-weight:normal}
  #log .kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}

  .reg{padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}.reg.locked{opacity:.55}
  .rh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.rh b{font-weight:normal;font-size:16px;color:#ffe2a8}.rh span{font-size:11.5px;opacity:.7;text-align:right}
  .rs{font-size:12px;opacity:.6;margin:2px 0 6px;font-style:italic}

  .ic.done{background:#3e9a62;color:#eafff0}.ic.todo{background:#f1c25c;color:#4a2a08;font-weight:bold}.ic.sealed{background:rgba(255,255,255,.12)}
  .tools{margin-top:8px}.tools summary{cursor:pointer;font-size:13.5px;color:#ffe2a8;padding:6px 0}
  .tools textarea{width:100%;box-sizing:border-box;font:12px monospace;background:rgba(0,0,0,.3);color:#f3ead8;border:1px solid rgba(255,214,150,.25);border-radius:8px;padding:8px}
  .tools .acts{justify-content:flex-start}.tools button{font:inherit;font-size:13px;padding:8px 12px;border-radius:8px;cursor:pointer;background:rgba(255,255,255,.05);color:#f3ead8;border:1px solid rgba(255,214,150,.25);min-height:40px}
  #toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-10px);padding:10px 16px;font-size:14px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:calc(100vw - 40px);text-align:center;z-index:6}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #banner{z-index:3;position:fixed;left:50%;top:30%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;width:90vw}

  #banner span{display:block;margin-top:6px;font-size:15px;font-style:italic;color:#e6eefc;text-shadow:0 1px 8px rgba(0,0,0,.7)}

  @keyframes ban{0%{opacity:0;transform:translate(-50%,10px)}15%,70%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
  #fade{position:fixed;inset:0;background:#05080f;opacity:0;pointer-events:none;transition:opacity .4s;z-index:9}#fade.on{opacity:1}
  @media (max-width:600px){#hud{padding:8px 11px}#hud .t1{font-size:15px}#hud .t2{display:none}.topbtns button{padding:8px 10px;font-size:12px}#card{padding:18px 14px 14px}}
  @media (prefers-reduced-motion:reduce){#banner.on{animation:none;opacity:1}#toast,#fade{transition:none}}
  .rule{font-size:14px;line-height:1.5;background:rgba(140,205,255,.1);border-left:3px solid #8cc8f0;padding:9px 12px;border-radius:6px}
  .teach{font-size:15.5px;line-height:1.6}.teach p{margin:8px 0}.teach .ex{background:rgba(255,226,168,.08);border:1px solid rgba(255,226,168,.22);border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14.5px}
  .teach b{color:#ffe2a8}
  ul.wl{list-style:none;padding:0;margin:10px 0}ul.wl li{display:flex;gap:9px;align-items:center;padding:5px 0;font-size:15px}ul.wl li.blocked{opacity:.55}
  .ic.frozen{background:#2b5f8a;color:#dff3ff}.reg li small{opacity:.55;font-size:11.5px}
  .ptools{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
  .ptools .tool{font:inherit;font-size:13px;padding:6px 11px;min-height:36px;border-radius:999px;cursor:pointer;background:rgba(255,255,255,.06);color:#f3ead8;border:1px solid rgba(255,214,150,.3)}
  .ptools .tool.item{border-color:rgba(140,205,255,.45);color:#d8efff}.ptools .tool i{font-style:normal;opacity:.7;margin-left:4px}

  #card button.opt.gone{text-decoration:line-through;opacity:.35}
  .fb.info{padding:10px 12px;background:rgba(140,205,255,.1);border-left:3px solid #8cc8f0}
  #hud .inv{color:#d8efff;font-size:12px}
  .ic.cache{background:#7a4e30}.reg li.cl{opacity:.85}
  #calc{position:fixed;right:12px;bottom:12px;width:min(330px,calc(100vw - 24px));z-index:8;padding:12px;box-sizing:border-box;max-height:calc(100dvh - 24px);overflow:auto}

  #cIn{width:100%;box-sizing:border-box;font:16px/1.3 ui-monospace,Menlo,Consolas,monospace;padding:9px 10px;border-radius:8px;border:1px solid rgba(255,214,150,.4);background:rgba(0,0,0,.3);color:#fff}
  .cout{font:15px ui-monospace,Menlo,Consolas,monospace;min-height:20px;margin:6px 2px;color:#cfe6ff}.cout.ok{color:#a9eabd}.cout.err{color:#ffb4a8;font-family:inherit;font-size:13px}

  body{position:fixed;inset:0}

<script>
{
/* ==== js/00_head.js ==== */
'use strict';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 2000, H = 1500;              // world size
const GS = 1.5;                     // ground texture resolution multiplier
const SS = 2;                       // sprite cache resolution multiplier
let VW = 0, VH = 0, DPR = 1, ZOOM = 1;


/* ==== js/01_utils.js ==== */
/* ---------- utils ---------- */
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R = mulberry(20261124);
const rand = (a,b) => a + R()*(b-a);
const pick = a => a[(R()*a.length)|0];
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const TAU = Math.PI*2;
function ell(g,x,y,rx,ry,rot=0){g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU);g.fill();}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,Math.max(.1,r),0,TAU);g.fill();}
function canvas(w,h){const c=document.createElement('canvas');c.width=Math.ceil(w);c.height=Math.ceil(h);return c;}
function rgba(c,a){return `rgba(${c[0]},${c[1]},${c[2]},${a})`;}
function makeSprite(w,h,ox,oy,fn){
  const c=canvas(w*SS,h*SS), g=c.getContext('2d');
  g.scale(SS,SS); g.translate(ox,oy); fn(g);
  return {cv:c,w,h,ox,oy};
}
function softDot(col,size=64){
  const c=canvas(size,size),g=c.getContext('2d'),r=size/2;
  const gr=g.createRadialGradient(r,r,0,r,r,r);
  gr.addColorStop(0,rgba(col,1));gr.addColorStop(.35,rgba(col,.55));gr.addColorStop(1,rgba(col,0));
  g.fillStyle=gr;g.fillRect(0,0,size,size);return c;
}


/* ==== js/02_layout_ground.js ==== */
/* ---------- world layout ---------- */
// Scene layout — assigned by setScene() in 06_world.js
let PLAZA, POND, GROVE=null, PATHS=[], PATH_SAMPLES=[], CLEARINGS=[], GROUND_TINT=null, SCENE={};
function sampleCurve(pts,step){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    const n=Math.max(2,Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/step));
    for(let j=0;j<n;j++){
      const t=j/n,t2=t*t,t3=t2*t;
      const f=(a,b,c,d)=>.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      out.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])]);
    }
  }
  out.push(pts[pts.length-1]);return out;
}

/* surface grid: 0 snow, 1 path/plaza, 2 ice */
const GC = 10; let GW = W/GC, GH = H/GC, surf = new Uint8Array(GW*GH);
function sizeWorld(w,h){W=w;H=h;GW=W/GC;GH=H/GC;surf=new Uint8Array(GW*GH);ground.width=W*GS;ground.height=H*GS;}
function buildSurface(){
  PATH_SAMPLES=PATHS.map(p=>sampleCurve(p,6));
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    const x=gx*GC+5,y=gy*GC+5;let s=0;
    if(Math.hypot(x-PLAZA.x,(y-PLAZA.y)*1.15)<PLAZA.r+8) s=1;
    for(const c of CLEARINGS)if(Math.hypot(x-c.x,(y-c.y)*1.15)<c.r)s=1;
    const ex=(x-POND.x)/POND.rx, ey=(y-POND.y)/POND.ry;
    if(ex*ex+ey*ey<0.92) s=2;
    surf[gy*GW+gx]=s;
  }
  for(const smp of PATH_SAMPLES)for(const [x,y] of smp){
    for(let dy=-40;dy<=40;dy+=GC)for(let dx=-40;dx<=40;dx+=GC){
      if(dx*dx+dy*dy>36*36)continue;
      const gx=((x+dx)/GC)|0, gy=((y+dy)/GC)|0;
      if(gx>=0&&gy>=0&&gx<GW&&gy<GH&&surf[gy*GW+gx]!==2) surf[gy*GW+gx]=1;
    }
  }
}
function surfaceAt(x,y){const gx=(x/GC)|0,gy=(y/GC)|0;if(gx<0||gy<0||gx>=GW||gy>=GH)return 0;return surf[gy*GW+gx];}

/* ---------- ground painting (done once) ---------- */
const ground = canvas(W*GS,H*GS);
function paintGround(){
  const g=ground.getContext('2d'); g.setTransform(GS,0,0,GS,0,0); g.globalCompositeOperation='source-over'; g.globalAlpha=1;
  let gr=g.createLinearGradient(0,0,W*.4,H);gr.addColorStop(0,'#dbe5f1');gr.addColorStop(1,'#c3d1e3');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  if(GROUND_IMG){const pat=g.createPattern(GROUND_IMG,'repeat');pat.setTransform(new DOMMatrix().scale(ART.groundScale||.5));g.fillStyle=pat;g.fillRect(0,0,W,H);}

  // soft drifts
  for(let i=0;i<460;i++){
    const x=rand(-50,W+50),y=rand(-50,H+50),r=rand(40,230),light=R()<.55;
    const c=light?[246,250,253]:[150,172,204], a=light?.55:.26;
    const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,rgba(c,a));rg.addColorStop(1,rgba(c,0));
    g.fillStyle=rg;g.beginPath();g.ellipse(x,y,r,r*.62,0,0,TAU);g.fill();
  }
  // wind-carved drift ridges (shadow under a bright lip)
  for(let i=0;i<90;i++){
    const x=rand(0,W),y=rand(0,H),w=rand(40,130),rot=rand(-.25,.25);
    g.save();g.translate(x,y);g.rotate(rot);
    g.fillStyle='rgba(120,145,185,.16)';ell(g,4,5,w,w*.16);
    g.fillStyle='rgba(255,255,255,.45)';ell(g,0,0,w*.95,w*.11);
    g.restore();
  }
  // forest-floor shadow toward edges
  const edge=(x0,y0,x1,y1)=>{const e=g.createLinearGradient(x0,y0,x1,y1);e.addColorStop(0,'rgba(40,58,96,.42)');e.addColorStop(1,'rgba(40,58,96,0)');g.fillStyle=e;g.fillRect(0,0,W,H);};
  edge(0,0,0,260);edge(0,H,0,H-200);edge(0,0,240,0);edge(W,0,W-240,0);

  // trodden ground under paths
  for(const smp of PATH_SAMPLES){
    for(const [w,a] of [[96,.10],[74,.13],[56,.14]]){
      g.strokeStyle=`rgba(128,118,116,${a})`;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';
      g.beginPath();smp.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();
    }
  }
  // plaza trodden + melted ring around fire
  let pg=g.createRadialGradient(PLAZA.x,PLAZA.y,0,PLAZA.x,PLAZA.y,PLAZA.r+50);
  pg.addColorStop(0,'rgba(110,96,92,.55)');pg.addColorStop(.25,'rgba(120,110,108,.35)');pg.addColorStop(1,'rgba(120,110,108,0)');
  g.fillStyle=pg;g.beginPath();g.ellipse(PLAZA.x,PLAZA.y,PLAZA.r+50,(PLAZA.r+50)*.87,0,0,TAU);g.fill();

  for(const c of CLEARINGS){const cg=g.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r+40);
    cg.addColorStop(0,'rgba(120,110,108,.32)');cg.addColorStop(1,'rgba(120,110,108,0)');g.fillStyle=cg;ell(g,c.x,c.y,c.r+40,(c.r+40)*.87);}
  // cobbles along paths
  const cobble=(x,y,rx,ry,rot)=>{
    g.save();g.translate(x,y);g.rotate(rot);
    g.fillStyle='rgba(50,60,85,.22)';ell(g,1,1.4,rx+.5,ry+.5);
    const base=pick([[132,138,150],[118,125,140],[146,146,150],[128,120,110],[110,118,132]]);
    const cg=g.createLinearGradient(-rx,-ry,rx,ry);cg.addColorStop(0,rgba(base.map(v=>Math.min(255,v+30)),1));cg.addColorStop(1,rgba(base.map(v=>v-14),1));
    g.fillStyle=cg;ell(g,0,0,rx,ry);
    if(R()<.7){g.fillStyle='rgba(246,249,253,.9)';ell(g,-rx*.1,-ry*.38,rx*.8,ry*.5);}
    g.restore();
  };
  for(const smp of PATH_SAMPLES){
    for(let i=2;i<smp.length-2;i+=2){
      const [x,y]=smp[i],[x2,y2]=smp[i+1],ang=Math.atan2(y2-y,x2-x),nx=-Math.sin(ang),ny=Math.cos(ang);
      for(let k=-3;k<=3;k++){
        if(R()<.12+Math.abs(k)*.16)continue;
        const off=k*10+rand(-2,2);
        cobble(x+nx*off+rand(-2,2),y+ny*off+rand(-2,2),rand(4.6,7),rand(3.4,5),ang+rand(-.5,.5));
      }
    }
  }
  for(let r=32;r<PLAZA.r;r+=11){
    const n=Math.floor(TAU*r/12);
    for(let i=0;i<n;i++){
      if(R()<.1+(r/PLAZA.r)*.25)continue;
      const a=i/n*TAU+rand(-.05,.05)+r;
      cobble(PLAZA.x+Math.cos(a)*r,PLAZA.y+Math.sin(a)*r*.87,rand(4.8,6.6),rand(3.5,4.8),a+Math.PI/2);
    }
  }
  if(SCENE.fire){ // fire scorch
  pg=g.createRadialGradient(PLAZA.x,PLAZA.y+4,0,PLAZA.x,PLAZA.y+4,52);
  pg.addColorStop(0,'rgba(50,36,30,.75)');pg.addColorStop(1,'rgba(70,56,50,0)');g.fillStyle=pg;ell(g,PLAZA.x,PLAZA.y+4,52,44);}

  // pond
  g.fillStyle='rgba(110,135,175,.35)';ell(g,POND.x+6,POND.y+10,POND.rx+22,POND.ry+18);
  g.fillStyle='rgba(250,252,255,.9)';ell(g,POND.x,POND.y-2,POND.rx+14,POND.ry+12);
  g.save();g.beginPath();g.ellipse(POND.x,POND.y,POND.rx,POND.ry,0,0,TAU);g.clip();
  let ig=g.createRadialGradient(POND.x-60,POND.y-40,10,POND.x,POND.y,POND.rx*1.1);
  ig.addColorStop(0,'#bfdbea');ig.addColorStop(.55,'#86b2cf');ig.addColorStop(1,'#5b85a9');
  g.fillStyle=ig;g.fillRect(POND.x-POND.rx,POND.y-POND.ry,POND.rx*2,POND.ry*2);
  // inner shadow from the bank
  g.strokeStyle='rgba(60,90,130,.35)';g.lineWidth=18;g.beginPath();g.ellipse(POND.x+4,POND.y+8,POND.rx,POND.ry,0,0,TAU);g.stroke();
  // reflections
  g.globalCompositeOperation='lighter';
  for(let i=0;i<9;i++){const x=POND.x+rand(-POND.rx,POND.rx*.6),y=POND.y+rand(-POND.ry,POND.ry);
    g.strokeStyle=`rgba(255,255,255,${rand(.06,.16)})`;g.lineWidth=rand(4,14);
    g.beginPath();g.moveTo(x,y);g.lineTo(x+70,y-46);g.stroke();}
  g.globalCompositeOperation='source-over';
  // cracks
  for(let i=0;i<14;i++){let x=POND.x+rand(-POND.rx*.8,POND.rx*.8),y=POND.y+rand(-POND.ry*.7,POND.ry*.7),a=rand(0,TAU);
    g.strokeStyle=`rgba(240,250,255,${rand(.35,.7)})`;g.lineWidth=rand(.6,1.3);g.beginPath();g.moveTo(x,y);
    for(let s=0;s<6;s++){a+=rand(-.7,.7);x+=Math.cos(a)*rand(8,20);y+=Math.sin(a)*rand(5,12);g.lineTo(x,y);
      if(R()<.3){g.moveTo(x,y);g.lineTo(x+rand(-10,10),y+rand(-8,8));g.moveTo(x,y);}}
    g.stroke();}
  // dusted snow patches on ice
  for(let i=0;i<16;i++){const x=POND.x+rand(-POND.rx*.9,POND.rx*.9),y=POND.y+rand(-POND.ry*.8,POND.ry*.8),r=rand(10,34);
    const sg=g.createRadialGradient(x,y,0,x,y,r);sg.addColorStop(0,'rgba(245,250,255,.55)');sg.addColorStop(1,'rgba(245,250,255,0)');g.fillStyle=sg;ell(g,x,y,r,r*.55);}
  g.restore();
  // snow lip around pond
  for(let i=0;i<70;i++){const a=i/70*TAU,x=POND.x+Math.cos(a)*POND.rx*1.01,y=POND.y+Math.sin(a)*POND.ry*1.01;
    g.fillStyle='rgba(120,148,188,.28)';ell(g,x+2,y+3,rand(9,16),rand(4,7));
    g.fillStyle='rgba(250,252,255,.95)';ell(g,x,y,rand(8,15),rand(3.5,6.5));}

  // grass tufts & twigs poking through snow
  for(let i=0;i<620;i++){
    const x=rand(0,W),y=rand(0,H);if(surfaceAt(x,y)!==0)continue;
    const n=(rand(3,8))|0;
    for(let k=0;k<n;k++){
      const bx=x+rand(-6,6),by=y+rand(-3,3),h=rand(4,11),lean=rand(-4,4);
      g.strokeStyle=pick(['#5b4a3a','#6c6447','#44584c','#7a6448','#3d4c4a']);g.lineWidth=rand(.7,1.4);
      g.beginPath();g.moveTo(bx,by);g.quadraticCurveTo(bx+lean*.3,by-h*.6,bx+lean,by-h);g.stroke();
    }
    g.fillStyle='rgba(250,252,255,.85)';ell(g,x,y+1,7,2.4);
  }
  // sparkle specks
  for(let i=0;i<2400;i++){g.fillStyle=R()<.8?`rgba(255,255,255,${rand(.4,.9)})`:`rgba(170,200,235,${rand(.3,.6)})`;
    const x=rand(0,W),y=rand(0,H);g.fillRect(x,y,rand(.6,1.5),rand(.6,1.5));}
  if(GROUND_TINT){g.globalCompositeOperation='multiply';g.fillStyle=GROUND_TINT;g.fillRect(0,0,W,H);g.globalCompositeOperation='source-over';}
}

/* ---------- sprite factories ---------- */
function makeCabin(w){
  const bodyH=74, roofH=98, ov=16, cw=w+70, ch=bodyH+roofH+46;
  const doorX=rand(-w*.15,w*.15), info={windows:[],chimney:null,w,bodyH,roofH};
  const spr=makeSprite(cw,ch,cw/2,bodyH+roofH+26,g=>{
    g.fillStyle='rgba(40,55,95,.28)';ell(g,14,-4,w/2+34,24);
    // foundation stones
    g.fillStyle='#5d6270';g.fillRect(-w/2,-12,w,12);
    for(let x=-w/2+4;x<w/2;x+=rand(9,13)){g.fillStyle=pick(['#8a8f9c','#7a808e','#969aa4']);ell(g,x,-6,rand(5,7),rand(4,5.5));
      g.fillStyle='rgba(250,252,255,.8)';ell(g,x-1,-9,3.5,1.6);}
    // log walls
    for(let y=-bodyH;y<-12;y+=11){
      const lg=g.createLinearGradient(0,y,0,y+11);lg.addColorStop(0,'#94694a');lg.addColorStop(.45,'#76503a');lg.addColorStop(1,'#4d3224');
      g.fillStyle=lg;g.beginPath();g.roundRect(-w/2-4,y,w+8,11,5);g.fill();
      g.strokeStyle='rgba(40,24,16,.35)';g.lineWidth=.8;for(let k=0;k<3;k++){const x=rand(-w/2,w/2);g.beginPath();g.moveTo(x,y+5);g.lineTo(x+rand(8,20),y+5.5);g.stroke();}
      for(const sx of [-1,1]){g.fillStyle='#c09366';circ(g,sx*(w/2+4),y+5.5,5.6);g.strokeStyle='#7d5638';g.lineWidth=1;g.beginPath();g.arc(sx*(w/2+4),y+5.5,3,0,TAU);g.stroke();}
    }
    // wall shading (light from upper left)
    const sh=g.createLinearGradient(-w/2,0,w/2,0);sh.addColorStop(0,'rgba(255,220,180,.08)');sh.addColorStop(1,'rgba(20,20,50,.3)');
    g.fillStyle=sh;g.fillRect(-w/2-4,-bodyH,w+8,bodyH-12);
    // door
    g.fillStyle='#2a1a12';g.beginPath();g.roundRect(doorX-18,-56,36,46,[14,14,0,0]);g.fill();
    const dg=g.createLinearGradient(doorX-15,0,doorX+15,0);dg.addColorStop(0,'#6a4128');dg.addColorStop(1,'#432818');
    g.fillStyle=dg;g.beginPath();g.roundRect(doorX-15,-53,30,43,[12,12,0,0]);g.fill();
    g.strokeStyle='rgba(20,10,5,.5)';g.lineWidth=1;for(let k=-1;k<=1;k++){g.beginPath();g.moveTo(doorX+k*8,-50);g.lineTo(doorX+k*8,-10);g.stroke();}
    g.fillStyle='#e3b860';circ(g,doorX+9,-30,1.8);
    g.fillStyle='rgba(250,252,255,.95)';ell(g,doorX,-8,22,4);
    // windows
    for(const wx of [doorX-w*.3,doorX+w*.3]){
      if(Math.abs(wx)>w/2-18)continue;
      const wy=-bodyH+18;
      g.fillStyle='#2b1a10';g.fillRect(wx-16,wy-3,32,28);
      const wg=g.createRadialGradient(wx,wy+11,2,wx,wy+11,20);wg.addColorStop(0,'#fff1c4');wg.addColorStop(.6,'#ffc463');wg.addColorStop(1,'#d9822e');
      g.fillStyle=wg;g.fillRect(wx-13,wy,26,22);
      g.fillStyle='#2b1a10';g.fillRect(wx-1.2,wy,2.4,22);g.fillRect(wx-13,wy+10,26,2.4);
      g.fillStyle='rgba(250,252,255,.95)';g.beginPath();g.roundRect(wx-18,wy+23,36,5,3);g.fill();
      info.windows.push([wx,wy+11]);
    }
    // roof
    const y0=-bodyH+4, top=y0-roofH;
    g.fillStyle='#2e211b';g.beginPath();g.moveTo(-w/2-ov,y0+7);g.lineTo(w/2+ov,y0+7);g.lineTo(w/2+ov-10,top+6);g.lineTo(-w/2-ov+10,top+6);g.closePath();g.fill();
    // shadow cast by the eave onto the wall
    const es=g.createLinearGradient(0,y0,0,y0+22);es.addColorStop(0,'rgba(15,10,25,.55)');es.addColorStop(1,'rgba(15,10,25,0)');
    g.fillStyle=es;g.fillRect(-w/2-4,y0,w+8,22);
    // shingle roof underneath
    const roofPath=()=>{g.beginPath();g.moveTo(-w/2-ov,y0);g.lineTo(w/2+ov,y0);g.lineTo(w/2+ov-10,top);g.lineTo(-w/2-ov+10,top);g.closePath();};
    g.save();roofPath();g.clip();
    g.fillStyle='#4a3028';g.fillRect(-w/2-ov,top,w+2*ov,roofH);
    for(let y=top+4,row=0;y<y0;y+=9,row++){
      for(let x=-w/2-ov+(row%2)*7;x<w/2+ov;x+=14){
        g.fillStyle=pick(['#6e4536','#7b4c3a','#62402f','#845542']);g.beginPath();g.roundRect(x,y,13,10,[0,0,5,5]);g.fill();
        g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x,y+8.5,13,1.5);
      }
    }
    // thick snow blanket with an uneven lower edge, so shingles peek through
    const rg=g.createLinearGradient(0,top,0,y0);rg.addColorStop(0,'#fbfdff');rg.addColorStop(.55,'#e9f0f8');rg.addColorStop(1,'#c3d3e8');
    g.fillStyle=rg;g.beginPath();g.moveTo(-w/2-ov-2,top-2);g.lineTo(w/2+ov+2,top-2);
    const pts=[];for(let x=w/2+ov+2;x>=-w/2-ov-2;x-=rand(10,18))pts.push([x,y0-rand(4,roofH*.34)]);
    pts.push([-w/2-ov-2,y0-rand(6,20)]);
    let px=w/2+ov+2,py=y0-8;g.lineTo(px,py);
    for(const [x,y] of pts){g.quadraticCurveTo((px+x)/2,Math.max(py,y)+6,x,y);px=x;py=y;}
    g.closePath();g.fill();
    // snow thickness shading + wind streaks
    const rs=g.createLinearGradient(-w/2,0,w/2+ov,0);rs.addColorStop(0,'rgba(255,255,255,.15)');rs.addColorStop(1,'rgba(95,120,170,.28)');
    g.fillStyle=rs;g.fillRect(-w/2-ov,top,w+2*ov,roofH);
    for(let i=0;i<8;i++){const x=rand(-w/2,w/2);g.fillStyle='rgba(140,162,200,.2)';ell(g,x,rand(top+16,y0-roofH*.4),rand(16,40),rand(2.5,5));}
    for(let i=0;i<6;i++){const x=rand(-w/2,w/2);g.fillStyle='rgba(255,255,255,.7)';ell(g,x,rand(top+10,y0-roofH*.45),rand(10,24),rand(1.5,3));}
    g.restore();
    // dark fascia boards on the roof's side edges
    g.strokeStyle='#2e1f18';g.lineWidth=4;g.beginPath();g.moveTo(-w/2-ov,y0+2);g.lineTo(-w/2-ov+10,top);g.moveTo(w/2+ov,y0+2);g.lineTo(w/2+ov-10,top);g.stroke();
    g.strokeStyle='#f4f8fc';g.lineWidth=2.5;g.beginPath();g.moveTo(-w/2-ov+1,y0-2);g.lineTo(-w/2-ov+10,top-1);g.stroke();
    // ridge
    g.fillStyle='#ffffff';g.beginPath();g.roundRect(-w/2-ov+8,top-6,w+2*ov-16,10,6);g.fill();
    g.fillStyle='rgba(140,165,205,.35)';g.fillRect(-w/2-ov+12,top+3,w+2*ov-24,2);
    // lumpy eave
    for(let x=-w/2-ov;x<=w/2+ov;x+=rand(10,15)){
      g.fillStyle='rgba(120,145,190,.45)';ell(g,x+1,y0+4,rand(8,11),5);
      g.fillStyle='#f6f9fd';ell(g,x,y0+1,rand(8,11),rand(4.5,6.5));
    }
    // icicles
    for(let x=-w/2-ov+6;x<w/2+ov-4;x+=rand(5,11)){
      if(R()<.35)continue;const L=rand(5,17);
      const ic=g.createLinearGradient(0,y0+5,0,y0+5+L);ic.addColorStop(0,'rgba(235,248,255,.95)');ic.addColorStop(1,'rgba(150,205,240,.5)');
      g.fillStyle=ic;g.beginPath();g.moveTo(x-2,y0+5);g.lineTo(x+2,y0+5);g.lineTo(x+.3,y0+5+L);g.closePath();g.fill();
    }
    // chimney
    const cx=w*.24+rand(-10,10), cy=y0-roofH*.5;
    g.fillStyle='#5f6472';g.fillRect(cx-12,cy-36,24,40);
    for(let r=0;r<5;r++)for(let c=0;c<2;c++){g.fillStyle=pick(['#868b98','#767b89','#9196a1']);g.fillRect(cx-11+c*12+(r%2)*5,cy-34+r*8,10,6.5);}
    g.fillStyle='rgba(20,20,40,.25)';g.fillRect(cx+4,cy-36,8,40);
    g.fillStyle='#fbfdff';g.beginPath();g.roundRect(cx-15,cy-42,30,9,5);g.fill();
    g.fillStyle='#f4f8fc';ell(g,cx-4,cy+3,20,6);
    info.chimney=[cx,cy-44];
  });
  spr.info=info;return spr;
}

function makePine(hue){
  return makeSprite(120,190,60,178,g=>{
    g.fillStyle='rgba(40,55,95,.3)';ell(g,10,-2,40,11);
    g.fillStyle='#4b3426';g.fillRect(-5,-24,10,24);
    const tiers=4;
    for(let i=0;i<tiers;i++){
      const bottom=-20-i*31, top=bottom-56+i*2, hw=48-i*9.5;
      // body
      const tg=g.createLinearGradient(-hw,0,hw,0);
      tg.addColorStop(0,`hsl(${hue},38%,33%)`);tg.addColorStop(.55,`hsl(${hue},45%,22%)`);tg.addColorStop(1,`hsl(${hue+8},50%,13%)`);
      g.fillStyle=tg;g.beginPath();g.moveTo(0,top);
      const seg=7;for(let s=0;s<=seg;s++){const x=hw-(2*hw)*s/seg;g.lineTo(x,bottom-(s%2?7:0)+rand(-1.5,1.5));}
      g.closePath();g.fill();
      // underside shade
      g.fillStyle='rgba(5,15,25,.35)';ell(g,0,bottom-2,hw*.8,4);
      // snow on upper-left slope
      const sg=g.createLinearGradient(-hw,top,hw*.3,bottom);sg.addColorStop(0,'#ffffff');sg.addColorStop(1,'#c8d8ec');
      g.fillStyle=sg;g.beginPath();g.moveTo(0,top-1);
      g.lineTo(-hw*.9,bottom-6);g.quadraticCurveTo(-hw*.55,bottom-2,-hw*.3,bottom-10);
      g.quadraticCurveTo(-hw*.05,bottom-14,hw*.05,bottom-26);
      g.quadraticCurveTo(hw*.25,top+26,hw*.12,top+10);g.closePath();g.fill();
      // dollops on tips
      for(let s=0;s<3;s++){g.fillStyle='#f3f7fc';ell(g,rand(-hw*.8,hw*.6),bottom-rand(3,9),rand(3,6),rand(1.8,3));}
    }
    g.fillStyle='#ffffff';ell(g,0,-20-3*31-52,5,4);
  });
}

function makeBirch(){
  return makeSprite(170,210,85,200,g=>{
    g.fillStyle='rgba(40,55,95,.25)';ell(g,8,-2,34,9);
    g.lineCap='round';
    const branch=(x,y,a,len,wd,d)=>{
      const x2=x+Math.cos(a)*len,y2=y+Math.sin(a)*len;
      g.strokeStyle='#5e5853';g.lineWidth=wd+1.6;g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke();
      g.strokeStyle='#e7e1d8';g.lineWidth=wd;g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke();
      if(wd>3){g.strokeStyle='rgba(40,35,35,.7)';g.lineWidth=1.2;for(let k=0;k<2;k++){const t=rand(.2,.8);const mx=lerp(x,x2,t),my=lerp(y,y2,t);g.beginPath();g.moveTo(mx-wd*.4,my);g.lineTo(mx+wd*.3,my+1);g.stroke();}}
      if(wd>1.6&&Math.sin(a)<0){g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=wd*.55;g.beginPath();g.moveTo(x,y-wd*.4);g.lineTo(lerp(x,x2,.8),lerp(y,y2,.8)-wd*.4);g.stroke();}
      if(d<=0)return;
      const n=d>3?2:pick([2,2,3]);
      for(let i=0;i<n;i++)branch(x2,y2,a+rand(-.75,.75),len*rand(.62,.8),wd*.68,d-1);
    };
    branch(0,0,-Math.PI/2+rand(-.08,.08),56,8,6);
  });
}

function makeBarrel(){

    g.fillStyle='rgba(40,55,95,.3)';ell(g,4,0,15,5);

});
const endPtr=e=>{

/* ==== js/05_engine.js ==== */
/* ---------- physics ---------- */
function collide(p){
  for(const c of colliders){
    if(c.t==='c'){
      const dx=p.x-c.x,dy=p.y-c.y,rr=c.r+PR,d2=dx*dx+dy*dy;
      if(d2<rr*rr&&d2>1e-6){const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;p.x=c.x+nx*rr;p.y=c.y+ny*rr;
        const vn=p.vx*nx+p.vy*ny;if(vn<0){p.vx-=vn*nx;p.vy-=vn*ny;}}
    }else{
      const qx=clamp(p.x,c.x0,c.x1),qy=clamp(p.y,c.y0,c.y1),dx=p.x-qx,dy=p.y-qy,d2=dx*dx+dy*dy;
      if(d2<PR*PR){
        let nx,ny,pen;
        if(d2>1e-6){const d=Math.sqrt(d2);nx=dx/d;ny=dy/d;pen=PR-d;}
        else{const l=p.x-c.x0,r=c.x1-p.x,t=p.y-c.y0,b=c.y1-p.y,m=Math.min(l,r,t,b);
          if(m===l){nx=-1;ny=0;}else if(m===r){nx=1;ny=0;}else if(m===t){nx=0;ny=-1;}else{nx=0;ny=1;}pen=m+PR;}
        p.x+=nx*pen;p.y+=ny*pen;const vn=p.vx*nx+p.vy*ny;if(vn<0){p.vx-=vn*nx;p.vy-=vn*ny;}
      }
    }
  }
  p.x=clamp(p.x,24,W-24);p.y=clamp(p.y,48,H-16);
}

let stuckT=0;
function updatePlayer(dt,t){
  const p=player;
  let ix=0,iy=0,mag=0;
  if(keys.has('a')||keys.has('arrowleft'))ix-=1;
  if(keys.has('d')||keys.has('arrowright'))ix+=1;
  if(keys.has('w')||keys.has('arrowup'))iy-=1;
  if(keys.has('s')||keys.has('arrowdown'))iy+=1;
  if(ix||iy){const m=Math.hypot(ix,iy);ix/=m;iy/=m;mag=1;}
  else if(joy.on&&(joy.vx||joy.vy)){const m=Math.hypot(joy.vx,joy.vy);if(m>.12){ix=joy.vx/m;iy=joy.vy/m;mag=clamp((m-.12)/.8,0,1);}}
  else if(tapTarget){
    const dx=tapTarget.x-p.x,dy=tapTarget.y-p.y,d=Math.hypot(dx,dy);
    if(d<6){tapTarget=null;}else{ix=dx/d;iy=dy/d;mag=clamp(d/40,.35,1);}
    tapTime+=dt;
    if(Math.hypot(p.vx,p.vy)<18&&tapTime>.4){stuckT+=dt;if(stuckT>.5){tapTarget=null;stuckT=0;}}else stuckT=0;
  }
  const s=surfaceAt(p.x,p.y);
  const jog=keys.has('shift');
  let max=(jog?245:165)*(s===1?1:s===2?1.12:.84);
  // response: how quickly velocity chases the target velocity. Ice is very low → sliding.
  const kIn=s===2?1.5:s===1?11:8, kOut=s===2?.55:s===1?10:8;
  const tx=ix*max*mag,ty=iy*max*mag,k=(mag>0?kIn:kOut);
  const a=1-Math.exp(-k*dt);
  p.vx+=(tx-p.vx)*a;p.vy+=(ty-p.vy)*a;
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  collide(p);
  const sp=Math.hypot(p.vx,p.vy);
  // facing turns smoothly (follows intent, or velocity when sliding)
  const fx=mag>0?ix:p.vx,fy=mag>0?iy:p.vy,fm=Math.hypot(fx,fy);
  if(fm>.01&&(mag>0||sp>25)){const ta=1-Math.exp(-14*dt);p.face.x+=(fx/fm-p.face.x)*ta;p.face.y+=(fy/fm-p.face.y)*ta;
    const n=Math.hypot(p.face.x,p.face.y)||1;p.face.x/=n;p.face.y/=n;}
  if(p.face.x<-.25)p.side=-1;else if(p.face.x>.25)p.side=1;
  // walk cycle (on ice you glide: legs only move when pushing)
  const walking=s===2?mag*Math.min(sp,90):sp;
  p.phase+=walking*dt*.085;
  const idx=Math.floor(p.phase/Math.PI);
  if(idx!==p.stepIdx){p.stepIdx=idx;if(walking>20)onStep(idx%2?1:-1,s,sp);}
  if(s===2&&sp>70&&FX.particles&&R()<dt*14)emit({t:'spark',x:p.x+rand(-6,6),y:p.y+rand(-2,2),vx:-p.vx*.1,vy:-p.vy*.1,l:0,m:rand(.4,.8),sz:rand(3,6)});
}
function onStep(side,s,sp){
  const p=player,ang=Math.atan2(p.vy,p.vx),nx=-Math.sin(ang),ny=Math.cos(ang);
  const fx=p.x+nx*side*4,fy=p.y+ny*side*4;
  Sfx.step(s,sp,side);
  if(s!==2){prints.push({x:fx,y:fy,a:ang,l:0,deep:s===0});if(prints.length>260)prints.shift();}
  if(!FX.particles||s===2)return;
  const n=s===0?3+(sp>200?2:0):1;
  for(let i=0;i<n;i++)emit({t:'puff',x:fx+rand(-3,3),y:fy+rand(-2,1),vx:rand(-18,18)-p.vx*.08,vy:rand(-26,-8),l:0,m:rand(.45,.8),sz:rand(5,9)*(s===0?1:.7)});
}

/* ---------- particles update ---------- */
let wind=0;
function windAt(t,ph=0){return Math.sin(t*.9+ph)*.6+Math.sin(t*2.3+ph*1.7+1)*.22+Math.sin(t*.37)*.45;}
function updateParticles(dt,t){
  if(FX.particles){
    // embers from fire
    const fireOn=SCENE.fire&&Math.abs(PLAZA.x-cam.x)<VW/ZOOM&&Math.abs(PLAZA.y-cam.y)<VH/ZOOM;
    if(fireOn)for(let i=0;i<dt*26;i++)emit({t:'ember',x:PLAZA.x+rand(-14,14),y:PLAZA.y-10,vx:rand(-14,14),vy:rand(-110,-60),l:0,m:rand(.9,2.1),sz:rand(2,4.2),ph:rand(0,9)});
    // chimney smoke
    for(const c of chimneys){if(Math.abs(c.x-cam.x)>VW/ZOOM||Math.abs(c.y-cam.y)>VH/ZOOM)continue;
      c.acc+=dt*7;while(c.acc>1){c.acc--;emit({t:'smoke',x:c.x+rand(-3,3),y:c.y,vx:rand(-4,4),vy:rand(-22,-14),l:0,m:rand(2.6,4),sz:rand(6,9)});}}
    // grove motes
    if(GROVE&&Math.hypot(GROVE.x-cam.x,GROVE.y-cam.y)<900&&R()<dt*12)
      emit({t:'mote',x:GROVE.x+rand(-170,170),y:GROVE.y+rand(-120,120),vx:rand(-6,6),vy:rand(-14,-4),l:0,m:rand(3,5.5),sz:rand(3,6),ph:rand(0,9)});
    if(SCENE.skyLanterns&&amb.a>.3&&R()<dt*1.1)emit({t:'sky',x:cam.x+rand(-VW/ZOOM*.6,VW/ZOOM*.6),y:cam.y+VH/ZOOM*.55,vx:rand(-4,4),vy:-rand(14,24),l:0,m:rand(16,26),sz:rand(3,5.5),ph:rand(0,9)});
    // fireflies-ish warm motes near the plaza at dusk/night
    if(amb.a>.3&&R()<dt*3)emit({t:'mote',warm:1,x:PLAZA.x+rand(-260,260),y:PLAZA.y+rand(-200,200),vx:rand(-6,6),vy:rand(-8,0),l:0,m:rand(3,5),sz:rand(2,4),ph:rand(0,9)});
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.l+=dt;if(p.l>=p.m){parts.splice(i,1);continue;}
    if(p.t==='puff'){p.vx*=Math.exp(-4*dt);p.vy=p.vy*Math.exp(-4*dt)+30*dt;}
    else if(p.t==='ember'){p.vx+=(wind*30+Math.sin(t*6+p.ph)*40)*dt;p.vy*=Math.exp(-.6*dt);}
    else if(p.t==='smoke'){p.vx+=wind*14*dt;p.sz+=dt*9;}
    else if(p.t==='mote'){p.vx+=Math.sin(t*1.3+p.ph)*8*dt;p.vy+=Math.cos(t*1.1+p.ph)*6*dt;}
    else if(p.t==='spark'){p.vx*=.95;p.vy*=.95;}
    else if(p.t==='sky'){p.vx+=(wind*6+Math.sin(t*.5+p.ph)*3)*dt;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  // snow (screen space with parallax by depth)
  const dx=(cam.x-cam.px)*ZOOM,dy=(cam.y-cam.py)*ZOOM;
  for(const f of flakes){
    f.y+=(16+34*f.d)*dt*(f.d>1.4?1.3:1);
    f.x+=(wind*22+Math.sin(t*1.2+f.ph)*9)*f.d*dt;
    f.x-=dx*f.d;f.y-=dy*f.d;
    const m=20;if(f.y>VH+m)f.y-=VH+2*m;if(f.y<-m)f.y+=VH+2*m;if(f.x>VW+m)f.x-=VW+2*m;if(f.x<-m)f.x+=VW+2*m;
  }
  for(const p of prints)p.l+=dt;
  while(prints.length&&prints[0].l>14)prints.shift();
}

/* ---------- rendering ---------- */
function drawSpr(g,spr,x,y,s=1){g.drawImage(spr.cv,x-spr.ox*s,y-spr.oy*s,spr.w*s,spr.h*s);}

function drawPlayer(g,t){
  if(IMG.player)return drawPlayerSheet(g,t);
  const p=player,sp=Math.hypot(p.vx,p.vy),onIce=surfaceAt(p.x,p.y)===2;
  const mv=onIce?clamp(sp/160,0,.35):clamp(sp/140,0,1);
  const sw=Math.sin(p.phase),bob=Math.abs(sw)*mv;
  const fx=p.face.x,fy=p.face.y,side=p.side;
  const back=fy<-.5, front=fy>.35;
  g.save();g.translate(p.x,p.y);
  g.fillStyle='rgba(30,40,75,.38)';ell(g,0,0,12-bob*1.6,4.6-bob*.6);
  g.scale(1.12,1.12);
  // boots
  g.fillStyle='#3a2826';
  const lift1=Math.max(0,sw)*mv*3.2,lift2=Math.max(0,-sw)*mv*3.2;
  ell(g,-4.5+fx*1.5,-2.2-lift1,3.9,2.8);ell(g,4.5+fx*1.5,-2.2-lift2,3.9,2.8);
  g.translate(0,-bob*2.6);

  g.transform(1,0,-lean,1,0,0);
  g.scale(1+bob*.05,1-bob*.05);
  // scarf tail (behind body unless moving down)
  const tailBase=[-side*4,-27];
  const flutter=Math.sin(t*14)*2.2*mv+Math.sin(t*3)*.6;
  const tailEnd=[tailBase[0]-p.vx*.055-side*3,tailBase[1]+7-p.vy*.05+flutter];
  const drawTail=()=>{g.strokeStyle='#b8352e';g.lineWidth=4;g.lineCap='round';g.beginPath();g.moveTo(...tailBase);
    g.quadraticCurveTo(tailBase[0]+(tailEnd[0]-tailBase[0])*.5,tailBase[1]+5+flutter*.5,tailEnd[0],tailEnd[1]);g.stroke();
    g.strokeStyle='#e9c260';g.lineWidth=1;g.beginPath();g.moveTo(tailEnd[0]-1.5,tailEnd[1]+1.5);g.lineTo(tailEnd[0]+1.5,tailEnd[1]+2.5);g.stroke();};
  if(!front)drawTail();
  // lantern (behind body when walking up)
  const hx=side*11.5,hy=-15,swing=Math.sin(p.phase)*.35*mv-p.vx*.0012;
  const drawLantern=()=>{g.save();g.translate(hx,hy);g.rotate(swing);
    g.strokeStyle='#2a2420';g.lineWidth=1;g.beginPath();g.moveTo(0,0);g.lineTo(0,4);g.stroke();
    g.fillStyle='#2a2420';g.fillRect(-3.4,3.6,6.8,1.6);g.fillRect(-3.4,12,6.8,1.6);
    const lg=g.createLinearGradient(0,5,0,12);lg.addColorStop(0,'#fff6d0');lg.addColorStop(1,'#ffb347');g.fillStyle=lg;g.fillRect(-2.8,5,5.6,7);
    g.restore();
    p.lantern.x=p.x+(hx+Math.sin(swing)*-8)*1.12;p.lantern.y=p.y+(hy+8-bob*2.6)*1.12;};
  if(back)drawLantern();
  // cloak
  const cg=g.createLinearGradient(-12,0,12,0);cg.addColorStop(0,'#46a8a8');cg.addColorStop(.6,'#2c7480');cg.addColorStop(1,'#1d4e5c');
  g.fillStyle=cg;g.beginPath();g.moveTo(-7,-28);
  const hem=Math.sin(p.phase*2)*1.2*mv;
  g.quadraticCurveTo(-13.5,-13,-12.5-lean*20,-4+hem);g.quadraticCurveTo(0,-.8,12.5-lean*20,-4-hem);g.quadraticCurveTo(13.5,-13,7,-28);g.closePath();g.fill();
  g.strokeStyle='rgba(10,30,40,.35)';g.lineWidth=1;g.beginPath();g.moveTo(-3,-24);g.lineTo(-4.5,-5);g.moveTo(4,-24);g.lineTo(5,-5);g.stroke();
  g.strokeStyle='#e2b65a';g.lineWidth=1.6;g.beginPath();g.moveTo(-12.5-lean*20,-4.4+hem);g.quadraticCurveTo(0,-1.2,12.5-lean*20,-4.4-hem);g.stroke();
  if(!back){g.fillStyle='#e2b65a';circ(g,0,-22,1.3);circ(g,0,-16,1.3);}
  // arm/mitten on lantern side
  g.fillStyle='#235c69';ell(g,side*9,-18,3.6,5,side*.4);g.fillStyle='#b8352e';circ(g,hx*.92,hy+.5,2.4);
  // scarf collar
  g.fillStyle='#c8433a';g.beginPath();g.roundRect(-8.5,-31,17,6,3);g.fill();g.fillStyle='rgba(0,0,0,.18)';g.fillRect(-8.5,-27,17,2);
  if(front)drawTail();
  // head + hood
  const hcx=fx*1.6,hcy=-38+(back?-.5:0);
  g.fillStyle='#8f3f30';circ(g,hcx*.6,hcy,11);
  // hood tip flops opposite to motion
  g.beginPath();g.moveTo(hcx*.6-5,hcy-8);g.quadraticCurveTo(hcx*.6-p.vx*.04-side*4,hcy-17-p.vy*.02,hcx*.6-p.vx*.07-side*9,hcy-12+Math.sin(t*9)*mv);g.lineTo(hcx*.6+4,hcy-9);g.closePath();g.fill();
  g.fillStyle='#e9c260';circ(g,hcx*.6-p.vx*.07-side*9,hcy-12+Math.sin(t*9)*mv,2.2);
  if(!back){
    g.fillStyle='#f3d2b2';ell(g,hcx,hcy+1.5,7.8-Math.abs(fx)*1.5,7.4);
    g.fillStyle='#5a3326';g.beginPath();g.ellipse(hcx,hcy-3.5,7.6-Math.abs(fx)*1.4,3.2,0,Math.PI,TAU);g.fill();
    if(fy>-.2||Math.abs(fx)>.3){
      const ex=fx*2.6,ey=fy*1.2;
      const blink=(t%4.2)<.12?.3:1;
      g.fillStyle='#1d1a24';ell(g,hcx-2.8+ex,hcy+1+ey,1.25,1.7*blink);ell(g,hcx+2.8+ex,hcy+1+ey,1.25,1.7*blink);
      g.fillStyle='rgba(240,120,120,.45)';ell(g,hcx-4.6+ex,hcy+4,1.8,1);ell(g,hcx+4.6+ex,hcy+4,1.8,1);
    }
  }else{g.fillStyle='rgba(0,0,0,.15)';ell(g,hcx*.6,hcy+3,8,4);}
  // hood rim highlight
  g.strokeStyle='rgba(255,210,180,.35)';g.lineWidth=1.2;g.beginPath();g.arc(hcx*.6,hcy,10.6,Math.PI*1.1,Math.PI*1.6);g.stroke();
  if(!back)drawLantern();
  g.restore();
}

function drawFire(g,o,t){
  drawSpr(g,o.spr,o.x,o.y);
  g.save();g.translate(o.x,o.y-12);g.globalCompositeOperation='lighter';
  const cols=['rgba(255,80,20,.55)','rgba(255,160,40,.6)','rgba(255,236,170,.75)'];
  for(let L=0;L<3;L++){const hW=[17,12,6][L],hH=[48,34,19][L];
    for(let k=0;k<3;k++){const ox=(k-1)*hW*.5,ph=t*(8+k)+k*2.1+L*1.3;
      const h=hH*(.78+.22*Math.sin(ph)+.08*Math.sin(ph*2.7));const sway=Math.sin(t*5+k*1.7)*3+wind*5;
      g.fillStyle=cols[L];g.beginPath();g.moveTo(ox-hW*.6,0);g.quadraticCurveTo(ox-hW*.75,-h*.45,ox+sway,-h);g.quadraticCurveTo(ox+hW*.75,-h*.45,ox+hW*.6,0);g.closePath();g.fill();}}
  g.restore();
}

function drawMarker(g,m,t){
  const st=m.state(); if(st==='none')return;
  const x=m.x,y=m.y-(m.h||80)+Math.sin(t*3+m.x)*3.5;
  g.save();g.translate(x,y);
  if(st==='done'){g.fillStyle='#3e9a62';circ(g,0,0,9);g.strokeStyle='#eafff0';g.lineWidth=2.4;g.lineCap='round';g.beginPath();g.moveTo(-4,0);g.lineTo(-1,3.5);g.lineTo(4.5,-3.5);g.stroke();}
  else if(st==='sealed'){g.fillStyle='rgba(30,36,56,.85)';circ(g,0,0,9);g.strokeStyle='#9aa6c4';g.lineWidth=1.8;g.beginPath();g.arc(0,-2,3.2,Math.PI,0);g.stroke();g.fillStyle='#9aa6c4';g.fillRect(-4.2,-1.5,8.4,6);}
  else if(st==='frozen'){g.fillStyle='rgba(20,50,90,.85)';circ(g,0,0,10);g.strokeStyle='#bfe8ff';g.lineWidth=1.6;g.lineCap='round';
    for(let k=0;k<3;k++){const a=k*Math.PI/3;g.beginPath();g.moveTo(Math.cos(a)*6,Math.sin(a)*6);g.lineTo(-Math.cos(a)*6,-Math.sin(a)*6);g.stroke();}}
  else if(st==='lesson'){g.fillStyle='#2b5f8a';g.beginPath();g.roundRect(-10,-8,20,15,4);g.fill();g.fillStyle='#e8f3ff';g.beginPath();g.moveTo(-7,-5);g.lineTo(-1,-3);g.lineTo(-1,5);g.lineTo(-7,3);g.closePath();g.fill();
    g.beginPath();g.moveTo(7,-5);g.lineTo(1,-3);g.lineTo(1,5);g.lineTo(7,3);g.closePath();g.fill();}
  else if(st==='lessonDone'){g.fillStyle='rgba(62,154,98,.85)';circ(g,0,0,6);g.strokeStyle='#eafff0';g.lineWidth=1.6;g.lineCap='round';g.beginPath();g.moveTo(-2.6,0);g.lineTo(-.6,2.3);g.lineTo(3,-2.2);g.stroke();}
  else if(st==='talk'){g.fillStyle='#f6ead0';g.beginPath();g.roundRect(-11,-8,22,15,6);g.fill();g.beginPath();g.moveTo(-3,7);g.lineTo(-7,12);g.lineTo(2,7);g.fill();
    g.fillStyle='#5a3a1a';for(const dx of [-5,0,5])circ(g,dx,-.5,1.6);}
  else{g.rotate(Math.PI/4);g.fillStyle='#7a4a12';g.fillRect(-9,-9,18,18);g.fillStyle='#f1c25c';g.fillRect(-7.5,-7.5,15,15);g.rotate(-Math.PI/4);
    g.fillStyle='#4a2a08';g.fillRect(-1.4,-6,2.8,8);circ(g,0,5,1.6);}
  g.restore();
}

function render(t){
  const g=ctx;
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle='#0b1222';g.fillRect(0,0,cv.width,cv.height);
  const sx=DPR*ZOOM, ox=DPR*(VW/2-cam.x*ZOOM), oy=DPR*(VH/2-cam.y*ZOOM);
  g.setTransform(sx,0,0,sx,ox,oy);
  const vx0=cam.x-VW/2/ZOOM, vy0=cam.y-VH/2/ZOOM, vx1=cam.x+VW/2/ZOOM, vy1=cam.y+VH/2/ZOOM;
  // ground (only visible slice)
  const gx0=clamp(vx0,0,W),gy0=clamp(vy0,0,H),gx1=clamp(vx1,0,W),gy1=clamp(vy1,0,H);
  if(gx1>gx0&&gy1>gy0)g.drawImage(ground,gx0*GS,gy0*GS,(gx1-gx0)*GS,(gy1-gy0)*GS,gx0,gy0,gx1-gx0,gy1-gy0);
  // footprints
  if(FX.prints)for(const f of prints){
    const a=clamp(1-f.l/14,0,1)*(f.deep?.55:.32);
    g.save();g.translate(f.x,f.y);g.rotate(f.a);
    g.fillStyle=`rgba(85,105,145,${a})`;ell(g,0,0,3.6,2.3);
    g.fillStyle=`rgba(255,255,255,${a*.7})`;ell(g,-.6,-1.4,2.6,.9);g.restore();
  }
  // tap target ring
  if(tapTarget){const k=(t*2)%1;g.strokeStyle=`rgba(255,226,168,${.8-k*.6})`;g.lineWidth=1.6;g.beginPath();g.ellipse(tapTarget.x,tapTarget.y,6+k*10,(6+k*10)*.5,0,0,TAU);g.stroke();}
  // depth-sorted world
  const list=[];
  for(const o of objects){
    const s=o.s,hw=o.spr.w*s*.6;
    if(o.x+hw<vx0||o.x-hw>vx1||o.y-o.spr.oy*s>vy1+20||o.y+30<vy0)continue;
    list.push(o);
  }
  list.push({kind:'player',y:player.y});
  list.sort((a,b)=>a.y-b.y);
  for(const o of list){
    if(o.kind==='player'){drawPlayer(g,t);continue;}
    if(o.occ){
      const p=player,s=o.s;
      const inside=p.y<o.y-4&&p.x>o.x+o.occ[0]*s&&p.x<o.x+o.occ[1]*s&&p.y-30>o.y+o.occ[2]*s&&p.y-10<o.y+o.occ[3]*s;
      o.fade+=((inside?.38:1)-o.fade)*Math.min(1,dtLast*8);
    }
    g.globalAlpha=o.fade;
    if(o.kind==='fire')drawFire(g,o,t);
    else if(o.sway&&FX.wind){
      const sk=windAt(t,o.phase)*.045*o.sway;
      g.save();g.translate(o.x,o.y);g.transform(1,0,sk,1,0,0);g.scale(o.s,o.s);g.drawImage(o.spr.cv,-o.spr.ox,-o.spr.oy,o.spr.w,o.spr.h);g.restore();
    }else drawSpr(g,o.spr,o.x,o.y,o.s);
    if(o.kind==='stone')drawIce(g,o);
    g.globalAlpha=1;
    if(o.marker)drawMarker(g,o.marker,t);
  }
  // festival lantern strings (overhead, drawn above the sorted world)
  for(const s of STRINGS){
    if(Math.max(s.x1,s.x2)<vx0-40||Math.min(s.x1,s.x2)>vx1+40||Math.max(s.y1,s.y2)<vy0-40||Math.min(s.y1,s.y2)>vy1+120)continue;
    const sw=FX.wind?wind*4:0,mx=(s.x1+s.x2)/2+sw,my=(s.y1+s.y2)/2+s.sag;
    g.strokeStyle='rgba(40,30,30,.75)';g.lineWidth=1;g.beginPath();g.moveTo(s.x1,s.y1);g.quadraticCurveTo(mx,my,s.x2,s.y2);g.stroke();
    s.lan.forEach((L,i)=>{const u=L.u,x=(1-u)**2*s.x1+2*(1-u)*u*mx+u*u*s.x2,y=(1-u)**2*s.y1+2*(1-u)*u*my+u*u*s.y2,sway=Math.sin(t*2+i+s.x1)*1.5;
      L.light.x=x+sway;L.light.y=y+6;
      g.strokeStyle='rgba(40,30,30,.6)';g.beginPath();g.moveTo(x,y);g.lineTo(x+sway,y+4);g.stroke();
      g.fillStyle=L.c;ell(g,x+sway,y+9,4.6,5.6);g.fillStyle='rgba(255,240,200,.55)';ell(g,x+sway-1,y+8,1.8,3.4);
      g.fillStyle='#2a1a14';g.fillRect(x+sway-2.5,y+3,5,1.6);g.fillRect(x+sway-2,y+14.2,4,1.4);});
  }
  // world particles
  if(FX.particles){
    for(const p of parts){
      const k=p.l/p.m;
      if(p.t==='puff'){g.globalAlpha=(1-k)*.85;g.drawImage(DOT.white,p.x-p.sz*(1+k),p.y-p.sz*(1+k)*.7,p.sz*2*(1+k),p.sz*1.4*(1+k));}
      else if(p.t==='smoke'){g.globalAlpha=Math.sin(Math.PI*Math.min(1,k*1.4))*.32;g.drawImage(DOT.smoke,p.x-p.sz,p.y-p.sz,p.sz*2,p.sz*2);}
    }
    g.globalCompositeOperation='lighter';
    for(const p of parts){
      const k=p.l/p.m;
      if(p.t==='ember'){g.globalAlpha=(1-k)*(.6+.4*Math.sin(t*20+p.ph));const s=p.sz*(1-k*.5);g.drawImage(DOT.ember,p.x-s*2,p.y-s*2,s*4,s*4);}
      else if(p.t==='mote'){g.globalAlpha=Math.sin(Math.PI*k)*(.6+.4*Math.sin(t*5+p.ph));const s=p.sz;g.drawImage(p.warm?DOT.warm:DOT.cool,p.x-s*2,p.y-s*2,s*4,s*4);}
      else if(p.t==='spark'){g.globalAlpha=(1-k);const s=p.sz;g.drawImage(DOT.cool,p.x-s,p.y-s,s*2,s*2);}
    }
    g.globalCompositeOperation='source-over';g.globalAlpha=1;
  }
  // lighting
  if(FX.light&&amb.a>.01){
    lx.setTransform(1,0,0,1,0,0);lx.globalCompositeOperation='source-over';
    lx.clearRect(0,0,lc.width,lc.height);
    lx.fillStyle=rgba(amb.c,amb.a);lx.fillRect(0,0,lc.width,lc.height);
    lx.globalCompositeOperation='destination-out';
    const ls=DPR*LS*ZOOM;
    for(const L of lights){
      const fl=1+L.fl*(Math.sin(t*11+L.seed)*.5+Math.sin(t*6.3+L.seed*2)*.35+Math.sin(t*23+L.seed)*.15);
      L.cur=L.i*fl;const r=L.r*(1+(fl-1)*.4);
      const sx2=((L.x-cam.x)*ZOOM+VW/2)*DPR*LS,sy2=((L.y-cam.y)*ZOOM+VH/2)*DPR*LS,rr=r*ls;
      if(sx2<-rr||sy2<-rr||sx2>lc.width+rr||sy2>lc.height+rr)continue;
      const gr=lx.createRadialGradient(sx2,sy2,0,sx2,sy2,rr);
      gr.addColorStop(0,`rgba(0,0,0,${Math.min(.92,L.cur*.92)})`);gr.addColorStop(.4,`rgba(0,0,0,${.42*L.cur})`);gr.addColorStop(1,'rgba(0,0,0,0)');
      lx.fillStyle=gr;lx.beginPath();lx.ellipse(sx2,sy2,rr,rr*.8,0,0,TAU);lx.fill();
    }
    g.setTransform(1,0,0,1,0,0);g.drawImage(lc,0,0,cv.width,cv.height);
  }
  if(FX.light){
    g.setTransform(sx,0,0,sx,ox,oy);g.globalCompositeOperation='lighter';
    for(const L of lights){
      const r=L.r*.6,a=(L.col[0]<200?.14:.26)*(L.cur||L.i)*amb.glow;
      if(L.x+r<vx0||L.x-r>vx1||L.y+r<vy0||L.y-r>vy1)continue;
      const gr=g.createRadialGradient(L.x,L.y,0,L.x,L.y,r);
      gr.addColorStop(0,rgba(L.col,a));gr.addColorStop(.3,rgba(L.col,a*.45));gr.addColorStop(1,rgba(L.col,0));
      g.fillStyle=gr;g.fillRect(L.x-r,L.y-r,r*2,r*2);
    }
    g.globalCompositeOperation='source-over';
  }
  if(FX.particles&&SCENE.skyLanterns){
    g.setTransform(sx,0,0,sx,ox,oy);g.globalCompositeOperation='lighter';
    for(const p of parts)if(p.t==='sky'){const k=p.l/p.m,a=Math.min(1,k*4)*Math.min(1,(1-k)*3)*(.75+.25*Math.sin(t*6+p.ph));
      g.globalAlpha=a*.5;g.drawImage(DOT.warm,p.x-p.sz*4,p.y-p.sz*4,p.sz*8,p.sz*8);
      g.globalAlpha=a;g.fillStyle='#ffcf7a';g.beginPath();g.roundRect(p.x-p.sz*.55,p.y-p.sz*.8,p.sz*1.1,p.sz*1.5,p.sz*.35);g.fill();}
    g.globalAlpha=1;g.globalCompositeOperation='source-over';
  }
  if(SCENE.aurora&&FX.light){
    g.setTransform(DPR,0,0,DPR,0,0);g.globalCompositeOperation='screen';
    const bands=[[80,255,180,.2,.12],[90,220,255,.15,.2],[200,110,255,.12,.3]];
    bands.forEach(([r,gg,b,a,yy],k)=>{for(const [lw,al] of [[110,.35],[60,.6],[22,1]]){
      g.strokeStyle=`rgba(${r},${gg},${b},${a*al*(.75+.25*Math.sin(t*.4+k))})`;g.lineWidth=lw;g.lineCap='round';g.beginPath();
      for(let x=-40;x<=VW+40;x+=24){const y=VH*yy+Math.sin(x*.004+t*.25+k*1.7)*34+Math.sin(x*.011-t*.45+k)*12-cam.y*.02;x<=-40?g.moveTo(x,y):g.lineTo(x,y);}
      g.stroke();}});
    g.globalCompositeOperation='source-over';
  }
  // snow
  g.setTransform(DPR,0,0,DPR,0,0);
  if(FX.particles){
    for(const f of flakes){
      if(f.d>1.4){g.globalAlpha=.55;g.drawImage(DOT.white,f.x-f.r*2,f.y-f.r*2,f.r*4,f.r*4);}
      else{g.globalAlpha=.35+f.d*.35;g.drawImage(DOT.white,f.x-f.r*1.5,f.y-f.r*1.5,f.r*3,f.r*3);}
    }
    g.globalAlpha=1;
  }
  // foreground silhouettes (parallax 1.35)
  if(FX.fg){
    const psx=(player.x-cam.x)*ZOOM+VW/2,psy=(player.y-cam.y)*ZOOM+VH/2;
    for(const f of FG){
      const s=f[2]*ZOOM*.95,x=(f[0]*W/2000-cam.x)*ZOOM*1.35+VW/2,y=(f[1]*H/1500-cam.y)*ZOOM*1.35+VH/2;
      const w=320*s,h=520*s;if(x+w/2<0||x-w/2>VW||y<0||y-h>VH)continue;
      const near=Math.abs(psx-x)<w*.35&&psy<y&&psy>y-h*.9;
      f.fade=(f.fade??1);f.fade+=((near?.35:1)-f.fade)*Math.min(1,dtLast*6);
      g.globalAlpha=.94*f.fade;g.drawImage(SPR.fgPine,x-w/2,y-h,w,h);
    }
    g.globalAlpha=1;
  }
  // grade + vignette
  if(FX.grade){
    g.globalCompositeOperation='soft-light';g.fillStyle=rgba(amb.tint,amb.ta*2.2);g.fillRect(0,0,VW,VH);
    g.globalCompositeOperation='source-over';
    const vg=g.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.35,VW/2,VH/2,Math.hypot(VW,VH)*.6);
    vg.addColorStop(0,'rgba(6,10,24,0)');vg.addColorStop(1,`rgba(6,10,24,${.35+amb.a*.35})`);
    g.fillStyle=vg;g.fillRect(0,0,VW,VH);
  }
  // joystick
  if(joy.on){
    g.fillStyle='rgba(12,18,36,.35)';g.strokeStyle='rgba(255,226,168,.45)';g.lineWidth=2;
    g.beginPath();g.arc(joy.bx,joy.by,58,0,TAU);g.fill();g.stroke();
    g.fillStyle='rgba(255,226,168,.75)';g.beginPath();g.arc(joy.bx+joy.kx,joy.by+joy.ky,24,0,TAU);g.fill();
  }
}

const IMG={};
let GROUND_IMG=null;
function loadImg(src){return new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>{console.warn('Art not found:',src);res(null);};im.src=src;});}
async function loadArt(){
  const jobs=[];
  for(const [key,a] of Object.entries(ART.sprites)){if(!a.files?.length)continue;
    jobs.push(Promise.all(a.files.map(f=>loadImg(ART.base+f))).then(ims=>{const ok=ims.filter(Boolean);if(ok.length)IMG[key]=ok;}));}
  if(ART.player?.file)jobs.push(loadImg(ART.base+ART.player.file).then(im=>{if(im)IMG.player=im;}));

}

/* sprite-sheet player (used only when ART.player.file is set and loads) */
function drawPlayerSheet(g,t){
  const P=ART.player,im=IMG.player,p=player,sp=Math.hypot(p.vx,p.vy);
  const fx=p.face.x,fy=p.face.y,row=Math.abs(fx)>Math.abs(fy)?(fx<0?1:2):(fy<0?3:0);
  const moving=sp>14&&!(surfaceAt(p.x,p.y)===2&&sp<60);
  const frame=moving&&P.frames>1?1+Math.floor(p.phase/(Math.PI/2))%(P.frames-1):0;
  const bob=moving?Math.abs(Math.sin(p.phase))*1.5:0;
  g.fillStyle='rgba(30,40,75,.38)';ell(g,p.x,p.y,12,4.6);
  g.drawImage(im,frame*P.fw,row*P.fh,P.fw,P.fh,p.x-P.ox,p.y-P.oy-bob,P.w,P.h);
  const ln=P.lantern?.[row]?.[frame];
  if(ln){p.lantern.x=p.x+ln[0];p.lantern.y=p.y+ln[1]-bob;}
  else{p.lantern.x=p.x+(row===1?-12:row===2?12:p.side*11);p.lantern.y=p.y-20;}
}

/* --- a wild region (one per group of modules) --- */
function buildWild(reg){
  const th=reg.theme, nodes=reg.nodes, n=nodes.length;
  const cx=W/2, cy=H*.45, RX=W*.36, RY=H*.31;
  PLAZA={x:cx,y:H-330,r:120};
  POND={x:cx,y:cy,rx:th.lake?.[0]||250,ry:th.lake?.[1]||140};
  GROVE=th.crystals?{x:cx,y:cy}:null;
  // stones ring the lake: bottom-left → over the top → bottom-right
  const pts=[];
  for(let k=0;k<n;k++){const a=(150+k*(240/Math.max(1,n-1)))*Math.PI/180;pts.push([cx+Math.cos(a)*RX+rand(-20,20),cy+Math.sin(a)*RY+rand(-12,12)]);}
  CLEARINGS=pts.map(([x,y])=>({x,y,r:62}));
  const ring=[[PLAZA.x-70,PLAZA.y-50],...pts,[PLAZA.x+70,PLAZA.y-50]];
  PATHS=[[[cx,H+30],[cx-10,H-170],[cx,PLAZA.y-60]],ring];
  const nextReg=COURSE.regions.find(r=>r.requires===reg.id);
  const top=pts.reduce((a,b)=>b[1]<a[1]?b:a);
  if(nextReg)PATHS.push([[top[0],top[1]],[(top[0]+cx)/2,top[1]/2+20],[cx,10]]);
  SCENE={fire:true,skyLanterns:th.skyLanterns,aurora:th.aurora};GROUND_TINT=th.tint;
  buildSurface();paintGround();
  claim(PLAZA.x,PLAZA.y,PLAZA.r);
  addCampfire(PLAZA.x,PLAZA.y);
  addOwl(PLAZA.x+75,PLAZA.y-30,reg.npc);
  addGate(cx,H-40,'hub','from'+reg.id[0].toUpperCase()+reg.id.slice(1));
  if(nextReg)addGate(cx,70,nextReg.id,'fromPrev');
  pts.forEach(([x,y],k)=>addStone(x,y,nodes[k]));
  const ringLamps=[];
  // waypoint lecterns: evenly spaced along the path segment that leads to each stone
  const ringS=sampleCurve(ring,6);
  const near=([x,y])=>{let bi=0,bd=1e9;ringS.forEach(([sx,sy],i)=>{const d=(sx-x)**2+(sy-y)**2;if(d<bd){bd=d;bi=i;}});return bi;};

/* ---------- calculator: safe expression parser (no eval) + panel ---------- */
const Calc=(()=>{
  const FN={sqrt:Math.sqrt,ln:Math.log,log:Math.log10,exp:Math.exp,abs:Math.abs,
    sum:(...a)=>a.reduce((s,v)=>s+v,0),mean:(...a)=>a.reduce((s,v)=>s+v,0)/a.length,
    sumsq:(...a)=>a.reduce((s,v)=>s+v*v,0),
    var:(...a)=>{const m=a.reduce((s,v)=>s+v,0)/a.length;return a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1);},
    sd:(...a)=>Math.sqrt(FN.var(...a)),min:Math.min,max:Math.max,round:(x,d=0)=>Math.round(x*10**d)/10**d};
  function tokenize(s){
    s=s.replace(/[×✕]/g,'*').replace(/[÷]/g,'/').replace(/[−–]/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/\$/g,'');
    const t=[];let i=0;
    while(i<s.length){const c=s[i];
      if(/\s/.test(c)){i++;continue;}
      const m=s.slice(i).match(/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i);
      if(m){t.push({k:'n',v:parseFloat(m[0])});i+=m[0].length;continue;}
      const w=s.slice(i).match(/^[a-z]+/i);
      if(w){t.push({k:'w',v:w[0].toLowerCase()});i+=w[0].length;continue;}
      if('+-*/^(),%'.includes(c)){t.push({k:c});i++;continue;}
      throw new Error(`Unexpected “${c}”`);}
    return t;
  }
  function evaluate(src,ans=0){
    const t=tokenize(src);let p=0;
    const peek=()=>t[p],eat=k=>{if(t[p]&&t[p].k===k){p++;return true;}return false;};
    const expr=()=>{let v=term();for(;;){if(eat('+'))v+=term();else if(eat('-'))v-=term();else return v;}};
    const term=()=>{let v=unary();for(;;){if(eat('*'))v*=unary();else if(eat('/'))v/=unary();
      else if(peek()&&(peek().k==='('||peek().k==='w'||peek().k==='n'))v*=unary(); // implicit ×, e.g. 2(3+4)
      else return v;}};
    const unary=()=>{if(eat('-'))return -unary();if(eat('+'))return unary();return power();};
    const power=()=>{let b=postfix();if(eat('^'))return b**unary();return b;};
    const postfix=()=>{let v=atom();while(eat('%'))v/=100;return v;};
    const atom=()=>{const x=t[p];if(!x)throw new Error('Incomplete expression');
      if(x.k==='n'){p++;return x.v;}
      if(eat('(')){const v=expr();if(!eat(')'))throw new Error('Missing “)”');return v;}
      if(x.k==='w'){p++;const n=x.v;
        if(n==='pi')return Math.PI;if(n==='e'&&!(t[p]&&t[p].k==='('))return Math.E;if(n==='ans')return ans;
        const f=FN[n];if(!f)throw new Error(`Unknown “${n}”`);
        if(!eat('(')){return f(atom());}
        const args=[];if(!eat(')')){do{args.push(expr());}while(eat(','));if(!eat(')'))throw new Error('Missing “)”');}
        return f(...args);}
      throw new Error('Unexpected symbol');};
    const v=expr();if(p<t.length)throw new Error('Unexpected input');if(!isFinite(v))throw new Error('Not a finite number');return v;
  }
  const fmt=v=>{const a=Math.abs(v);if(a!==0&&(a<1e-6||a>=1e12))return v.toExponential(6);return String(Number(v.toPrecision(12)));};
  return {evaluate,fmt};
})();

const calcEl=document.getElementById('calc');
let calcAns=0;
function buildCalc(){
  const keys=[['(',')','^','√(','⌫'],['7','8','9','÷','C'],['4','5','6','×','ln('],['1','2','3','−','exp('],['0','.',',','+','='],['x²','1/x','ANS','sum(','mean('],['sumsq(','var(','sd(','log(','π']];
  calcEl.innerHTML=`<div class="ch"><b>Calculator</b><button class="cx" aria-label="Close calculator">×</button></div>
  <input id="cIn" autocomplete="off" spellcheck="false" aria-label="Expression" placeholder="e.g. (12.4-9.8)^2 + sumsq(1,-2,3)">
  <div id="cOut" class="cout">&nbsp;</div>
  <div class="keys">${keys.flat().map(k=>`<button data-k="${k}"${k==='='?' class="eqk"':''}>${k.replace('(','')==='√'?'√':k}</button>`).join('')}</div>
  <div class="hist" id="cHist"></div>
  <button id="cUse" class="use hidden">Use result as my answer</button>
  <p class="chelp">Lists: <code>mean(4,7,9)</code> · <code>sumsq(1,-2,3)</code> = Σx² · <code>var()</code> and <code>sd()</code> use n − 1 · <code>ln</code> natural log · <code>log</code> base 10.</p>`;
  const inp=calcEl.querySelector('#cIn'),out=calcEl.querySelector('#cOut'),hist=calcEl.querySelector('#cHist');
  const run=()=>{const s=inp.value.trim();if(!s)return;try{const v=Calc.evaluate(s,calcAns);calcAns=v;out.textContent='= '+Calc.fmt(v);out.className='cout ok';
      const row=document.createElement('div');row.textContent=`${s} = ${Calc.fmt(v)}`;hist.prepend(row);while(hist.children.length>5)hist.lastChild.remove();
      inp.value=Calc.fmt(v);syncUse();}catch(e){out.textContent=e.message;out.className='cout err';}};
  const ins=s=>{const a=inp.selectionStart??inp.value.length,b=inp.selectionEnd??a;inp.value=inp.value.slice(0,a)+s+inp.value.slice(b);inp.focus();inp.setSelectionRange(a+s.length,a+s.length);};
  calcEl.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(k==='=')run();else if(k==='C'){inp.value='';out.innerHTML='&nbsp;';out.className='cout';}
    else if(k==='⌫'){inp.value=inp.value.slice(0,-1);inp.focus();}
    else if(k==='x²')ins('^2');else if(k==='1/x'){inp.value=`1/(${inp.value||'ans'})`;}
    else if(k==='ANS')ins('ans');else if(k==='√(')ins('sqrt(');else ins(k);});
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();run();}if(e.key==='Escape')toggleCalc(false);});
  inp.addEventListener('keyup',e=>e.stopPropagation());
  calcEl.querySelector('.cx').onclick=()=>toggleCalc(false);
  calcEl.querySelector('#cUse').onclick=()=>{const n=document.getElementById('numIn');if(n&&!n.disabled){n.value=Calc.fmt(calcAns);n.focus();toggleCalc(false);}};
}
function syncUse(){const n=document.getElementById('numIn');calcEl.querySelector('#cUse').classList.toggle('hidden',!(n&&!n.disabled));}
function toggleCalc(on){if(!calcEl.innerHTML)buildCalc();const show=on??calcEl.classList.contains('hidden');calcEl.classList.toggle('hidden',!show);if(show){syncUse();setTimeout(()=>calcEl.querySelector('#cIn').focus(),30);}}

   Low drone + soft string pad + plucked harp arpeggios + an occasional flute line,

    const S=SCORES[region]||SCORES.hub,beat=60/S.bpm,bar=beat*4;
    while(next<ac.currentTime+1.5){
      const t=next,chord=S.prog[Math.floor(step/16)%S.prog.length],inBar=step%16;
      if(step%16===0){pad(chord.slice(1),t,bar*.98,S.cut);if(Math.floor(step/16)%2===0)drone(chord[0],t,bar*2);}
      // harp: gentle broken chord on eighth notes, with rests
      if(inBar%2===0&&Math.random()<.62){const pool=[...chord.slice(1).map(n=>n+12),chord[1]+24];harp(pool[(inBar/2+Math.floor(step/16))%pool.length],t+Math.random()*.03,.05+Math.random()*.03);}
      // flute: a short phrase every few bars
      if(inBar===0&&!phrase.length&&Math.random()<S.flute){let k=Math.floor(Math.random()*4)+2;const len=3+Math.floor(Math.random()*3);
        for(let i=0;i<len;i++){k=Math.max(0,Math.min(S.scale.length-1,k+[-1,1,1,-2,2,0][Math.floor(Math.random()*6)]));phrase.push({n:S.scale[k]+12,beats:[2,2,4,3][Math.floor(Math.random()*4)]});}
        let tt=t+beat*2;for(const p of phrase){flute(p.n,tt,p.beats*beat*.9);tt+=p.beats*beat;}setTimeout(()=>phrase=[],(tt-ac.currentTime)*1000);}
      next+=beat/2;step+=2;
    }
  }
  function level(tc=.8){if(!ac)return;const target=on?vol*2.4*(ducked?.35:1):0;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(target,ac.currentTime,tc);}
  return {
    start(){if(started)return;started=true;init();next=ac.currentTime+.2;timer=setInterval(schedule,250);schedule();level();},
    setRegion(id){if(id===region)return;region=id;if(ac){master.gain.setTargetAtTime(0,ac.currentTime,.4);setTimeout(()=>{step=0;next=Math.max(next,ac.currentTime+.6);level();},1400);}},
    set(onV,volV,tc){on=onV;vol=volV;if(ac&&ac.state==='suspended')ac.resume();level(tc);},
    duck(v){if(ducked===!!v)return;ducked=!!v;level();},
    get started(){return started;},
  };
})();

/* ---------- statistics: OLS with Excel-style output ---------- */
const Stats=(()=>{
  function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];
    let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const v of c)s+=v/++y;return -t+Math.log(2.5066282746310005*s/x);}
  function betacf(a,b,x){const MAXIT=200,EPS=3e-14,FPMIN=1e-300;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<FPMIN)d=FPMIN;d=1/d;let h=d;
    for(let m=1;m<=MAXIT;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;h*=d*c;
      aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break;}return h;}
  function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
    return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;}
  const tcdf=(t,v)=>{const p=.5*ibeta(v/(v+t*t),v/2,.5);return t>0?1-p:p;};
  const tinv=(p,v)=>{let lo=-60,hi=60;for(let i=0;i<120;i++){const m=(lo+hi)/2;if(tcdf(m,v)<p)lo=m;else hi=m;}return (lo+hi)/2;};
  const fsf=(F,d1,d2)=>ibeta(d2/(d2+d1*F),d2/2,d1/2);
  const p2=(t,v)=>ibeta(v/(v+t*t),v/2,.5); // two-sided p, computed directly (no cancellation)
  function inv(A){const n=A.length,M=A.map((r,i)=>[...r,...r.map((_,j)=>i===j?1:0)]);
    for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;[M[i],M[p]]=[M[p],M[i]];
      const d=M[i][i];for(let j=0;j<2*n;j++)M[i][j]/=d;for(let r=0;r<n;r++)if(r!==i){const f=M[r][i];for(let j=0;j<2*n;j++)M[r][j]-=f*M[i][j];}}
    return M.map(r=>r.slice(n));}
  /** X: array of rows (no intercept column), y: array. Returns Excel-like regression summary. */
  function ols(X,y,names){
    const n=y.length,rows=X.map(r=>[1,...(Array.isArray(r)?r:[r])]),k=rows[0].length;
    const XtX=Array.from({length:k},(_,i)=>Array.from({length:k},(_,j)=>rows.reduce((s,r)=>s+r[i]*r[j],0)));
    const Xty=Array.from({length:k},(_,i)=>rows.reduce((s,r,t)=>s+r[i]*y[t],0));
    const XI=inv(XtX),b=XI.map(r=>r.reduce((s,v,j)=>s+v*Xty[j],0));
    const fit=rows.map(r=>r.reduce((s,v,j)=>s+v*b[j],0)),res=y.map((v,i)=>v-fit[i]);
    const ybar=y.reduce((a,c)=>a+c,0)/n,SST=y.reduce((s,v)=>s+(v-ybar)**2,0),SSE=res.reduce((s,v)=>s+v*v,0),SSR=SST-SSE;
    const df=n-k,s2=SSE/df,tc=tinv(.975,df);
    const coef=b.map((v,j)=>{const se=Math.sqrt(s2*XI[j][j]),t=v/se;return {name:j?(names?.[j-1]||'X'+j):'Intercept',b:v,se,t,p:p2(t,df),lo:v-tc*se,hi:v+tc*se};});
    const R2=SSR/SST,F=(SSR/(k-1))/s2;
    return {n,k,df,b,coef,fit,res,SST,SSE,SSR,R2,adjR2:1-(1-R2)*(n-1)/df,multR:Math.sqrt(R2),se:Math.sqrt(s2),F,pF:fsf(F,k-1,df),
      predict:x=>[1,...(Array.isArray(x)?x:[x])].reduce((s,v,j)=>s+v*b[j],0)};
  }
  return {ols,tcdf,tinv,fsf,p2};
})();

    const chk=btn('Compare with the model answer','primary');acts.appendChild(chk);
    chk.onclick=()=>{if(ta.value.trim().length<15){feedback('no','Write a few sentences first — a rough answer is fine.');return;}
      ta.readOnly=true;acts.innerHTML='';feedback('','');
      pz.insertAdjacentHTML('beforeend',`<div class="model"><b>Model answer</b><p>${p.model}</p><b>Tick each key point your answer covered:</b>${p.points.map((t,i)=>`<label class="kp"><input type="checkbox" data-i="${i}"> <span>${t}</span></label>`).join('')}</div>`);
      const done=btn('Done','primary');acts.appendChild(done);done.focus();
      done.onclick=()=>{const got=pz.querySelectorAll('.kp input:checked').length,need=Math.ceil(p.points.length*2/3);
        pz.querySelectorAll('.kp input').forEach(x=>x.disabled=true);
        if(got>=need){p.why=`You covered ${got} of ${p.points.length} key points. ${p.why||''}`;pass();}
        else{it.missed=true;noteMiss(it);feedback('no',`You covered ${got} of ${p.points.length} key points — aim for at least ${need}. ${p.why||''}`);acts.innerHTML='';
          const b=btn(run.i<run.items.length-1?'Continue':'Finish','primary');acts.appendChild(b);b.onclick=next;b.focus();stat(0,it);}};};
  }
  function feedback(kind,msg){const fb=card.querySelector('#fb');fb.className='fb '+(kind||'info');fb.innerHTML=msg;}
  drawTools();
}
function btn(label,cls){const b=document.createElement('button');b.className=cls;b.innerHTML=label;return b;}
function stat(correctFirst,it){SAVE.stats.answered++;SAVE.stats.first+=correctFirst;if(it)recordQ(it,correctFirst);}
/* per-question history for the study report: attempts, first-try hits, last 3 outcomes, time, calc vs concept */
function recordQ(it,c){
  const k=it.node+'|'+it.idx,Q=SAVE.qs||(SAVE.qs={}),q=Q[k]||(Q[k]={n:0,ok:0,h:'',ms:0});
  q.n++;q.ok+=c;q.h=(q.h+c).slice(-3);q.ts=Date.now();
  // spaced review: right first time → next review further out (1, 3, 7, 16, 35 days); a miss → due again now
  q.box=c?Math.min((q.box||0)+1,5):0;q.due=Date.now()+[0,1,3,7,16,35][q.box]*864e5;
  // calibration: how often 'sure' answers are actually right
  if(it.conf!==undefined){const C=SAVE.cal||(SAVE.cal={s:{n:0,ok:0},u:{n:0,ok:0}}),b=it.conf?C.s:C.u;b.n++;b.ok+=c;q.sw=it.conf===1&&!c?1:(c?0:q.sw||0);}q.ms+=Math.min(600000,Date.now()-(it.t0||Date.now()));q.c=it.p.type==='num'?1:0;
  const d=new Date().toLocaleDateString('en-CA'),D=SAVE.days||(SAVE.days={});D[d]=(D[d]||0)+1;
  const ks=Object.keys(D).sort();while(ks.length>60)delete D[ks.shift()];
}
function noteMiss(it){if(!['stone','exam','focus','examc'].includes(run.mode))return;if(!SAVE.missed.some(m=>m.node===it.node&&m.idx===it.idx))SAVE.missed.push({node:it.node,idx:it.idx});persist();}
function next(){
  if(run.i<run.items.length-1){run.i++;renderPuzzle();return;}
  const r=run;if(r.mode==='exam'||r.mode==='examc')examTime=Date.now()-r.t0;closeCard();r.onDone&&r.onDone(r.items);persist();
}

/* questions whose spaced-review date has come round */
function dueKeys(){const now=Date.now(),Q=SAVE.qs||{};return Object.keys(Q).filter(k=>{const q=Q[k],[node,idx]=k.split('|');return q.due&&q.due<=now&&q.box>0&&NODES[node]?.puzzles?.[+idx];}).sort((a,b)=>Q[a].due-Q[b].due);}

   cats:['Expected β < 0','Expected β > 0'],
   items:[{t:'Your own price (P)',c:0},{t:'A competitor’s price (Pᶜ)',c:1},{t:'Customer budget or income (Y)',c:1},{t:'Price of a complement customers must buy with your product',c:0}],
   why:'Higher own price lowers quantity demanded; a pricier competitor or a bigger customer budget raises it. A complement works like your own price — when it gets dearer, demand for the pair falls.'},
  {type:'mc',q:'Theory and data play different roles in a regression. Which split is right?',
   opts:['Theory predicts the direction (sign); data estimate the magnitude','Data predict the direction; theory estimates the magnitude','Theory tells you how reliable an effect is; data tell you its sign','Data decide which variables belong; theory just labels them'],a:0,

   why:'A coefficient is a marginal relationship in the units of the problem, conditional on the other included factors. It is evidence about a relationship — not proof of a causal mechanism, and not a share of variance explained.'};}},
