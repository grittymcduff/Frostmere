/* ---- Stone 3: the Magic Hill booth (prediction → residual → payoff) ---- */
function genMagic(r,n=20){
  const h=[],w=[];for(let i=0;i<n;i++){const x=ri(r,4,15);h.push(x);w.push(Math.round(103+6.4*x+rngGauss(r)*9));}
  const m=Stats.ols(h,w,['Height']);return {h,w,m,b0:round(m.b[0],2),b1:round(m.b[1],3)};
}
const ftin=x=>x<12?`5 ft ${x} in`:`6 ft ${x-12} in`;
const magicExhibit=d=>Exhibit.scatter(d.h,d.w,{line:[d.b0,d.b1],xl:'Height: inches above 5 feet',yl:'Weight (lb)',eq:`ŷ = ${d.b0} + ${d.b1}x`,title:'Weight against height'})
  +Exhibit.eq(`Predicted weight = ${d.b0} + ${d.b1} × (inches above 5 feet)`);
NODES['m1-magic']={kicker:'Module 1 · Fitted values and residuals',title:'The Magic Hill Booth',
  intro:'Summer job: you guess customers’ weights at Magic Hill. Within 10 lb, you keep the customer’s $2. Miss by more and you refund the $2 and hand over a $3 prize. Can a height model make the booth pay?',
  puzzles:[
  {make:r=>{const d=genMagic(r),x=ri(r,5,14),a=d.b0+d.b1*x;return {type:'num',exhibit:magicExhibit(d),
    q:`A customer is <b>${ftin(x)}</b>. Using the fitted equation, what weight should you guess?`,a,tol:.15,unit:'lb',
    hint:`Code height as inches above 5 feet first — ${ftin(x)} is X = ${x}.`,
    solution:`X = ${x}, so ${d.b0} + ${d.b1} × ${x} = ${fmtNum(a,1)} lb.`,
    why:'Coding height as inches above 5 feet makes the intercept the predicted weight of a five-foot customer — a sensible reference point.'};}},
  {make:r=>{const d=genMagic(r),x=ri(r,5,14),pred=d.b0+d.b1*x,off=(r()<.5?-1:1)*rr(r,3,15),W=Math.round(pred+off),a=W-pred;return {type:'num',exhibit:magicExhibit(d),
    q:`A customer who is <b>${ftin(x)}</b> actually weighs <b>${W} lb</b>. What is the residual?`,a,tol:.15,unit:'lb',
    hint:'Residual = actual − predicted. Predict first, then subtract.',
    solution:`Predicted = ${d.b0} + ${d.b1} × ${x} = ${fmtNum(pred,1)}. Residual = ${W} − ${fmtNum(pred,1)} = ${fmtNum(a,1)} lb.`,
    why:`${a<0?'A negative residual means the model overpredicted':'A positive residual means the model underpredicted'} this customer’s weight. ${Math.abs(a)<=10?'Within 10 lb — you keep the $2.':'More than 10 lb off — that costs you $3.'}`};}},
  {make:r=>{const e=round((r()<.5?-1:1)*rr(r,2,9),1),neg=e<0;return {type:'mc',q:`A customer’s residual is <b>${e>0?'+':''}${fmtNum(e,1)} lb</b>. What does that tell you?`,
    opts:['The model overpredicted this customer’s weight','The model underpredicted this customer’s weight','Height does not help predict weight','The guess lost money'],a:neg?0:1,
    hints:{2:'One residual says nothing about whether height is useful overall.',3:`Is |${fmtNum(e,1)}| more than 10 lb?`},
    why:`e = Y − Ŷ. ${neg?'Negative means the actual weight was below the prediction — an overprediction.':'Positive means the actual weight was above the prediction — an underprediction.'} Within 10 lb, so the booth still earns $2.`};}},
  {make:r=>{const d=genMagic(r),rows=[];let net=0,wins=0;
    for(let i=0;i<8;i++){const x=ri(r,5,15),pred=round(d.b0+d.b1*x,1);let off=rngGauss(r)*9;if(i===2)off=(r()<.5?-1:1)*rr(r,12,17);if(i===5)off=(r()<.5?-1:1)*rr(r,1,7);
      const W=Math.round(pred+off),win=Math.abs(W-pred)<=10;net+=win?2:-3;wins+=win;rows.push([i+1,x,W,fmtNum(pred,1)]);}
    return {type:'num',exhibit:Exhibit.table(['Customer','Inches above 5 ft','Actual weight','Predicted weight'],rows),
      q:'Eight customers today. You keep <b>$2</b> when your guess is within 10 lb, and lose <b>$3</b> when it misses by more. What is the booth’s net gain?',a:net,tol:.01,pre:'$',
      hint:'Compute each residual (actual − predicted), count how many are within ±10 lb, then wins × $2 − misses × $3.',
      solution:`${wins} within 10 lb × $2 − ${8-wins} misses × $3 = ${money(net,0)}.`,
      why:'Judge the model in the units of the decision — dollars at the booth — not only by statistical fit.'};}},
  {type:'mc',q:'Why does the booth model code height as <b>inches above 5 feet</b> instead of total inches?',
   opts:['So the intercept is the predicted weight at five feet','Because Excel handles small numbers more accurately','To make the slope larger and easier to read','So the residuals all come out positive'],a:0,
   why:'With total inches, X = 0 means a person zero inches tall, and the intercept is meaningless. The coding of X decides whether the intercept has a sensible meaning; the slope is unchanged.'},
]};

/* ---- Stone 4: the Units Mill (coding, intercepts, scenarios) ---- */
function genFood(r){const inc=[],food=[];for(let i=0;i<40;i++){const x=round(rr(r,3.5,33.5),2);inc.push(x);food.push(round(Math.max(55+rr(r,0,25),83+10.2*x+rngGauss(r)*70),2));}
  const m=Stats.ols(inc,food,['Income']);return {inc,food,m,b0:round(m.b[0],2),b1:round(m.b[1],2)};}
const foodEq=d=>Exhibit.eq(`Predicted weekly food spending = ${d.b0} + ${d.b1} × Income <small>(weekly income in $100 units)</small>`);
function genHouse(r){const sz=[],pr=[];for(let i=0;i<30;i++){const s=Math.round(rr(r,1100,3200));sz.push(s);pr.push(Math.round(Math.max(45000,-100000+128*s+rngGauss(r)*28000)));}
  const m=Stats.ols(sz,pr,['Size']);return {m,b0:Math.round(m.b[0]),b1:round(m.b[1],2),min:Math.min(...sz),max:Math.max(...sz)};}
NODES['m1-units']={kicker:'Module 1 · Units, coding, and the relevant range',title:'The Units Mill',
  intro:'Most coefficient mistakes are unit mistakes or overclaims about causality — not arithmetic. The mill grinds raw numbers into sentences a manager can use.',
  puzzles:[
  {make:r=>{const d=genFood(r);return {type:'mc',exhibit:Exhibit.scatter(d.inc,d.food,{line:[d.m.b[0],d.m.b[1]],xl:'Weekly income ($100 units)',yl:'Weekly food ($)',eq:`ŷ = ${d.b0} + ${d.b1}x`})+foodEq(d),
    q:'Forty three-person households. Which interpretation of the slope is correct?',
    opts:[`Each extra $100 of weekly income goes with about $${d.b1} more food spending`,`Each extra $1 of weekly income goes with about $${d.b1} more food spending`,`Every household earning $100 more will spend exactly $${d.b1} more on food`,`A household with zero income is expected to spend $${d.b0} a week on food`],a:0,
    hints:{1:'Check how income is coded.',2:'The slope is an average relationship, not a promise for each household.',3:'Is zero income anywhere near the observed data?'},
    why:'Translate the coded unit back into the manager’s natural unit. Scaling income to $100 units changes the coefficient’s number, not the economic relationship.'};}},
  {make:r=>{const d=genFood(r),inc=pick([1500,2000,2500,3000]),x=inc/100,a=d.b0+d.b1*x;return {type:'num',exhibit:foodEq(d),
    q:`Forecast expected weekly food spending for a household with weekly income of <b>$${inc.toLocaleString()}</b>.`,a,tol:.06,pre:'$',
    hint:`Code income first: $${inc.toLocaleString()} is X = ${x}, not ${inc}.`,
    solution:`X = ${x}: ${d.b0} + ${d.b1} × ${x} = ${money(a)}.`,
    why:'Prediction is straightforward only once the units, coding, and relevant range are understood.'};}},
  {make:r=>{const d=genFood(r),N=pick([5000,8000,10000,12000,15000]),a=N*d.b1;return {type:'num',exhibit:foodEq(d),
    q:`A supermarket’s area has <b>${N.toLocaleString()}</b> comparable households, and weekly income rises by $100 in each. Roughly how much more weekly food spending should the store plan for, across the area?`,a,tol:1,pre:'$',
    hint:'A $100 rise is one unit of X, so each household adds about β₁.',
    solution:`${N.toLocaleString()} × ${money(d.b1)} = ${money(a,0)}.`,
    why:'Regression gives a scenario input. Whether the store captures that spending depends on comparability, prices, competition, and how stable the relationship is.'};}},
  {make:r=>{const d=genHouse(r);return {type:'mc',exhibit:Exhibit.eq(`Predicted PRICE = ${d.b0<0?'−':''}${Math.abs(d.b0).toLocaleString()} + ${d.b1} × SIZE <small>(square feet; sample ${d.min.toLocaleString()}–${d.max.toLocaleString()})</small>`),
    q:`The intercept is ${money(d.b0,0)}. How should you read it?`,
    opts:['A prediction at zero sq. ft. — outside the data, not literal','Empty lots in this market sell for a negative price on average','The model is broken, so the slope can’t be trusted either','Every house loses that much value at the time of sale'],a:0,
    why:'A coefficient can be mathematically necessary without having a useful stand-alone interpretation. The slope is useful inside the relevant range; the intercept needs a reality check.'};}},
  {make:r=>{const d=genHouse(r),s=Math.round(rr(r,d.min+200,d.max-200)/50)*50,a=d.b0+d.b1*s;return {type:'num',
    exhibit:Exhibit.eq(`Predicted PRICE = ${d.b0<0?'−':''}${Math.abs(d.b0).toLocaleString()} + ${d.b1} × SIZE`),
    q:`What is the predicted price of a <b>${s.toLocaleString()} sq ft</b> house?`,a,tol:1,pre:'$',
    hint:'Substitute SIZE and keep the intercept’s sign.',
    solution:`${d.b0.toLocaleString()} + ${d.b1} × ${s.toLocaleString()} = ${money(a,0)}.`,
    why:'Forecast ≠ appraisal. The prediction is an average conditional on size alone; neighborhood, condition, age, and amenities sit in the error term.'};}},
]};

/* ---- Stone 5: the Guild Ledger (reading Excel output) ---- */
function genService(r){const c=[],y=[];for(let i=0;i<20;i++){const x=ri(r,12,50);c.push(x);y.push(round(36+4.0*x+rngGauss(r)*3.5,1));}
  const m=Stats.ols(c,y,['Customers']);return {c,y,m};}
const svcEx=d=>Exhibit.excel(d.m,'Annual service revenue ($M)');
NODES['m1-ledger']={kicker:'Module 1 · Reading Excel output',title:'The Guild Ledger',
  intro:'The Service Guild ran Data → Data Analysis → Regression on 20 branches: annual service revenue ($M) against active customers. Excel did the arithmetic. Your job is judgment.',
  puzzles:[
  {type:'order',q:'Put the recommended order for reading regression output into sequence.',
   items:['Coefficient signs and units','Magnitudes and practical importance','Standard errors, t statistics, and p-values','Fit and residual behavior','Plausibility of the specification'],
   why:'Signs and units first, then size, then precision, then fit and residuals, and finally whether the whole specification is believable.'},
  {make:r=>{const d=genService(r),k=pick([3,5,8,10]),a=k*d.m.b[1];return {type:'num',exhibit:svcEx(d),
    q:`The guild adds <b>${k} active customers</b> to a branch. By how much does expected annual service revenue change?`,a,tol:.06,pre:'$',unit:'M',
    hint:'Use the Customers coefficient: it is $M per additional active customer.',
    solution:`${k} × ${Exhibit.xl(d.m.b[1])} ≈ ${money(a)}M.`,
    why:'A point prediction starts the conversation. Is the link causal? Can operations serve the new customers? Would price or customer mix change? How wide is the uncertainty?'};}},
  {make:r=>{const d=genService(r),lo=Math.min(...d.c),hi=Math.max(...d.c);return {type:'mc',exhibit:svcEx(d),
    q:`Branches in the sample have between ${lo} and ${hi} customers. What does the intercept (≈ ${round(d.m.b[0],1)}) tell you?`,
    opts:['An extrapolated baseline outside the observed range','The revenue a branch with no customers will earn','Fixed revenue every branch earns regardless of customers','Nothing usable, so the whole model should be dropped'],a:0,
    why:'The slope is useful inside the relevant range; the intercept requires a business reality check.'};}},
  {make:r=>{const d=genService(r),x=ri(r,18,45),pred=d.m.predict(x),act=round(pred+(r()<.5?-1:1)*rr(r,2,7),1),a=act-pred;return {type:'num',exhibit:svcEx(d),
    q:`A branch with <b>${x} customers</b> earned <b>$${act}M</b>. What is its residual?`,a,tol:.1,pre:'$',unit:'M',
    hint:'Residual = actual − (Intercept + Customers coefficient × customers).',
    solution:`Predicted = ${Exhibit.xl(d.m.b[0])} + ${Exhibit.xl(d.m.b[1])} × ${x} = ${fmtNum(pred,2)}. Residual = ${act} − ${fmtNum(pred,2)} = ${fmtNum(a,2)}.`,
    why:'A residual tells you how far the model missed — not why. Large or patterned residuals point to demand shifts, outages, churn, missing variables, or the wrong functional form.'};}},
  {make:r=>{const d=genService(r);return {type:'mc',exhibit:svcEx(d),
    q:`R Square is ${Exhibit.xl(d.m.R2)}. Which conclusion is justified?`,
    opts:['A strong association here — but fit alone doesn’t prove cause','The model shows that adding customers causes revenue to rise','Every future branch should land almost exactly on the line','The intercept can now be read literally, given the fit'],a:0,
    why:'The goal is not to celebrate a high R² but to interpret what the model does and does not support. The teaching data are deliberately clean; real operating data are noisier.'};}},
]};

/* exam-guide gap: why managers use econometrics */
NODES['m1-signs'].puzzles.push({type:'mc',q:'What is econometrics mainly for in a managerial setting?',
  opts:['Measuring relationships and their uncertainty to inform decisions','Proving which business theories are true from past data','Replacing managerial judgment with an objective formula','Finding whichever variables turn out significant in the data'],a:0,
  why:'Regression quantifies a relationship and its uncertainty; theory supplies the story and judgment makes the decision.'});

/* ==== content/m10.js ==== */
/* ==========================================================================
   MODULE 10 — Heteroskedasticity
   Stone: the Widening Fan (residual-spread patterns, functional form vs
   changing variance, Breusch–Pagan and White, what it does and doesn't harm).
   ========================================================================== */
const CHI5={1:3.841,2:5.991,3:7.815,4:9.488,5:11.070,9:16.919};   // χ² critical values at α = .05

NODES['m10-hetero']={kicker:'Module 10 · Heteroskedasticity',title:'The Widening Fan',
  intro:'Frost fans out from the stone, thin at one end and wide at the other. When the size of the errors grows with the size of the observation, the average relationship can be fine — but the model’s confidence in itself is not.',
  lessons:[
   {title:'Constant spread versus a fan',
    teach:`<p><b>Homoskedasticity:</b> the error variance is the same for every observation (Var(εᵢ) = σ²). <b>Heteroskedasticity:</b> it changes systematically (Var(εᵢ) = σᵢ²) — usually growing with scale. It is most common in <b>cross-sectional</b> data that mixes small and large firms, stores, or missions.</p>
    <div class="ex">Residual plot warning shapes: a <b>spray</b> (widening), a <b>funnel</b> (narrowing), or a <b>bow-tie</b>.<br>A residual pattern that <b>curves</b> around zero is different: that points to the wrong <b>functional form</b> (a mean problem), not changing variance.</div>
    <p><b>Pure</b> heteroskedasticity: the equation is right, the variance still changes. <b>Impure</b>: caused by misspecification — an omitted variable or the wrong form. Check the equation first.</p>
    <p><b>Consequences:</b> coefficients are <b>not biased</b>, but OLS is no longer BLUE and the usual <b>standard errors are wrong</b>, so t-tests, p-values, and confidence intervals are unreliable.</p>`,
    practice:[
     {make:r=>{const k=pick(['spray','funnel','random']),d=genResid(r,k),keys=['random','spray','funnel'];return {type:'mc',exhibit:residPlot(d,'Store size'),
      q:'Residuals from a cross-section of stores. What does the plot suggest?',opts:keys.map(x=>RES_PATTERNS[x].d),a:keys.indexOf(k),
      why:'A spread that grows or shrinks with X is the visual signature of heteroskedasticity; an even band is what you hope to see.'};}},
     {type:'sort',q:'Under pure heteroskedasticity, which of these still hold?',cats:['Still OK','No longer trustworthy'],
      items:[{t:'Coefficient estimates are unbiased',c:0},{t:'The usual standard errors',c:1},{t:'p-values and confidence intervals from Excel’s default output',c:1},{t:'OLS is the minimum-variance (BLUE) estimator',c:1}],
      why:'Heteroskedasticity is a credibility problem for inference, not mainly a coefficient problem.'},
    ]},
   {title:'Breusch–Pagan and White',
    teach:`<p>Both tests regress the <b>squared residuals</b> on explanatory variables and ask whether anything explains the error size. H₀: constant variance.</p>
    <div class="ex"><b>Breusch–Pagan:</b> e² on the original Xs (a <i>narrow</i>, linear search). df = number of Xs.<br>
    <b>White:</b> e² on the Xs, their <b>squares</b>, and their <b>cross-products</b> (a <i>wide</i> search). With 2 Xs, df = 5.<br>
    Test statistic: <b>LM = n × R²</b> of that auxiliary regression → compare with χ²(df). Reject H₀ if LM &gt; critical value (or p ≤ .05).</div>
    <p>They can disagree without contradicting each other: in the course’s space-mission data, Breusch–Pagan found nothing (LM = 2.16, p = .34) while White did (LM = 12.81, p = .025). White simply looked for more kinds of patterns.</p>
    <p><b>Response:</b> fix the mean equation first (a U-shaped residual plot means a missing curve), re-estimate, re-test. If the variance still changes, use <b>robust standard errors</b>. Don’t pick the test that gives the answer you prefer.</p>`,
    practice:[
     {make:r=>{const n=pick([24,30,40,50]),R=round(rr(r,.05,.35),3),lm=n*R;return {type:'num',q:`A Breusch–Pagan auxiliary regression on <b>n = ${n}</b> observations has R² = <b>${R}</b>. What is the LM statistic?`,a:lm,tol:.02,
      hint:'LM = n × R² of the auxiliary regression',solution:`${n} × ${R} = ${round(lm,3)}.`,why:'Compare LM with the χ² critical value for the test’s degrees of freedom.'};}},
     {type:'mc',q:'Breusch–Pagan says “no heteroskedasticity” (p = .34); White says “yes” (p = .025) on the same data. Why?',
      opts:['White also searches squared and interaction patterns','One of the two tests must have been run incorrectly','White is always right; Breusch–Pagan is obsolete','They test different hypotheses about the coefficients'],a:0,
      why:'Narrow search found nothing; wider search found a pattern. That’s not a contradiction.'},
    ]},
  ],
  puzzles:[
   {make:r=>{const k=pick(['curve','spray']),d=genResid(r,k);return {type:'mc',exhibit:residPlot(d,'Fitted value'),
    q:'What is the first problem to address in this residual plot?',
    opts:k==='curve'?['The functional form — the residuals curve around zero','Heteroskedasticity — switch to robust standard errors','Serial correlation — run a Durbin–Watson test','Nothing — the residuals still average zero']
                    :['Heteroskedasticity — the spread widens with the fit','The functional form — the residuals bend around zero','Multicollinearity between the explanatory variables','Nothing — the residuals still average zero'],a:0,
    why:k==='curve'?'A systematic curve is a mean problem. Fix the equation before testing the variance — robust SEs can’t repair the wrong shape.':'A widening spread with no curve is the classic heteroskedasticity signature: the uncertainty grows with scale.'};}},
   {make:r=>{const test=pick(['BP','White']),df=test==='BP'?2:5,n=pick([24,30,40]),R=round(rr(r,.05,.45),3),lm=n*R,crit=CHI5[df];
    return {type:'mc',exhibit:Exhibit.table(['Test','n','Auxiliary R²','df','χ² critical (5%)'],[[test==='BP'?'Breusch–Pagan':'White',n,R,df,crit]]),
     q:`Compute LM = n × R² and decide at the 5% level.`,
     opts:[`LM = ${round(lm,2)} ${lm>crit?'>':'<'} ${crit} → ${lm>crit?'reject H₀: evidence of heteroskedasticity':'do not reject H₀: no convincing evidence'}`,
           `LM = ${round(lm,2)} ${lm>crit?'>':'<'} ${crit} → ${lm>crit?'do not reject H₀: no convincing evidence':'reject H₀: evidence of heteroskedasticity'}`,
           `LM = ${round(R/n,4)} → do not reject H₀`,`LM = ${round(n*(1-R),2)} → reject H₀`],a:0,
     why:`${n} × ${R} = ${round(lm,2)}, which is ${lm>crit?'above':'below'} the χ²(${df}) critical value of ${crit}.`};}},
   {type:'mc',q:'Why might White detect heteroskedasticity that Breusch–Pagan misses?',
    opts:['White also tests squared and cross-product terms','White uses the original Y instead of squared residuals','Breusch–Pagan only works with time-series data','White has fewer degrees of freedom, so it’s stricter'],a:0,
    why:'Two flashlights: Breusch–Pagan a narrow beam, White a wider one.'},
   {type:'mc',q:'Payload mass looks highly significant (p = 0.001), but residual spread widens sharply for heavier missions. What should the program manager conclude?',
    opts:['Its direction may be fine; its precision is suspect','The coefficient is biased, so payload may not matter','The wider spread makes the estimate more reliable','Nothing changes — p = 0.001 settles the question'],a:0,
    why:'The danger is false confidence: understated uncertainty exactly where the stakes are largest.'},
   {type:'order',q:'Put the response to a suspicious residual plot in order.',
    items:['Plot the residuals against fitted values or key Xs','If they curve, fix the mean equation (add the justified nonlinear term) and re-estimate','Re-check the new residuals and run Breusch–Pagan / White','If the variance still changes, use robust standard errors'],
    why:'Specification first, variance testing second, robust inference third.'},
   {type:'sort',q:'Where is heteroskedasticity most likely?',cats:['Likely','Less likely'],
    items:[{t:'Profits of a mix of corner shops and national chains',c:0},{t:'Cost overruns across routine launches and first-of-a-kind missions',c:0},{t:'Daily output of identical machines in one plant',c:1},{t:'Household spending across incomes from $20k to $2M',c:0}],
    why:'Whenever the size of the observation changes dramatically, ask whether the size of the error changes too.'},
   {type:'mc',q:'Which statement is correct?',
    opts:['Heteroskedasticity harms inference; wrong form harms the fit','Both problems bias the coefficients in the same direction','Robust standard errors repair a wrong functional form too','Heteroskedasticity only arises in time-series data'],a:0,
    why:'Mean problem vs variance problem: fixing standard errors cannot repair an incorrectly specified equation.'},
  ]};

/* ==== content/m1_waypoints.js ==== */
/* ==========================================================================
   MODULE 1 — WAYPOINTS (mini-lessons on the path before each stone)
   Each lesson: a short teaching card + practice questions. Completing a
   stone's waypoints thaws it if it froze; they are optional otherwise.
   ========================================================================== */
const W1=(id,lessons)=>{NODES[id].lessons=lessons;};

W1('m1-signs',[
  {title:'Signs come from theory',
   teach:`<p>Before you look at any data, economic logic tells you which <b>direction</b> each driver should push the outcome.</p>
   <div class="ex">Q = β₀ + β₁P + β₂Pᶜ + β₃Y<br>β₁ &lt; 0 · your price up → quantity down<br>β₂ &gt; 0 · competitor’s price up → your quantity up<br>β₃ &gt; 0 · customer budget up → demand up</div>
   <p>Theory gives you the sign. It does <b>not</b> tell you whether the effect is large, reliable, or useful — that is what the data estimate.</p>`,
   practice:[
    {type:'mc',q:'A rival coffee shop raises its prices. Theory says your quantity demanded should…',opts:['Rise — the rival is a substitute, so β₂ > 0','Fall — all prices move together','Stay the same — only your own price matters','Be impossible to predict without data'],a:0,
     why:'A substitute getting more expensive pushes customers toward you, so the competitor-price coefficient is expected to be positive.'},
    {type:'mc',q:'Which question can economic theory answer on its own?',opts:['Which direction the effect should go','How many dollars the effect is worth','How precise the estimate is','Whether the effect is big enough to act on'],a:0,
     why:'Theory predicts direction; data estimate magnitude and precision.'},
  ]},
  {title:'Reading a coefficient like a manager',
   teach:`<p>A coefficient is a <b>marginal relationship in the units of the problem</b>, holding the other included factors constant.</p>
   <div class="ex">Income coefficient = 0.23 → a one-unit rise in income is associated with 0.23 more units demanded, holding the other included factors constant.</div>
   <p>Then ask the manager’s questions: is it <b>large enough</b> to matter, <b>precise enough</b> for the stakes, and likely to <b>survive</b> changes in competitors, technology, or policy? A correct sign alone never settles a decision.</p>
   <div class="ex"><b>What a regression model is:</b> a disciplined way to structure assumptions, a method for comparing evidence with claims, and one input into a decision under uncertainty.<br><b>What it is not:</b> a proof-generating machine, a substitute for business judgment, or a guarantee that the future will look like the past.</div>
   <p>The model can keep you from a blind bet, but it can’t decide for you.</p>`,
   practice:[
    {make:r=>{const b=round(rr(r,1.1,3.9),1);return {type:'mc',q:`An advertising coefficient is <b>${b}</b> (sales in units, advertising in $1,000s). Which reading is right?`,
      opts:[`Each extra $1,000 of ads goes with about ${b} more units sold, others held fixed`,`Each extra $1 of advertising causes ${b} more units sold, others held fixed`,`Advertising explains about ${Math.round(b*10)}% of the variation in units sold`,`Sales rise by exactly ${b} units every time advertising rises by $1,000`],a:0,
      why:'Read it in the stated units, as an association, conditional on the other included variables.'};}},
    {type:'mc',q:'Your model gives the sign you expected. Which follow-up matters most for a pricing decision?',opts:['Is the effect big and precise enough to change what we do?','Is the intercept positive, as a baseline sanity check?','Is R² high enough to call the model reliable?','Is the coefficient larger than the intercept?'],a:0,
     why:'Sign ≠ decision. Materiality and precision decide whether the evidence should move resources.'},
  ]},
]);

W1('m1-cross',[
  {title:'Four stories behind a correlation',
   teach:`<p>When A and B move together, any of four stories can be true:</p>
   <div class="ex"><b>A → B</b> · A causes B<br><b>B → A</b> · reverse causality<br><b>C → A and B</b> · a third factor drives both<br><b>Coincidence</b> · an unstable pattern with no mechanism</div>
   <p>A regression coefficient alone cannot tell these apart. Theory and research design have to.</p>`,
   practice:[
    {type:'mc',q:'Cities with more firefighters on duty report more fire damage. What’s the most likely story?',opts:['A third factor — bigger fires bring both crews and damage','Causation — more firefighters lead to more water damage','Coincidence — the two just happen to move together here','Measurement — damage is overcounted where crews are large'],a:0,
     why:'Fire size (C) drives both the staffing (A) and the damage (B). The association is real; the causal reading is wrong.'},
    {type:'mc',q:'Stores that spend more on loss-prevention staff report more shoplifting. A manager who knows high-theft stores were the ones given extra staff should suspect…',opts:['Reverse causality — theft drove the staffing','Causation — more staff somehow invite more theft','Coincidence — the two just happen to move together','A data-entry error in the shoplifting reports'],a:0,
     why:'B → A: the outcome (theft) caused the “driver” (staffing).'},
  ]},
  {title:'Design, errors, and residuals',
   teach:`<p><b>Controlled experiments</b> change one factor across comparable groups — ideally by random assignment (price tests, regional ads, service offers). <b>Observational</b> settings study outcomes as they happen — interest rates, competitor moves, and economy-wide demand usually can’t be randomized.</p>
   <div class="ex"><b>Error</b> εᵢ = Yᵢ − E(Yᵢ|Xᵢ) — the true deviation, never observed.<br><b>Residual</b> eᵢ = Yᵢ − Ŷᵢ — the miss you can see from your fitted model.</div>`,
   practice:[

/* ==== content/m2.js ==== */
/* ==========================================================================
   MODULE 2 — Ordinary Least Squares for managerial decisions
   Three stones: the Least-Squares Loom (OLS mechanics), Big Andy's Burger
   Barn (multivariate interpretation), the Mirror of Fit (R² and adjusted R²).
   ========================================================================== */

/* ---- generators ---- */
function genTiny(r){ // 4–5 points and a candidate line, for hand SSE
  const n=ri(r,4,5),b0=ri(r,1,4),b1=ri(r,2,4),x=[],y=[];
  for(let i=1;i<=n;i++){x.push(i);y.push(b0+b1*i+ri(r,-2,2));}
  const e=y.map((v,i)=>v-(b0+b1*x[i]));return {x,y,b0,b1,e,sse:e.reduce((s,v)=>s+v*v,0)};
}
function genAndy(r){
  const P=[],A=[],S=[];
  for(let i=0;i<75;i++){const p=round(rr(r,4.8,6.5),2),a=round(rr(r,.5,3.1),1);P.push(p);A.push(a);S.push(round(118.9-7.9*p+1.86*a+rngGauss(r)*4.9,1));}
  const m=Stats.ols(P.map((p,i)=>[p,A[i]]),S,['PRICE','ADVERT']);return {m,b0:m.b[0],b1:m.b[1],b2:m.b[2]};
}
const andyEx=d=>Exhibit.excel(d.m,'SALES ($1,000s) · PRICE in $ · ADVERT in $1,000s');
function genFitPair(r){ // model A: X1 only; model B: X1 + pure noise. Keep draws where adjusted R² falls.
  for(let t=0;t<40;t++){
    const n=ri(r,18,30),X1=[],Z=[],Y=[];
    for(let i=0;i<n;i++){const x=rr(r,10,60);X1.push(x);Z.push(rr(r,0,100));Y.push(50+2.2*x+rngGauss(r)*22);}
    const A=Stats.ols(X1,Y,['Price']),B=Stats.ols(X1.map((x,i)=>[x,Z[i]]),Y,['Price','Noise']);
    if(B.adjR2<A.adjR2)return {n,A,B};
  }
}

NODES['m2-ols']={kicker:'Module 2 · How OLS works',title:'The Least-Squares Loom',
  intro:'The loom weaves a line through a cloud of points by choosing the coefficients that make the squared misses as small as possible. Excel does the weaving — you need to know what it is optimizing, and what the ANOVA table is telling you.',
  lessons:[
   {title:'What least squares minimizes',
    teach:`<p>OLS picks b₀ and b₁ to minimize the <b>sum of squared residuals</b>:</p><div class="ex">Σeᵢ² = Σ(Yᵢ − Ŷᵢ)²</div>
    <p>Squaring stops positive and negative misses from canceling, and it punishes big misses more than small ones. One handy result: OLS residuals <b>sum to zero</b> — the fitted model doesn’t systematically over- or underpredict within the sample.</p>
    <p>OLS reduces <b>model error</b>, not business risk: demand shifts, policy changes, and competitor moves are still out there.</p>
    <div class="ex"><b>Estimator</b> = the recipe: a procedure applied to sample data. OLS is an estimator.<br><b>Estimate</b> = the result: the number the recipe produces from one sample, like b₁ = 2.4. (Lowercase b’s mean the same as β-hats.)</div>`,
    practice:[
     {make:r=>{const d=genTiny(r);return {type:'num',exhibit:Exhibit.table(['x','y','ŷ = '+d.b0+' + '+d.b1+'x','e = y − ŷ'],d.x.map((x,i)=>[x,d.y[i],d.b0+d.b1*x,d.e[i]])),
       q:'Square each residual and add them up. What is Σe²?',a:d.sse,tol:.01,hint:'Square each value in the last column, then sum.',solution:`${d.e.map(v=>`(${v})²`).join(' + ')} = ${d.sse}.`,why:'This is exactly the quantity OLS makes as small as possible.'};}},
     {type:'mc',q:'Why does OLS square the residuals instead of just adding them?',opts:['So misses don’t cancel, and big misses count more','To make the residuals larger and easier to compare','Because spreadsheets can’t sum negative numbers reliably','So the intercept is always estimated correctly'],a:0,why:'Raw residuals from OLS sum to zero, so their plain sum can’t measure fit.'},
    ]},
   {title:'Explained and unexplained variation',
    teach:`<p>Total variation in Y splits into what the model explains and what it leaves behind:</p>
    <div class="ex"><b>TSS = ESS + RSS</b><br>Excel ANOVA: Total SS = Regression SS + Residual SS</div>
    <p>Degrees of freedom are the price of complexity: Regression df = k, Residual df = n − k − 1, Total df = n − 1 (k = number of predictors).</p>
    <p>The same table gives you fit: <b>R² = ESS / TSS = 1 − RSS / TSS</b>, the share of total variation the model explains (Regression SS ÷ Total SS in Excel).</p>`,
    practice:[
     {make:r=>{const ess=round(rr(r,200,900),1),rss=round(rr(r,80,400),1);return {type:'num',q:`Regression SS = <b>${ess}</b> and Residual SS = <b>${rss}</b>. What is Total SS?`,a:ess+rss,tol:.05,hint:'TSS = ESS + RSS',solution:`${ess} + ${rss} = ${round(ess+rss,1)}.`,why:'Total variation = explained + unexplained.'};}},
     {make:r=>{const n=ri(r,20,80),k=ri(r,1,4);return {type:'num',q:`A model has <b>${n}</b> observations and <b>${k}</b> predictor${k>1?'s':''}. What is the residual df?`,a:n-k-1,tol:0,hint:'n − k − 1',solution:`${n} − ${k} − 1 = ${n-k-1}.`,why:'Each predictor (and the intercept) uses up one degree of freedom.'};}},
    ]},
  ],
  puzzles:[
   {type:'mc',q:'Ordinary Least Squares chooses the coefficients that…',opts:['Minimize the sum of squared residuals','Maximize the number of significant variables','Make every residual equal to zero','Minimize the sum of the residuals'],a:0,
    why:'OLS minimizes Σ(Yᵢ − Ŷᵢ)². (The plain sum of OLS residuals is always zero, so minimizing it would be meaningless.)'},
   {make:r=>{const d=genTiny(r);return {type:'num',exhibit:Exhibit.table(['x','y'],d.x.map((x,i)=>[x,d.y[i]]))+Exhibit.eq(`Candidate line: ŷ = ${d.b0} + ${d.b1}x`),
    q:'Compute the sum of squared residuals for this candidate line.',a:d.sse,tol:.01,hint:'For each row: e = y − ŷ, then square and add.',solution:`Residuals ${d.e.join(', ')} → Σe² = ${d.sse}.`,
    why:'OLS would search over every possible line and keep the one with the smallest Σe².'};}},
   {type:'mc',q:'You run OLS with an intercept and add up all the residuals. You get…',opts:['Zero (up to rounding)','The residual sum of squares','The standard error of the regression','R², the share of variation explained'],a:0,
    why:'Σeᵢ = 0 is a built-in property of OLS with an intercept: no systematic over- or underprediction within the sample.'},
   {make:r=>{const n=ri(r,20,40),X=[],Y=[];for(let i=0;i<n;i++){const x=rr(r,5,50);X.push(x);Y.push(30+3*x+rngGauss(r)*18);}const m=Stats.ols(X,Y,['Traffic']);
    return {type:'num',exhibit:Exhibit.excel(m,'Daily sales ($)').replace(/<tr><td>R Square<\/td>.*?<\/tr>/,'<tr><td>R Square</td><td class="n">?</td></tr>').replace(/<tr><td>Multiple R<\/td>.*?<\/tr>/,'<tr><td>Multiple R</td><td class="n">?</td></tr>').replace(/<tr><td>Adjusted R Square<\/td>.*?<\/tr>/,'<tr><td>Adjusted R Square</td><td class="n">?</td></tr>'),
     q:'The R² cells are hidden. Use the ANOVA table to compute <b>R²</b>.',a:m.R2,tol:.002,hint:'R² = Regression SS / Total SS (or 1 − Residual SS / Total SS).',
     solution:`${Exhibit.xl(m.SSR)} / ${Exhibit.xl(m.SST)} = ${Exhibit.xl(m.R2)}.`,why:'R² is the share of total variation the model explains: ESS / TSS.'};}},
   {type:'mc',q:'A colleague says, “OLS is an estimate and b₁ = 2.4 is the estimator.” What’s the correction?',opts:['Swap them: OLS is the estimator; 2.4 is the estimate','Nothing — the two words mean the same thing here','b₁ = 2.4 is the population parameter, not an estimate','Both are estimators; “estimate” is only for forecasts'],a:0,
    why:'An estimator is the procedure applied to sample data; an estimate is the number it produces. Lowercase b’s are the same as beta-hats.'},
  ]};

     {type:'mc',q:'A model of sales on store traffic has R² = 0.96. What can you say?',opts:['Traffic and sales move closely together in this sample','More traffic definitely causes more sales in these stores','The model will forecast next year almost perfectly','No other variable could add much to the model'],a:0,why:'Strong fit describes the sample; it doesn’t validate a causal story or guarantee forecasts.'},
    ]},
   {title:'Adjusted R² and the price of complexity',
    teach:`<p>Adding any variable — even pure noise — can’t lower R², because TSS stays fixed and RSS can only fall or stay the same. That rewards <b>overfitting</b>.</p>

    practice:[
     {type:'mc',q:'You add a variable of random numbers to a model. R² will…',opts:['Stay the same or rise','Definitely fall','Become negative','Stay exactly the same'],a:0,why:'RSS can only decrease or stay the same when you add a regressor, so R² can’t fall.'},
     {type:'mc',q:'Which comparison is valid with adjusted R²?',opts:['Two monthly-sales models, one with an extra driver','A model of monthly sales vs. a model of monthly profit','A model of sales in dollars vs. one of sales in units','A sales model for one product vs. one for another'],a:0,why:'Same dependent variable, same units — otherwise it’s apples and oranges.'},
    ]},
  ],
  puzzles:[
   {type:'mc',q:'What does R² measure?',opts:['The share of Y’s sample variation the model explains','Whether the coefficients can be read as causal effects','The probability that the model is correctly specified','The average size of the prediction error, in Y’s units'],a:0,
    why:'R² = 1 − RSS/TSS describes in-sample fit — not causality or decision value.'},
   {make:r=>{const {n,A,B}=genFitPair(r),x=Exhibit.xl;return {type:'mc',
    exhibit:Exhibit.table(['Model','Variables','R²','Adjusted R²'],[['A','Price',x(A.R2),x(A.adjR2)],['B','Price + Noise',x(B.R2),x(B.adjR2)]])+`<p class="meta">Same ${n} stores, same dependent variable (weekly sales).</p>`,
    q:'Model B adds a variable. What do these results suggest?',opts:['The new variable isn’t earning its place','Model B is better, because its R² is higher','Model A is wrong, because its R² is lower','Adjusted R² can’t compare models with different sizes'],a:0,
    why:'R² can’t fall when a variable is added. Adjusted R² penalizes the extra coefficient and dropped, so the variable adds noise rather than information.'};}},
   {type:'mc',q:'Adding “U.S. deaths from falling off fishing boats” raises a mozzarella-consumption model’s adjusted R² from 0.88 to 0.97. Should it stay?',

/* ==== content/m3.js ==== */
/* ==========================================================================
   MODULE 3 — Regression design for managerial decisions
   Two stones: the Architect's Stone (six-step design, signs, units, outliers)
   and the Fork of Categories (dummy variables).
   ========================================================================== */
const SIX_STEPS=['Anchor the question in an economic mechanism','Specify Y, X, units, and functional form','Predict the expected signs','Inspect the data and justify any changes','Estimate and evaluate in Excel','Document the model and defend the recommendation'];

function genSalary(r){
  const E=[],S=[],D=[],Y=[];
  for(let i=0;i<20;i++){const e=ri(r,0,10),s=ri(r,70,100),d=r()<.5?1:0;E.push(e);S.push(s);D.push(d);Y.push(round(8+1.15*e+.197*s+2.3*d+rngGauss(r)*2.4,1));}
  if(D.every(v=>v===D[0]))D[0]=1-D[0];
  const m=Stats.ols(E.map((e,i)=>[e,S[i],D[i]]),Y,['Experience','Score','Degree']);return {m};
}
function genLaunch(r){
  for(;;){const C=[],Dd=[],M=[];
    for(let i=0;i<40;i++){const u=r(),c=u>.45&&u<=.85?1:0,d=u>.85?1:0;C.push(c);Dd.push(d);M.push(round(18.5+2.4*c+5.5*d+rngGauss(r)*2.2,2));}
    const nc=C.reduce((a,b)=>a+b,0),nd=Dd.reduce((a,b)=>a+b,0);if(nd<3||nc<3||40-nc-nd<3)continue;
    const m=Stats.ols(C.map((c,i)=>[c,Dd[i]]),M,['Commercial','Defense']);return {m};}
}

NODES['m3-design']={kicker:'Module 3 · Designing a regression',title:'The Architect’s Stone',
  intro:'The most important regression work happens before Excel. The architect wants to see your blueprint: mechanism, specification, expected signs, and a disciplined look at the data — then a model you can defend.',
  lessons:[
   {title:'Six steps, mechanism first',
    teach:`<div class="ex">${SIX_STEPS.map((s,i)=>`${i+1} · ${s}`).join('<br>')}</div>
    <p>Step 1 is the anchor: explain <b>why</b> the outcome should respond to each driver before you open the spreadsheet. Data can’t supply missing business logic. Pick variables because the mechanism supports them, not because they’re available — and write down the expected signs <b>before</b> you see results.</p>
    <p><b>Step 6, documenting</b>, means reporting enough for another manager to reproduce and challenge the model: coefficients with units, standard errors or confidence intervals, t-statistics and p-values, R² and adjusted R², sample size N, any data changes or exclusions, and the assumptions and limitations — inconvenient results included.</p>`,
    practice:[
     {type:'mc',q:'A manager wants to start by pulling every column in the data warehouse into a regression to “see what sticks.” Which step did they skip?',opts:['Anchoring the question in an economic mechanism','Documenting the model and its limitations','Estimating the equation in Excel','Inspecting the residuals for problems'],a:0,
      why:'Choose drivers because the business mechanism supports them — not because they’re available. Mining until something “works” is the opposite of step 1.'},
     {type:'mc',q:'When should you record the expected sign of each coefficient?',opts:['Before you estimate the model','After you see which ones are significant','Only if a result surprises you','Never — the data decide the sign'],a:0,
      why:'Expected signs turn reasoning into testable predictions. Writing them afterwards just rationalizes the output.'},
    ]},
   {title:'Units and unusual observations',
    teach:`<p>Read every coefficient in the stated units of <b>both</b> variables.</p>
    <div class="ex">Sales ($000) = 420 + 18 × Advertising ($000)<br>$1,000 more advertising → 18 × $1,000 = <b>$18,000</b><br>$1 more advertising → 0.018 × $1,000 = <b>$18</b></div>
    <p>An outlier may be a data-entry error, an observation from a different population, or a rare but valid outcome. <b>Flag, investigate, document</b> — and exclude only with a defensible reason, never because it weakens your result.</p>`,

       hint:'$1 is 1/1,000 of an advertising unit, and sales are in thousands.',solution:`${c} × (1/1,000) × $1,000 = $${c}.`,why:'When Y and X share the same scaling, the coefficient also reads as dollars per dollar.'};}},
     {type:'mc',q:'Which is a defensible reason to drop an observation?',opts:['Records confirm it was a data-entry error','It makes the coefficient insignificant','It lowers R²','It looks unusual on the scatterplot'],a:0,
      why:'Exclude only with documentation and a defensible reason — like a verified error or a store from a different population.'},
    ]},
  ],
  puzzles:[
   {type:'order',q:'Put the six steps of applied regression in order.',items:SIX_STEPS,
    why:'Mechanism → specification → expected signs → data inspection → estimation → documentation. The process is iterative: new information can send you back a step.'},
   {type:'sort',q:'A restaurant chain models <b>annual store sales</b>. Sort each driver by its expected sign.',cats:['Negative','Positive','Ambiguous'],
    items:[{t:'Number of direct competitors nearby',c:0},{t:'Residents in the market area',c:1},{t:'Average household income',c:2},{t:'Students per teacher (in a model of test scores)',c:0}],
    why:'More competitors split customers (−); more residents grow the market (+); income depends on the restaurant’s positioning (±, likely +). More students per teacher may reduce attention, lowering scores (−).'},
   {make:r=>{const c=round(rr(r,.25,.6),3),k=pick([1000,5000,10000]),a=c*k;return {type:'num',
    exhibit:Exhibit.eq(`Predicted SALES ($) = 102,192 − 9,075·COMPETITION + ${c}·POPULATION + 1.288·INCOME`),
    q:`The chain is choosing between two sites. One has <b>${k.toLocaleString()}</b> more residents. Holding competition and income constant, how much higher are its predicted annual sales?`,a,tol:.6,pre:'$',
    hint:'The population coefficient is dollars per resident.',solution:`${c} × ${k.toLocaleString()} = ${money(a,0)}.`,
    why:'A per-resident coefficient looks tiny until you scale it to a managerially meaningful change.'};}},
   {type:'mc',q:'One store in the data reports annual sales ten times larger than any other. What’s the disciplined response?',
    opts:['Flag it and check the records before deciding','Delete it so the model fits the other stores better','Keep it quietly and leave it out of the report','Cap it at the next-largest value to limit its pull'],a:0,
    why:'Inspect and justify — never clean automatically. Dropping an observation changes the estimates, the standard errors, the fit, and the degrees of freedom.'},
   {type:'mc',q:'Which of these belongs in Step 6, documenting the model?',
    opts:['Coefficients with units, SEs, R², N, exclusions, limitations','Only the coefficients that came out statistically significant','R² alone, since it summarizes how good the model is','The final equation; the process needn’t be recorded'],a:0,

NODES['m3-dummy']={kicker:'Module 3 · Dummy variables',title:'The Fork of Categories',
  intro:'At the fork, the road splits by category — degree or no degree, government or commercial or defense. Categories can enter a regression only as 0/1 switches, measured against a baseline.',
  lessons:[
   {title:'Categories as 0/1 switches',
    teach:`<p>A <b>dummy variable</b> turns a two-category condition into a number: 1 if present, 0 if absent.</p>
    <div class="ex">Salary = b₀ + b₁·Experience + b₂·Score + b₃·Degree<br>Degree = 1 with a relevant graduate degree, 0 otherwise</div>
    <p>b₃ is the predicted salary <b>difference from the baseline</b> (Degree = 0), holding experience and score constant. A dummy <b>shifts the intercept</b>; the slopes stay the same.</p>`,
    practice:[
     {make:r=>{const b=round(rr(r,1.5,4),2);return {type:'mc',q:`In a salary model (salary in $000), the Degree coefficient is <b>${b}</b>. What does it mean?`,
      opts:[`Others fixed, degree holders earn about $${Math.round(b*1000).toLocaleString()} more`,`Others fixed, a degree raises salary by about ${b}%`,`Everyone in the sample earns $${Math.round(b*1000).toLocaleString()} more than the average`,`Others fixed, degree holders earn ${b} times as much`],a:0,
      why:'A dummy coefficient is an adjusted difference from the 0 (baseline) category, in Y’s units.'};}},
     {type:'mc',q:'On a chart of salary against experience, adding a Degree dummy does what to the fitted lines?',opts:['Shifts the line up or down, keeping the slope','Changes the slope, keeping the intercept','Rotates the line around the origin','Nothing visible — dummies only change R²'],a:0,why:'A dummy changes the intercept while the slopes are held constant.'},
    ]},
   {title:'k − 1 dummies and the trap',
    teach:`<p>A category with <b>k</b> groups needs <b>k − 1</b> dummies. The omitted group is the <b>baseline</b>.</p>
    <div class="ex">Government (baseline) · Commercial · Defense<br>D₁ = 1 if Commercial · D₂ = 1 if Defense<br>Margin = β₀ + β₁D₁ + β₂D₂ → β₀ = Government’s predicted margin; β₂ = Defense minus Government</div>
    <p>Include all three dummies with an intercept and they always sum to 1 — exactly the intercept’s column. That’s <b>perfect multicollinearity</b>, the <b>dummy-variable trap</b>. Never code categories 1, 2, 3 either — that implies a ranking and equal spacing.</p>`,
    practice:[
     {make:r=>{const k=ri(r,3,6);return {type:'num',q:`A variable has <b>${k}</b> categories. How many dummy variables go into a model with an intercept?`,a:k-1,tol:0,hint:'k − 1',solution:`${k} − 1 = ${k-1}.`,why:'The omitted category is the baseline every coefficient is compared against.'};}},
     {type:'mc',q:'Why not code customer type as Government = 1, Commercial = 2, Defense = 3 in one variable?',opts:['It implies an order and spacing that don’t exist','Excel can’t read category codes above 2','It would push R² unrealistically high','It is equivalent to using separate dummies'],a:0,why:'Categories have no numeric order; dummies let each group have its own shift from the baseline.'},
    ]},
  ],
  puzzles:[
   {make:r=>{const d=genSalary(r),b=d.m.b[3];return {type:'mc',exhibit:Exhibit.excel(d.m,'Salary ($000) · Degree = 1 with graduate degree'),
    q:'How should you read the Degree coefficient?',
    opts:[`Others fixed, degree holders earn about ${money(Math.abs(b)*1000,0)} ${b>=0?'more':'less'}`,`Others fixed, a degree causes a ${round(Math.abs(b),2)}% raise`,`Degree holders earn ${round(Math.abs(b),2)} thousand dollars in total`,`It is the baseline salary for the non-degree group`],a:0,
    why:'The dummy coefficient is an adjusted difference from the Degree = 0 baseline. Check its p-value too: a difference can be economically sizable yet estimated imprecisely.'};}},
   {make:r=>{const d=genSalary(r),e=ri(r,1,10),s=ri(r,72,98),deg=r()<.5?1:0,a=d.m.predict([e,s,deg]);return {type:'num',exhibit:Exhibit.excel(d.m,'Salary ($000)'),
    q:`Predict the salary (in $000) of a programmer with <b>${e}</b> years of experience, an aptitude score of <b>${s}</b>, and <b>${deg?'a':'no'}</b> graduate degree.`,a,tol:.05,unit:'thousand',
    hint:`Degree = ${deg}. Use Intercept + Exp×${e} + Score×${s} + Degree×${deg}.`,solution:`${Exhibit.xl(d.m.b[0])} + ${Exhibit.xl(d.m.b[1])}×${e} + ${Exhibit.xl(d.m.b[2])}×${s} + ${Exhibit.xl(d.m.b[3])}×${deg} ≈ ${fmtNum(a,2)}.`,
    why:'For the dummy, plug in 0 or 1 — it simply switches the degree shift on or off.'};}},
   {make:r=>{const d=genLaunch(r),pickT=pick(['Government','Commercial','Defense']),a=pickT==='Government'?d.m.b[0]:pickT==='Commercial'?d.m.b[0]+d.m.b[1]:d.m.b[0]+d.m.b[2];return {type:'num',
    exhibit:Exhibit.excel(d.m,'Launch margin (%) · Government is the baseline'),q:`What is the predicted launch margin for a <b>${pickT}</b> contract?`,a,tol:.02,unit:'%',
    hint:pickT==='Government'?'Government is the baseline: both dummies are 0.':`Baseline (intercept) plus the ${pickT} coefficient.`,
    solution:pickT==='Government'?`Intercept = ${fmtNum(a,2)}%.`:`${Exhibit.xl(d.m.b[0])} + ${Exhibit.xl(pickT==='Commercial'?d.m.b[1]:d.m.b[2])} = ${fmtNum(a,2)}%.`,
    why:'The intercept is the baseline group’s level; each dummy coefficient is that group’s difference from the baseline.'};}},
   {type:'mc',q:'An analyst includes Government, Commercial, and Defense dummies <b>and</b> an intercept. Excel balks. Why?',
    opts:['The dummies sum to 1, duplicating the intercept','There are too few observations for three dummies','Dummy variables can’t be combined with an intercept','Excel can only estimate two dummies at a time'],a:0,
    why:'Drop one category to serve as the baseline: k categories → k − 1 dummies.'},
   {make:r=>{const k=ri(r,3,7);return {type:'num',q:`A bank models loan losses across <b>${k}</b> regions and includes an intercept. How many region dummies should it use?`,a:k-1,tol:0,
    hint:'Categories minus one.',solution:`${k} − 1 = ${k-1}; the omitted region is the baseline.`,why:'Each coefficient then reads as that region’s difference from the baseline region.'};}},
  ]};

/* ==== content/m4.js ==== */
/* ==========================================================================
   MODULE 4 — Regression assumptions for defensible decisions
   Stones: the Seven Lanterns (the classical assumptions) and the Hall of
   Residuals (diagnostics, standardized residuals, BLUE, precision).
   ========================================================================== */
const SEVEN=['Linearity in the coefficients and correct specification, with an additive error','Zero mean error','No endogeneity: X uncorrelated with the error','No serial correlation','Homoskedasticity: constant error variance','No perfect multicollinearity','Normally distributed errors (optional)'];

const RES_PATTERNS={
  random:{d:'Random scatter, even spread — homoskedasticity',sd:x=>9},
  spray:{d:'A spray: spread grows as X rises — heteroskedasticity',sd:x=>1+x*.75},
  funnel:{d:'A funnel: spread shrinks as X rises — heteroskedasticity',sd:x=>1+(31-x)*.75},
  bowtie:{d:'A bow-tie: spread shrinks, then grows — heteroskedasticity',sd:x=>1.5+Math.abs(x-15.5)*1.3},
  curve:{d:'A curve: residuals bend systematically — the functional form or a driver is missing',sd:x=>3.5,mean:x=>.14*(x-15.5)**2-11},
};
function genResid(r,key){const P=RES_PATTERNS[key],xs=[],es=[];for(let i=0;i<60;i++){const x=rr(r,1,30);xs.push(x);es.push((P.mean?P.mean(x):0)+rngGauss(r)*P.sd(x));}
  const m=es.reduce((a,b)=>a+b,0)/es.length;return {xs,es:es.map(e=>e-m)};}
const residPlot=(d,xl='X')=>Exhibit.scatter(d.xs,d.es,{xl,yl:'Residual',hline:0,title:'Residual plot'});

NODES['m4-seven']={kicker:'Module 4 · The classical assumptions',title:'The Seven Lanterns',
  intro:'Seven lanterns, seven assumptions. When they all burn, OLS earns its reputation. When one goes out, you need to know which claims you can still make — and which you can’t.',
  lessons:[
   {title:'The seven, in plain language',
    teach:`<div class="ex">${SEVEN.map((s,i)=>`${i+1} · ${s}`).join('<br>')}</div>
    <p><b>Linear</b> means linear in the <b>coefficients</b>, not the variables: Y = β₀ + β₁X², or β₁ln(X), is still fine. Y = β₀ + e^(β₁X) is not.</p>
    <p>Assumption 7 is optional: OLS can be <b>estimated</b> without normality; it matters for exact small-sample <b>inference</b>.</p>
    <div class="ex"><b>Gauss–Markov theorem:</b> when Assumptions 1–6 hold, OLS is <b>BLUE</b> — the <b>B</b>est (smallest-variance) <b>L</b>inear <b>U</b>nbiased <b>E</b>stimator. It doesn’t need normal errors.</div>
    <p>Some violations are worse than others. Endogeneity (Assumption 3) <b>biases</b> the coefficients themselves. Serial correlation and heteroskedasticity (4 and 5) usually leave coefficients unbiased but make the <b>standard errors, t-tests, and confidence intervals unreliable</b> — so the model can look more certain than it is.</p>`,
    practice:[
     {type:'sort',q:'Is each equation linear in its parameters?',cats:['Linear in parameters','Not linear in parameters'],
      items:[{t:'Y = β₀ + β₁X²',c:0},{t:'Y = β₀ + β₁ln(X)',c:0},{t:'Y = β₀ + e^(β₁X)',c:1},{t:'Y = β₀ + β₁²X',c:1}],
      why:'Transforming X is fine as long as each β enters additively and to the first power.'},
     {type:'mc',q:'Which assumption is <b>not</b> needed just to compute OLS coefficients?',opts:['Normally distributed errors','Linearity in the coefficients','No perfect multicollinearity','An additive error term'],a:0,
      why:'Normality supports exact t and F inference, especially in small samples — not the estimation itself.'},
    ]},
   {title:'What residuals can and can’t tell you',
    teach:`<p>The population error ε is never observed, so we lean on residuals — but some assumptions can’t be checked that way.</p>
    <div class="ex"><b>Zero mean:</b> with an intercept, OLS residuals average zero automatically, so that proves nothing.<br><b>Endogeneity:</b> OLS residuals are uncorrelated with the included X’s by construction — a residual plot can’t reveal it.</div>
    <p>Instead, ask about omitted drivers, reverse causality, measurement error, and how the data were generated. Look for <b>systematic</b> misses: one customer group, big markets, certain periods.</p>`,
    practice:[
     {type:'mc',q:'Your residuals average exactly 0. What does that show about Assumption 2?',opts:['Nothing — OLS with an intercept forces that','It confirms the true error has mean zero','It confirms there’s no endogeneity','It confirms the errors are normally distributed'],a:0,
      why:'Σeᵢ = 0 is automatic. Look for systematic patterns instead.'},
     {type:'mc',q:'A price coefficient might be soaking up the effect of an omitted product-quality variable. Which assumption is at risk?',opts:['No endogeneity (X uncorrelated with ε)','Homoskedasticity (constant error variance)','No serial correlation among the errors','Normally distributed errors'],a:0,
      why:'If quality sits in ε and moves with price, price is correlated with the error — endogeneity, and a biased coefficient.'},
    ]},
  ],
  puzzles:[
   {type:'sort',q:'Match each warning sign to the assumption it threatens.',cats:['Endogeneity','Serial correlation','Heteroskedasticity','Perfect multicollinearity'],
    items:[{t:'An omitted driver that affects Y and moves with an included X',c:0},{t:'This month’s forecast miss predicts next month’s miss',c:1},{t:'Residual spread widens for larger stores',c:2},{t:'The model includes temperature in °F and the same temperature in °C',c:3}],
    why:'Endogeneity: X correlated with ε. Serial correlation: errors linked across observations. Heteroskedasticity: non-constant error variance. Perfect multicollinearity: one X is an exact linear combination of others.'},
   {type:'mc',q:'Which equation <b>violates</b> Assumption 1 (linear in the coefficients)?',opts:['Sales = β₀ + e^(β₁·Ads)','Sales = β₀ + β₁·Ads²','Sales = β₀ + β₁·ln(Ads)','ln(Sales) = β₀ + β₁·ln(Ads)'],a:0,
    why:'A β inside an exponent isn’t linear in the parameters. Transforming the variables — squares, logs — is fine.'},
   {type:'mc',q:'Under Assumptions 1–6, the Gauss–Markov theorem says OLS is…',opts:['BLUE: lowest variance among linear unbiased estimators','Unbiased even when relevant variables are omitted','Normally distributed in every sample, of any size','Free of bias from measurement error in X'],a:0,
    why:'Best (smallest variance), Linear, Unbiased Estimator. Gauss–Markov does not require normal errors.'},
   {type:'mc',q:'Serial correlation and heteroskedasticity usually leave coefficients unbiased. So why should a manager care?',opts:['Standard errors and tests become unreliable','They flip coefficient signs in most samples','They push R² below zero in small samples','They bias the intercept, though not the slopes'],a:0,
    why:'The estimates may be centered right, but the reported precision is wrong — that’s decision risk.'},
   {type:'mc',q:'Your colleague says, “The residual plot looks clean, so there’s no endogeneity.” What’s wrong?',opts:['Residuals are uncorrelated with X by construction','Nothing — a clean plot rules endogeneity out','Endogeneity would show up as a low R² instead','Residual plots can only check normality'],a:0,
    why:'No endogeneity is a defensibility claim built from theory and design: omitted drivers, reverse causality, measurement error.'},
  ]};

NODES['m4-plots']={kicker:'Module 4 · Diagnostics and estimator quality',title:'The Hall of Residuals',
  intro:'In the Hall of Residuals, every model leaves a trace. Read the shapes, flag the unusual, and know how much a sample can tell you.',
  lessons:[
   {title:'Reading a residual plot',
    teach:`<p>Plot residuals against X (or against predicted Y). You want a <b>calm, even band</b> around zero.</p>
    <div class="ex">Even band → consistent with homoskedasticity<br>Spray (widening) · funnel (narrowing) · bow-tie → heteroskedasticity<br>A curve → the model is systematically wrong: functional form or a missing driver</div>

/* ==========================================================================
   MODULE 5 — Hypothesis testing
   Stones: the Tribunal (hypotheses, errors, t-tests, critical values) and
   the Three Keys (critical value, p-value, confidence interval, F-test).
   ========================================================================== */
const tc1=(a,df)=>Stats.tinv(1-a,df), tc2=(a,df)=>Stats.tinv(1-a/2,df);
function genTestCase(r){ // a multiple regression with a meaningful mix of strong and weak coefficients
  const n=ri(r,25,40),X=[],Y=[];
  for(let i=0;i<n;i++){const c=ri(r,1,9),p=rr(r,20,90),inc=rr(r,30,90);X.push([c,p,inc]);Y.push(120-6*c+1.1*p+rr(r,-.3,.6)*inc+rngGauss(r)*18);}
  return {n,m:Stats.ols(X,Y,['Competitors','Population (000s)','Income ($000s)'])};
}

/* ==========================================================================
   MODULE 6 — Regression and causation; choosing independent variables
   Stones: the Trial Orchard (random assignment, treatment effects) and the
   Missing Variable (omitted-variable bias, irrelevant variables, criteria).
   ========================================================================== */
function genTrial(r){
  const n=ri(r,4,6),T=[],C=[],eff=ri(r,8,22)*1000;
  for(let i=0;i<n;i++){T.push(Math.round((125000+eff+rngGauss(r)*5500)/100)*100);C.push(Math.round((125000+rngGauss(r)*5500)/100)*100);}
  const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;return {T,C,diff:mean(T)-mean(C),mT:mean(T),mC:mean(C)};
}

   {type:'mc',q:'What gives a regression coefficient a causal interpretation?',opts:['A research design, such as random assignment','A p-value below 0.01 on the coefficient','An R² above 0.9 for the whole model','Adding many control variables to the model'],a:0,
    why:'Regression is not what makes the conclusion causal; the design is.'},
   {type:'sort',q:'Which designs support a causal reading of the coefficient?',cats:['Stronger causal design','Association only'],
    items:[{t:'Coin-flip assignment of a price discount across comparable stores',c:0},{t:'Comparing stores whose managers chose to adopt a new system',c:1},{t:'Random assignment of a training program to half the call-center agents',c:0},{t:'Regressing sales on advertising across all stores last year',c:1}],
    why:'Random assignment balances other factors; self-selection and ordinary observational data leave confounders in play.'},
   {type:'mc',q:'Why can’t you just compare a store’s sales with and without extra advertising?',opts:['One store can’t be observed both ways at once','Sales are too noisy to compare within one store','Advertising effects take too long to show up','You can — just run the regression twice'],a:0,
    why:'The counterfactual for the same unit is unobservable, so a control group stands in for it.'},

NODES['m6-omit']={kicker:'Module 6 · Choosing independent variables',title:'The Missing Variable',
  intro:'Something is missing from the model, and its effect has slipped into the error term. Find out when that creates bias, which way it pushes, and why stuffing in extra variables isn’t the cure.',
  lessons:[
   {title:'Omitted-variable bias',
    teach:`<p>Drop X₂ from the true model Y = β₀ + β₁X₁ + β₂X₂ + ε and its effect moves into the error. If X₂ moves with X₁, then X₁ is correlated with the error — Assumption 3 breaks.</p>
    <div class="ex">β₁* = β₁ + β₂·α₁ → <b>Bias = β₂·α₁</b><br>β₂ = effect of the omitted X₂ on Y · α₁ = slope of X₂ on X₁</div>
    <p>No bias if β₂ = 0 (X₂ doesn’t affect Y) <b>or</b> α₁ = 0 (X₂ unrelated to X₁). More data doesn’t fix it.</p>`,
    practice:[
     {make:r=>{const b2=round(rr(r,.2,1.5),2)*(r()<.3?-1:1),a1=round(rr(r,-.8,.8),2)||.4,bias=b2*a1;return {type:'num',q:`Omitted variable effect β₂ = <b>${b2}</b>; its relationship with the included X, α₁ = <b>${a1}</b>. What is the bias in β₁*?`,a:bias,tol:.006,
      hint:'Bias = β₂ × α₁',solution:`${b2} × ${a1} = ${round(bias,4)}.`,why:`${bias>0?'Positive bias: the estimate overstates β₁.':'Negative bias: the estimate understates β₁.'}`};}},
     {type:'mc',q:'Coffee and sleep both affect productivity, and heavy coffee drinkers sleep less. You omit sleep. The coffee coefficient…',opts:['Absorbs part of sleep’s effect and is biased','Stays unbiased, but becomes less precise','Shrinks toward zero and loses significance','Only gets a larger standard error than before'],a:0,
      why:'Sleep affects productivity (β₂ ≠ 0) and moves with coffee (α₁ ≠ 0), so both bias conditions hold.'},
    ]},
   {title:'Irrelevant variables and the four criteria',
    teach:`<p>An <b>irrelevant</b> variable (true β = 0) doesn’t bias the others, but it adds noise: higher variance, larger SEs, smaller |t|, and often lower adjusted R².</p>
    <div class="ex"><b>Omitting something important → bias. Adding something useless → noise.</b></div>
    <p>To judge a variable, use all four criteria together: <b>1 Theory</b> · <b>2 t-test</b> (significant, expected sign) · <b>3 Adjusted R²</b> · <b>4 Coefficient stability</b> when it enters or leaves.</p>`,
    practice:[
     {type:'sort',q:'Which consequence goes with which mistake?',cats:['Omitted relevant variable','Included irrelevant variable'],
      items:[{t:'Biased coefficients that can even flip sign',c:0},{t:'Larger standard errors, but still unbiased',c:1},{t:'Breaks “holding other factors constant”',c:0},{t:'Adjusted R² slips slightly',c:1}],
      why:'Omission threatens validity; irrelevance threatens precision.'},
     {type:'mc',q:'Which criterion should carry the most weight when deciding if a variable belongs?',opts:['Theory','The t-score','Adjusted R²','Whether the other coefficients move'],a:0,why:'Theory first, statistics second — then use all four together.'},
    ]},
  ],
  puzzles:[
   {type:'sort',q:'Predict the direction of omitted-variable bias on β₁.',cats:['Overestimate (positive bias)','Underestimate (negative bias)'],

    why:'Bias = β₂·α₁. Same signs → positive bias (overestimate); opposite signs → negative bias (underestimate).'},
   {make:r=>{const b1=round(rr(r,1,4),2),b2=round(rr(r,.5,2.5),2),a1=round(rr(r,.2,.9),2),est=b1+b2*a1;return {type:'num',
    q:`True model: Y = β₀ + <b>${b1}</b>X₁ + <b>${b2}</b>X₂. You leave out X₂, and X₂ = α₀ + <b>${a1}</b>X₁ + v. What coefficient on X₁ should you expect to estimate?`,a:est,tol:.006,
    hint:'β₁* = β₁ + β₂·α₁',solution:`${b1} + ${b2} × ${a1} = ${round(est,4)}.`,why:'The included variable gets credit for part of the omitted variable’s effect.'};}},
   {type:'mc',q:'Dropping population from Woody’s model moves the competition coefficient from −10,605 (t = −5.07) to −1,684 (t = −0.81). What’s the likely explanation?',

    why:'Large coefficient changes across defensible specifications deserve investigation — here, the classic omitted-variable story.'},
   {type:'mc',q:'In a Brazilian-coffee demand model, its own price has a positive, insignificant coefficient. What’s the theory-first move?',

   MODULE 7 — Choosing the functional form
   Stone: the Bending Crystal (linear, double-log, semilog, quadratic, lags,
   extrapolation, curved residuals).
