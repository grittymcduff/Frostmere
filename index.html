/* ==========================================================================
   MODULE 1 — WAYPOINTS (mini-lessons on the path before each stone)
   Each lesson: a short teaching card + practice questions. Completing a
   stone's waypoints thaws it if it froze; they are optional otherwise.
   ========================================================================== */
const W1=(id,lessons)=>{NODES[id].lessons=lessons;};

W1('m1-signs',[
  {title:'Signs come from theory',
   teach:`<p>Before you look at any data, economic logic tells you which <b>direction</b> each driver should push the outcome.</p>
   <div class="ex">Q = β₀ + β₁P + β₂Pᶜ + β₃Y<br>β₁ &lt; 0 · your price up → quantity down<br>β₂ &gt; 0 · competitor’s price up → your quantity up<br>β₃ &gt; 0 · customer budget up → demand up</div>
   <p>Theory gives you the sign. It does <b>not</b> tell you whether the effect is large, reliable, or useful — that is what the data estimate.</p>`,
   practice:[
    {type:'mc',q:'A rival coffee shop raises its prices. Theory says your quantity demanded should…',opts:['Rise — the rival is a substitute, so β₂ > 0','Fall — all prices move together','Stay the same — only your own price matters','Be impossible to predict without data'],a:0,
     why:'A substitute getting more expensive pushes customers toward you, so the competitor-price coefficient is expected to be positive.'},
    {type:'mc',q:'Which question can economic theory answer on its own?',opts:['Which direction the effect should go','How many dollars the effect is worth','How precise the estimate is','Whether the effect is big enough to act on'],a:0,
     why:'Theory predicts direction; data estimate magnitude and precision.'},
  ]},
  {title:'Reading a coefficient like a manager',
   teach:`<p>A coefficient is a <b>marginal relationship in the units of the problem</b>, holding the other included factors constant.</p>
   <div class="ex">Income coefficient = 0.23 → a one-unit rise in income is associated with 0.23 more units demanded, holding the other included factors constant.</div>
   <p>Then ask the manager’s questions: is it <b>large enough</b> to matter, <b>precise enough</b> for the stakes, and likely to <b>survive</b> changes in competitors, technology, or policy? A correct sign alone never settles a decision.</p>`,
   practice:[
    {make:r=>{const b=round(rr(r,1.1,3.9),1);return {type:'mc',q:`An advertising coefficient is <b>${b}</b> (sales in units, advertising in $1,000s). Which reading is right?`,
      opts:[`$1,000 more advertising is associated with about ${b} more units sold, holding the other included factors constant`,`$1 more advertising causes ${b} more units sold`,`Advertising explains ${Math.round(b*10)}% of sales`,`Sales will rise by exactly ${b} units every time advertising rises`],a:0,
      why:'Read it in the stated units, as an association, conditional on the other included variables.'};}},
    {type:'mc',q:'Your model gives the sign you expected. Which follow-up matters most for a pricing decision?',opts:['Is the effect big and precise enough to change what we do?','Is the intercept positive?','Did Excel report any decimals?','Is the sample size an even number?'],a:0,
     why:'Sign ≠ decision. Materiality and precision decide whether the evidence should move resources.'},
  ]},
]);

W1('m1-cross',[
  {title:'Four stories behind a correlation',
   teach:`<p>When A and B move together, any of four stories can be true:</p>
   <div class="ex"><b>A → B</b> · A causes B<br><b>B → A</b> · reverse causality<br><b>C → A and B</b> · a third factor drives both<br><b>Coincidence</b> · an unstable pattern with no mechanism</div>
   <p>A regression coefficient alone cannot tell these apart. Theory and research design have to.</p>`,
   practice:[
    {type:'mc',q:'Cities with more firefighters on duty report more fire damage. What’s the most likely story?',opts:['A third factor — bigger fires bring both more firefighters and more damage','Firefighters cause fire damage','Coincidence with no mechanism','Fire damage has no relation to firefighters'],a:0,
     why:'Fire size (C) drives both the staffing (A) and the damage (B). The association is real; the causal reading is wrong.'},
    {type:'mc',q:'Stores that spend more on loss-prevention staff report more shoplifting. A manager who knows high-theft stores were the ones given extra staff should suspect…',opts:['Reverse causality — theft drove the staffing','That staff cause shoplifting','Pure coincidence','A data-entry error'],a:0,
     why:'B → A: the outcome (theft) caused the “driver” (staffing).'},
  ]},
  {title:'Design, errors, and residuals',
   teach:`<p><b>Controlled experiments</b> change one factor across comparable groups — ideally by random assignment (price tests, regional ads, service offers). <b>Observational</b> settings study outcomes as they happen — interest rates, competitor moves, and economy-wide demand usually can’t be randomized.</p>
   <div class="ex"><b>Error</b> εᵢ = Yᵢ − E(Yᵢ|Xᵢ) — the true deviation, never observed.<br><b>Residual</b> eᵢ = Yᵢ − Ŷᵢ — the miss you can see from your fitted model.</div>`,
   practice:[
    {type:'mc',q:'Which study is a controlled experiment?',opts:['Randomly offering free shipping to half of new customers','Comparing sales before and after a recession','Tracking sales when a competitor cuts prices','Comparing regions with different interest rates'],a:0,
     why:'You chose who got the offer, at random — that is what makes it an experiment.'},
    {type:'mc',q:'Which one can you actually compute from your data?',opts:['The residual, eᵢ = Yᵢ − Ŷᵢ','The true error term, εᵢ','The population β₁','The exact causal effect'],a:0,
     why:'Residuals are observed misses; they approximate the unobservable errors.'},
  ]},
]);

W1('m1-magic',[
  {title:'From equation to prediction',
   teach:`<p>A fitted line turns an input into an <b>expected</b> outcome. Code X exactly as the model was estimated, then substitute.</p>
   <div class="ex">Predicted weight = 103.40 + 6.377 × (inches above 5 ft)<br>5 ft 9 in → X = 9 → 103.40 + 6.377 × 9 = <b>160.8 lb</b></div>
   <p>The coding matters: X = 0 means a five-foot customer, so the intercept is a sensible reference point.</p>`,
   practice:[
    {make:r=>{const b0=round(rr(r,98,108),2),b1=round(rr(r,5.6,7.2),3),x=ri(r,3,13),a=b0+b1*x;return {type:'num',
      exhibit:Exhibit.eq(`Predicted weight = ${b0} + ${b1} × (inches above 5 feet)`),q:`Predict the weight of a customer who is <b>${ftin(x)}</b>.`,a,tol:.15,unit:'lb',
      hint:`${ftin(x)} is X = ${x}.`,solution:`${b0} + ${b1} × ${x} = ${fmtNum(a,1)} lb.`,why:'Code first, then substitute.'};}},
    {type:'mc',q:'If the model had used total height in inches instead, what would the intercept mean?',opts:['Predicted weight of a person zero inches tall — not meaningful','Predicted weight of a five-foot person','The average weight in the sample','The weight gained per inch'],a:0,
     why:'Coding X so that 0 is a real, relevant value is what makes an intercept interpretable.'},
  ]},
  {title:'Residuals pay the bills',
   teach:`<p><b>Residual = actual − predicted.</b> Negative means the model <b>over</b>predicted; positive means it <b>under</b>predicted.</p>
   <div class="ex">Predicted 160.8 lb, actual 157 lb → residual = 157 − 160.8 = <b>−3.8 lb</b> (overpredicted)</div>
   <p>At the booth, what matters is the size of the miss: |residual| ≤ 10 lb earns $2; anything bigger costs $3. Judge a model in the units of the decision.</p>`,
   practice:[
    {make:r=>{const pred=round(rr(r,135,195),1),off=round((r()<.5?-1:1)*rr(r,1,14),1),W_=round(pred+off,0),a=W_-pred;return {type:'num',
      q:`The model predicts <b>${fmtNum(pred,1)} lb</b>; the customer weighs <b>${W_} lb</b>. What is the residual?`,a,tol:.06,unit:'lb',
      hint:'actual − predicted',solution:`${W_} − ${fmtNum(pred,1)} = ${fmtNum(a,1)} lb.`,why:`${Math.abs(a)<=10?'Within 10 lb: +$2.':'More than 10 lb off: −$3.'}`};}},
    {type:'mc',q:'Five customers have residuals of −4, +12, +3, −11, and +7 lb. What does the booth earn?',opts:['$0 — three wins (+$6) and two losses (−$6)','+$10','−$15','+$4'],a:0,
     why:'|−4|, |3|, |7| ≤ 10 → 3 × $2 = $6. |12| and |−11| > 10 → 2 × −$3 = −$6. Net $0.'},
  ]},
]);

   teach:`<p>Analysts often rescale a variable so the coefficient is readable. Weekly income coded in <b>$100 units</b> means X = 1 is $100.</p>
   <div class="ex">Food = 83.42 + 10.21 × Income ($100s)<br>✔ “A <b>$100</b> rise in weekly income is associated with $10.21 more expected weekly food spending.”<br>✘ “A $1 rise … $10.21 more.”</div>
   <p>To forecast, convert first: $2,000 a week → X = 20.</p>`,
   practice:[
    {make:r=>{const b0=round(rr(r,70,95),2),b1=round(rr(r,8.5,11.5),2),inc=pick([1200,1800,2400,3100]),a=b0+b1*inc/100;return {type:'num',
      exhibit:Exhibit.eq(`Food = ${b0} + ${b1} × Income <small>($100 units)</small>`),q:`Forecast weekly food spending at a weekly income of <b>$${inc.toLocaleString()}</b>.`,a,tol:.06,pre:'$',
      hint:`$${inc.toLocaleString()} → X = ${inc/100}.`,solution:`${b0} + ${b1} × ${inc/100} = ${money(a)}.`,why:'Convert the natural unit into the coded unit before you substitute.'};}},
    {type:'mc',q:'You rescale income from $100 units to $1 units. What happens?',opts:['The coefficient’s number changes; the economic relationship does not','The relationship gets stronger','R² changes','The sign flips'],a:0,
     why:'Scaling changes the number you report, not the underlying relationship.'},
  ]},
  {title:'Intercepts and the relevant range',
   teach:`<p>The intercept is the prediction when every X = 0. Often zero is <b>far outside the data</b>, so the intercept is mathematically needed but has no literal business meaning.</p>
   <div class="ex">PRICE = −102,871 + 129.22 × SIZE<br>A 0 sq ft house “selling” for −$102,871 is an extrapolation, not a fact.</div>
   <p>Trust the slope inside the observed range; reality-check anything outside it.</p>`,
   practice:[
    {type:'mc',q:'A model of store revenue uses data from stores with 40–300 employees. The intercept is negative. Best response?',opts:['Ignore its literal value — zero employees is outside the data','Conclude tiny stores lose money','Throw the model out','Force the intercept to zero'],a:0,
     why:'Zero is outside the relevant range, so the intercept is an extrapolated anchor, not a forecast.'},
    {type:'mc',q:'When IS an intercept meaningful?',opts:['When X = 0 is plausible and inside or near the observed data','Whenever it is positive','Whenever R² is high','Never'],a:0,
     why:'That’s why the booth model codes height as inches above 5 feet — so X = 0 is a real customer.'},
  ]},
]);

   <p>Before clicking OK, check the outcome, the predictors, the units, the sample, and the business logic. Then read the output in order:</p>

   practice:[

     why:'Signs and units first: if the direction or units don’t make sense, nothing after it matters yet.'},

     why:'Y is the outcome you want to explain; X holds the drivers.'},
  ]},
  {title:'Scaling a slope to a decision',
   teach:`<p>The slope is a rate: <b>change in Y per one unit of X</b>. For a realistic change, multiply.</p>
   <div class="ex">Revenue ($M) = 36.28 + 4.009 × Customers<br>+5 customers → 5 × 4.009 ≈ <b>$20.0M</b> more expected annual revenue</div>

   practice:[

      q:`How much does expected revenue change if the branch adds <b>${k}</b> customers?`,a,tol:.02,pre:'$',unit:'M',hint:'k × slope',solution:`${k} × ${b1} = ${fmtNum(a,3)}.`,why:'The intercept drops out of a change; only the slope matters.'};}},
    {type:'mc',q:'You computed a +$20M revenue change from adding customers. What’s the right next step?',opts:['Check capacity, causality, and uncertainty before committing','Book the $20M in next year’s budget','Report it as guaranteed','Add more variables until R² hits 1'],a:0,

/* ==== content/m2.js ==== */
/* ==========================================================================
   MODULE 2 — Ordinary Least Squares for managerial decisions
   Three stones: the Least-Squares Loom (OLS mechanics), Big Andy's Burger
   Barn (multivariate interpretation), the Mirror of Fit (R² and adjusted R²).
   ========================================================================== */

/* ---- generators ---- */
function genTiny(r){ // 4–5 points and a candidate line, for hand SSE
  const n=ri(r,4,5),b0=ri(r,1,4),b1=ri(r,2,4),x=[],y=[];
  for(let i=1;i<=n;i++){x.push(i);y.push(b0+b1*i+ri(r,-2,2));}
  const e=y.map((v,i)=>v-(b0+b1*x[i]));return {x,y,b0,b1,e,sse:e.reduce((s,v)=>s+v*v,0)};
}
function genAndy(r){
  const P=[],A=[],S=[];
  for(let i=0;i<75;i++){const p=round(rr(r,4.8,6.5),2),a=round(rr(r,.5,3.1),1);P.push(p);A.push(a);S.push(round(118.9-7.9*p+1.86*a+rngGauss(r)*4.9,1));}
  const m=Stats.ols(P.map((p,i)=>[p,A[i]]),S,['PRICE','ADVERT']);return {m,b0:m.b[0],b1:m.b[1],b2:m.b[2]};
}
const andyEx=d=>Exhibit.excel(d.m,'SALES ($1,000s) · PRICE in $ · ADVERT in $1,000s');
function genFitPair(r){ // model A: X1 only; model B: X1 + pure noise. Keep draws where adjusted R² falls.
  for(let t=0;t<40;t++){
    const n=ri(r,18,30),X1=[],Z=[],Y=[];
    for(let i=0;i<n;i++){const x=rr(r,10,60);X1.push(x);Z.push(rr(r,0,100));Y.push(50+2.2*x+rngGauss(r)*22);}
    const A=Stats.ols(X1,Y,['Price']),B=Stats.ols(X1.map((x,i)=>[x,Z[i]]),Y,['Price','Noise']);
    if(B.adjR2<A.adjR2)return {n,A,B};
  }
}

NODES['m2-ols']={kicker:'Module 2 · How OLS works',title:'The Least-Squares Loom',
  intro:'The loom weaves a line through a cloud of points by choosing the coefficients that make the squared misses as small as possible. Excel does the weaving — you need to know what it is optimizing, and what the ANOVA table is telling you.',
  lessons:[
   {title:'What least squares minimizes',
    teach:`<p>OLS picks b₀ and b₁ to minimize the <b>sum of squared residuals</b>:</p><div class="ex">Σeᵢ² = Σ(Yᵢ − Ŷᵢ)²</div>
    <p>Squaring stops positive and negative misses from canceling, and it punishes big misses more than small ones. One handy result: OLS residuals <b>sum to zero</b> — the fitted model doesn’t systematically over- or underpredict within the sample.</p>
    <p>OLS reduces <b>model error</b>, not business risk: demand shifts, policy changes, and competitor moves are still out there.</p>`,
    practice:[
     {make:r=>{const d=genTiny(r);return {type:'num',exhibit:Exhibit.table(['x','y','ŷ = '+d.b0+' + '+d.b1+'x','e = y − ŷ'],d.x.map((x,i)=>[x,d.y[i],d.b0+d.b1*x,d.e[i]])),
       q:'Square each residual and add them up. What is Σe²?',a:d.sse,tol:.01,hint:'Square each value in the last column, then sum.',solution:`${d.e.map(v=>`(${v})²`).join(' + ')} = ${d.sse}.`,why:'This is exactly the quantity OLS makes as small as possible.'};}},
     {type:'mc',q:'Why does OLS square the residuals instead of just adding them?',opts:['So positive and negative misses don’t cancel, and big misses count more','To make the numbers larger','Because Excel cannot add negative numbers','So R² is always positive'],a:0,why:'Raw residuals from OLS sum to zero, so their plain sum can’t measure fit.'},
    ]},
   {title:'Explained and unexplained variation',
    teach:`<p>Total variation in Y splits into what the model explains and what it leaves behind:</p>
    <div class="ex"><b>TSS = ESS + RSS</b><br>Excel ANOVA: Total SS = Regression SS + Residual SS</div>
    <p>Degrees of freedom are the price of complexity: Regression df = k, Residual df = n − k − 1, Total df = n − 1 (k = number of predictors).</p>`,
    practice:[
     {make:r=>{const ess=round(rr(r,200,900),1),rss=round(rr(r,80,400),1);return {type:'num',q:`Regression SS = <b>${ess}</b> and Residual SS = <b>${rss}</b>. What is Total SS?`,a:ess+rss,tol:.05,hint:'TSS = ESS + RSS',solution:`${ess} + ${rss} = ${round(ess+rss,1)}.`,why:'Total variation = explained + unexplained.'};}},
     {make:r=>{const n=ri(r,20,80),k=ri(r,1,4);return {type:'num',q:`A model has <b>${n}</b> observations and <b>${k}</b> predictor${k>1?'s':''}. What is the residual df?`,a:n-k-1,tol:0,hint:'n − k − 1',solution:`${n} − ${k} − 1 = ${n-k-1}.`,why:'Each predictor (and the intercept) uses up one degree of freedom.'};}},
    ]},
  ],
  puzzles:[
   {type:'mc',q:'Ordinary Least Squares chooses the coefficients that…',opts:['Minimize the sum of squared residuals','Maximize the number of significant variables','Make every residual equal to zero','Minimize the sum of the residuals'],a:0,
    why:'OLS minimizes Σ(Yᵢ − Ŷᵢ)². (The plain sum of OLS residuals is always zero, so minimizing it would be meaningless.)'},
   {make:r=>{const d=genTiny(r);return {type:'num',exhibit:Exhibit.table(['x','y'],d.x.map((x,i)=>[x,d.y[i]]))+Exhibit.eq(`Candidate line: ŷ = ${d.b0} + ${d.b1}x`),
    q:'Compute the sum of squared residuals for this candidate line.',a:d.sse,tol:.01,hint:'For each row: e = y − ŷ, then square and add.',solution:`Residuals ${d.e.join(', ')} → Σe² = ${d.sse}.`,
    why:'OLS would search over every possible line and keep the one with the smallest Σe².'};}},
   {type:'mc',q:'You run OLS with an intercept and add up all the residuals. You get…',opts:['Zero (up to rounding)','The Residual SS','The Standard Error','R²'],a:0,
    why:'Σeᵢ = 0 is a built-in property of OLS with an intercept: no systematic over- or underprediction within the sample.'},
   {make:r=>{const n=ri(r,20,40),X=[],Y=[];for(let i=0;i<n;i++){const x=rr(r,5,50);X.push(x);Y.push(30+3*x+rngGauss(r)*18);}const m=Stats.ols(X,Y,['Traffic']);
    return {type:'num',exhibit:Exhibit.excel(m,'Daily sales ($)').replace(/<tr><td>R Square<\/td>.*?<\/tr>/,'<tr><td>R Square</td><td class="n">?</td></tr>').replace(/<tr><td>Multiple R<\/td>.*?<\/tr>/,'<tr><td>Multiple R</td><td class="n">?</td></tr>').replace(/<tr><td>Adjusted R Square<\/td>.*?<\/tr>/,'<tr><td>Adjusted R Square</td><td class="n">?</td></tr>'),
     q:'The R² cells are hidden. Use the ANOVA table to compute <b>R²</b>.',a:m.R2,tol:.002,hint:'R² = Regression SS / Total SS (or 1 − Residual SS / Total SS).',
     solution:`${Exhibit.xl(m.SSR)} / ${Exhibit.xl(m.SST)} = ${Exhibit.xl(m.R2)}.`,why:'R² is the share of total variation the model explains: ESS / TSS.'};}},
   {type:'mc',q:'A colleague says, “OLS is an estimate and b₁ = 2.4 is the estimator.” What’s the correction?',opts:['Swap them: OLS is the estimator (the recipe); b₁ = 2.4 is the estimate (the result)','Both are estimators','Both are estimates','b₁ is the population parameter β₁'],a:0,
    why:'An estimator is the procedure applied to sample data; an estimate is the number it produces. Lowercase b’s are the same as beta-hats.'},
  ]};

NODES['m2-andy']={kicker:'Module 2 · Multiple regression',title:'Big Andy’s Burger Barn',
  intro:'Big Andy runs 75 franchises in similar-sized cities and wants to know how monthly sales relate to menu price and advertising. SALES and ADVERT are in $1,000s; PRICE is in dollars. Each coefficient holds the other driver constant.',
  lessons:[
   {title:'Holding other factors constant',
    teach:`<p>A multiple-regression coefficient answers: <b>what happens to Y when this X rises by one unit, with the other included X’s held fixed?</b></p>
    <div class="ex">SALARY ($000) = 3.17 + 1.40·EXPERIENCE + 0.25·SCORE<br>Holding score constant, one more year of experience ↔ about <b>$1,404</b> more salary.<br>Holding experience constant, one more test point ↔ about <b>$251</b> more.</div>
    <p>Don’t compare coefficient sizes across variables measured in different units.</p>`,
    practice:[
     {type:'mc',q:'In SALARY ($000) = 3.17 + 1.40·EXPERIENCE + 0.25·SCORE, what does 0.25 mean?',opts:['Holding experience constant, one more aptitude point is associated with about $250 more salary','One more point causes $0.25 more salary','Score matters less than experience because 0.25 < 1.40','Each point adds 25% to salary'],a:0,
      why:'Salary is in thousands, so 0.25 → $250, and the comparison holds experience fixed. Different units mean the sizes aren’t directly comparable.'},
     {type:'mc',q:'Why might a single-variable model of sales on advertising mislead?',opts:['It can mix advertising’s effect with other drivers, like price, that move with it','Single-variable models always have low R²','Excel can’t run them','Advertising can’t be measured'],a:0,
      why:'Multiple regression asks whether a driver still matters after accounting for the others.'},
    ]},
   {title:'From coefficient to a pricing move',
    teach:`<p>Translate coefficients into realistic changes and the stated units.</p>
    <div class="ex">b(PRICE) = −7.908, SALES in $1,000s<br>$0.10 price cut: −7.908 × (−0.10) = 0.7908 thousand ≈ <b>+$791</b> monthly revenue</div>
    <p>And remember: extra revenue isn’t profit. $1,000 more advertising that brings $1,863 in revenue leaves $863 <b>before</b> food, labor, and other costs.</p>`,
    practice:[
     {make:r=>{const b=round(rr(r,-9.5,-6.2),3),c=pick([.05,.10,.15,.25]),a=-b*c*1000;return {type:'num',q:`The price coefficient is <b>${b}</b> (SALES in $1,000s). A <b>$${c.toFixed(2)}</b> price <b>cut</b> is associated with how much more monthly revenue, in dollars?`,a,tol:1,pre:'$',
       hint:'coefficient × change in price, then × 1,000',solution:`${b} × (−${c.toFixed(2)}) × 1,000 = ${money(a,0)}.`,why:'Scale the coefficient to the change you are actually considering.'};}},
     {make:r=>{const b=round(rr(r,1.4,2.6),3),a=(b-1)*1000;return {type:'num',q:`Advertising coefficient <b>${b}</b> (both SALES and ADVERT in $1,000s). An extra $1,000 of advertising leaves how much revenue above the ad cost?`,a,tol:1,pre:'$',
       hint:'Extra revenue (b × $1,000) minus the $1,000 spent.',solution:`${money(b*1000,0)} − $1,000 = ${money(a,0)}.`,why:'That amount still isn’t profit — the extra sales carry their own food, labor, and franchise costs.'};}},
    ]},
  ],
  puzzles:[
   {make:r=>{const d=genAndy(r),b=round(d.b1,3);return {type:'mc',exhibit:andyEx(d),q:'How should Big Andy read the PRICE coefficient?',
    opts:[`Holding advertising constant, a $1 price increase is associated with about ${money(Math.abs(b)*1000,0)} ${b<0?'less':'more'} monthly sales revenue`,`A $1 price increase causes sales to fall by ${Math.abs(b)} dollars`,`Holding advertising constant, a $1,000 price increase is associated with ${Math.abs(b)} less revenue`,`Price explains ${Math.round(Math.abs(b)*10)}% of sales`],a:0,
    why:'SALES is in $1,000s, PRICE in dollars, and the reading is conditional on ADVERT. It’s an estimated association, not proof of a causal effect.'};}},
   {make:r=>{const d=genAndy(r),c=pick([.10,.20,.25]),a=-d.b1*c*1000;return {type:'num',exhibit:andyEx(d),q:`Andy cuts price by <b>$${c.toFixed(2)}</b> and keeps advertising unchanged. By how much does predicted monthly revenue change, in dollars?`,a,tol:2,pre:'$',
    hint:'PRICE coefficient × (−change) × 1,000.',solution:`${Exhibit.xl(d.b1)} × (−${c.toFixed(2)}) × 1,000 ≈ ${money(a,0)}.`,why:'Holding advertising constant is what lets you read the price coefficient alone.'};}},

NODES['m2-fit']={kicker:'Module 2 · Fit and model selection',title:'The Mirror of Fit',
  intro:'The mirror flatters any model that adds a variable — R² can only go up. Your job is to tell real explanatory power from decoration.',
  lessons:[
   {title:'R² is fit, not proof',
    teach:`<p><b>R² = ESS / TSS = 1 − RSS / TSS</b> — the share of the sample’s variation in Y that the model explains.</p>
    <div class="ex">R² near 0 → a flat line explains almost none of the variation.<br>R² near 1 → a tight cloud — but still <b>no proof of causation</b>.</div>
    <p>Fit describes the sample. It doesn’t guarantee a useful decision rule.</p>`,
    practice:[
     {make:r=>{const tss=round(rr(r,500,1500),0),rss=round(tss*rr(r,.15,.7),0),a=1-rss/tss;return {type:'num',q:`TSS = <b>${tss}</b>, RSS = <b>${rss}</b>. What is R²?`,a,tol:.002,hint:'1 − RSS/TSS',solution:`1 − ${rss}/${tss} = ${round(a,3)}.`,why:'R² is the explained share of total variation.'};}},
     {type:'mc',q:'A model of sales on store traffic has R² = 0.96. What can you say?',opts:['Traffic and sales move closely together in this sample','More traffic definitely causes more sales','The model will forecast next year perfectly','No other variable could matter'],a:0,why:'Strong fit describes the sample; it doesn’t validate a causal story or guarantee forecasts.'},
    ]},
   {title:'Adjusted R² and the price of complexity',
    teach:`<p>Adding any variable — even pure noise — can’t lower R², because TSS stays fixed and RSS can only fall or stay the same. That rewards <b>overfitting</b>.</p>
    <p><b>Adjusted R²</b> charges for each extra coefficient and <b>can fall</b> when a variable adds noise. Use it only to compare models with the <b>same dependent variable</b> in the same units.</p>
    <div class="ex">Mozzarella = f(Income): adj R² 0.88 → add “boat drownings”: 0.97. Better fit — no credible mechanism. It doesn’t belong.</div>`,
    practice:[
     {type:'mc',q:'You add a variable of random numbers to a model. R² will…',opts:['Stay the same or rise','Definitely fall','Become negative','Stay exactly the same'],a:0,why:'RSS can only decrease or stay the same when you add a regressor, so R² can’t fall.'},
     {type:'mc',q:'Which comparison is valid with adjusted R²?',opts:['Two models of monthly sales ($), one with an extra driver','A model of sales vs a model of profit','A model of sales in $ vs sales in units','A model for apples vs one for oranges'],a:0,why:'Same dependent variable, same units — otherwise it’s apples and oranges.'},
    ]},
  ],
  puzzles:[
   {type:'mc',q:'What does R² measure?',opts:['The share of variation in Y, within the sample, that the model explains','Whether the coefficients are causal','How likely the model is to be correct','The average prediction error in dollars'],a:0,
    why:'R² = 1 − RSS/TSS describes in-sample fit — not causality or decision value.'},
   {make:r=>{const {n,A,B}=genFitPair(r),x=Exhibit.xl;return {type:'mc',
    exhibit:Exhibit.table(['Model','Variables','R²','Adjusted R²'],[['A','Price',x(A.R2),x(A.adjR2)],['B','Price + Noise',x(B.R2),x(B.adjR2)]])+`<p class="meta">Same ${n} stores, same dependent variable (weekly sales).</p>`,
    q:'Model B adds a variable. What do these results suggest?',opts:['R² rose but adjusted R² fell — the new variable isn’t earning its place','Model B is better because its R² is higher','Model A is wrong because its R² is lower','Adjusted R² can’t be used here'],a:0,
    why:'R² can’t fall when a variable is added. Adjusted R² penalizes the extra coefficient and dropped, so the variable adds noise rather than information.'};}},
   {type:'mc',q:'Adding “U.S. deaths from falling off fishing boats” raises a mozzarella-consumption model’s adjusted R² from 0.88 to 0.97. Should it stay?',
    opts:['No — there’s no credible economic mechanism; a better statistic doesn’t mean a better model','Yes — adjusted R² penalizes useless variables, so it must be real','Yes — any variable that raises fit belongs','Only if its p-value is below 0.05'],a:0,
    why:'Statistics are a filter; economic logic and judgment make the final call. A variable doesn’t belong just because it raises adjusted R².'},
   {type:'mc',q:'Model 1 explains <b>sales revenue ($)</b> with adjusted R² = 0.62. Model 2 explains <b>profit margin (%)</b> with adjusted R² = 0.81. What can you conclude?',
    opts:['Nothing about which is better — they explain different dependent variables','Model 2 is the better model','Model 1 is overfit','Profit is easier to predict than revenue'],a:0,
    why:'Compare adjusted R² only across models with the same dependent variable in the same units.'},
   {make:r=>{const n=ri(r,25,60),k=ri(r,2,5),R2=round(rr(r,.45,.85),3),a=1-(1-R2)*(n-1)/(n-k-1);return {type:'num',
    q:`A model has R² = <b>${R2}</b> with <b>n = ${n}</b> observations and <b>k = ${k}</b> predictors. Compute adjusted R².`,a,tol:.002,
    hint:'Adjusted R² = 1 − (1 − R²)(n − 1)/(n − k − 1)',solution:`1 − (1 − ${R2}) × ${n-1}/${n-k-1} = ${round(a,4)}.`,
    why:'Every extra predictor shrinks n − k − 1, so a variable must cut RSS enough to pay for the degree of freedom it uses.'};}},
  ]};

/* ==== content/m3.js ==== */
/* ==========================================================================
   MODULE 3 — Regression design for managerial decisions
   Two stones: the Architect's Stone (six-step design, signs, units, outliers)
   and the Fork of Categories (dummy variables).
   ========================================================================== */
const SIX_STEPS=['Anchor the question in an economic mechanism','Specify Y, X, units, and functional form','Predict the expected signs','Inspect the data and justify any changes','Estimate and evaluate in Excel','Document the model and defend the recommendation'];

function genSalary(r){
  const E=[],S=[],D=[],Y=[];
  for(let i=0;i<20;i++){const e=ri(r,0,10),s=ri(r,70,100),d=r()<.5?1:0;E.push(e);S.push(s);D.push(d);Y.push(round(8+1.15*e+.197*s+2.3*d+rngGauss(r)*2.4,1));}
  if(D.every(v=>v===D[0]))D[0]=1-D[0];
  const m=Stats.ols(E.map((e,i)=>[e,S[i],D[i]]),Y,['Experience','Score','Degree']);return {m};
}
function genLaunch(r){
  for(;;){const C=[],Dd=[],M=[];
    for(let i=0;i<40;i++){const u=r(),c=u>.45&&u<=.85?1:0,d=u>.85?1:0;C.push(c);Dd.push(d);M.push(round(18.5+2.4*c+5.5*d+rngGauss(r)*2.2,2));}
    const nc=C.reduce((a,b)=>a+b,0),nd=Dd.reduce((a,b)=>a+b,0);if(nd<3||nc<3||40-nc-nd<3)continue;
    const m=Stats.ols(C.map((c,i)=>[c,Dd[i]]),M,['Commercial','Defense']);return {m};}
}

NODES['m3-design']={kicker:'Module 3 · Designing a regression',title:'The Architect’s Stone',

    <p>Step 1 is the anchor: explain <b>why</b> the outcome should respond to each driver before you open the spreadsheet. Data can’t supply missing business logic. Pick variables because the mechanism supports them, not because they’re available — and write down the expected signs <b>before</b> you see results.</p>`,
    practice:[
     {type:'mc',q:'A manager wants to start by pulling every column in the data warehouse into a regression to “see what sticks.” Which step did they skip?',opts:['Anchoring the question in an economic mechanism','Documenting the model','Estimating in Excel','Inspecting the residuals'],a:0,
      why:'Choose drivers because the business mechanism supports them — not because they’re available. Mining until something “works” is the opposite of step 1.'},
     {type:'mc',q:'When should you record the expected sign of each coefficient?',opts:['Before you estimate the model','After you see which ones are significant','Only if a result surprises you','Never — the data decide the sign'],a:0,
      why:'Expected signs turn reasoning into testable predictions. Writing them afterwards just rationalizes the output.'},

   {make:r=>{const c=round(rr(r,.25,.6),3),k=pick([1000,5000,10000]),a=c*k;return {type:'num',

NODES['m3-dummy']={kicker:'Module 3 · Dummy variables',title:'The Fork of Categories',
  intro:'At the fork, the road splits by category — degree or no degree, government or commercial or defense. Categories can enter a regression only as 0/1 switches, measured against a baseline.',
  lessons:[
   {title:'Categories as 0/1 switches',
    teach:`<p>A <b>dummy variable</b> turns a two-category condition into a number: 1 if present, 0 if absent.</p>
    <div class="ex">Salary = b₀ + b₁·Experience + b₂·Score + b₃·Degree<br>Degree = 1 with a relevant graduate degree, 0 otherwise</div>
    <p>b₃ is the predicted salary <b>difference from the baseline</b> (Degree = 0), holding experience and score constant. A dummy <b>shifts the intercept</b>; the slopes stay the same.</p>`,
    practice:[
     {make:r=>{const b=round(rr(r,1.5,4),2);return {type:'mc',q:`In a salary model (salary in $000), the Degree coefficient is <b>${b}</b>. What does it mean?`,
      opts:[`Holding experience and score constant, degree holders are predicted to earn about $${Math.round(b*1000).toLocaleString()} more than those without`,`A degree raises salary by ${b}%`,`Everyone in the sample earns $${Math.round(b*1000).toLocaleString()} more`,`Degree holders earn ${b} times as much`],a:0,
      why:'A dummy coefficient is an adjusted difference from the 0 (baseline) category, in Y’s units.'};}},
     {type:'mc',q:'On a chart of salary against experience, adding a Degree dummy does what to the fitted lines?',opts:['Shifts the line up or down — same slope, different intercept','Changes the slope only','Rotates the line around the origin','Nothing visible'],a:0,why:'A dummy changes the intercept while the slopes are held constant.'},
    ]},
   {title:'k − 1 dummies and the trap',
    teach:`<p>A category with <b>k</b> groups needs <b>k − 1</b> dummies. The omitted group is the <b>baseline</b>.</p>
    <div class="ex">Government (baseline) · Commercial · Defense<br>D₁ = 1 if Commercial · D₂ = 1 if Defense<br>Margin = β₀ + β₁D₁ + β₂D₂ → β₀ = Government’s predicted margin; β₂ = Defense minus Government</div>
    <p>Include all three dummies with an intercept and they always sum to 1 — exactly the intercept’s column. That’s <b>perfect multicollinearity</b>, the <b>dummy-variable trap</b>. Never code categories 1, 2, 3 either — that implies a ranking and equal spacing.</p>`,
    practice:[
     {make:r=>{const k=ri(r,3,6);return {type:'num',q:`A variable has <b>${k}</b> categories. How many dummy variables go into a model with an intercept?`,a:k-1,tol:0,hint:'k − 1',solution:`${k} − 1 = ${k-1}.`,why:'The omitted category is the baseline every coefficient is compared against.'};}},
     {type:'mc',q:'Why not code customer type as Government = 1, Commercial = 2, Defense = 3 in one variable?',opts:['It implies a ranking and equal distances between types that don’t exist','Excel can’t read numbers above 2','It would make R² too high','It is the same as using dummies'],a:0,why:'Categories have no numeric order; dummies let each group have its own shift from the baseline.'},
    ]},
  ],
  puzzles:[
   {make:r=>{const d=genSalary(r),b=d.m.b[3];return {type:'mc',exhibit:Exhibit.excel(d.m,'Salary ($000) · Degree = 1 with graduate degree'),
    q:'How should you read the Degree coefficient?',
    opts:[`Holding experience and score constant, degree holders are predicted to earn about ${money(Math.abs(b)*1000,0)} ${b>=0?'more':'less'} than non-holders`,`A degree causes a ${round(Math.abs(b),2)}% raise`,`Degree holders earn ${round(Math.abs(b),2)} thousand dollars in total`,`The Degree coefficient is the baseline salary`],a:0,
    why:'The dummy coefficient is an adjusted difference from the Degree = 0 baseline. Check its p-value too: a difference can be economically sizable yet estimated imprecisely.'};}},
   {make:r=>{const d=genSalary(r),e=ri(r,1,10),s=ri(r,72,98),deg=r()<.5?1:0,a=d.m.predict([e,s,deg]);return {type:'num',exhibit:Exhibit.excel(d.m,'Salary ($000)'),
    q:`Predict the salary (in $000) of a programmer with <b>${e}</b> years of experience, an aptitude score of <b>${s}</b>, and <b>${deg?'a':'no'}</b> graduate degree.`,a,tol:.05,unit:'thousand',
    hint:`Degree = ${deg}. Use Intercept + Exp×${e} + Score×${s} + Degree×${deg}.`,solution:`${Exhibit.xl(d.m.b[0])} + ${Exhibit.xl(d.m.b[1])}×${e} + ${Exhibit.xl(d.m.b[2])}×${s} + ${Exhibit.xl(d.m.b[3])}×${deg} ≈ ${fmtNum(a,2)}.`,
    why:'For the dummy, plug in 0 or 1 — it simply switches the degree shift on or off.'};}},
   {make:r=>{const d=genLaunch(r),pickT=pick(['Government','Commercial','Defense']),a=pickT==='Government'?d.m.b[0]:pickT==='Commercial'?d.m.b[0]+d.m.b[1]:d.m.b[0]+d.m.b[2];return {type:'num',
    exhibit:Exhibit.excel(d.m,'Launch margin (%) · Government is the baseline'),q:`What is the predicted launch margin for a <b>${pickT}</b> contract?`,a,tol:.02,unit:'%',
    hint:pickT==='Government'?'Government is the baseline: both dummies are 0.':`Baseline (intercept) plus the ${pickT} coefficient.`,
    solution:pickT==='Government'?`Intercept = ${fmtNum(a,2)}%.`:`${Exhibit.xl(d.m.b[0])} + ${Exhibit.xl(pickT==='Commercial'?d.m.b[1]:d.m.b[2])} = ${fmtNum(a,2)}%.`,
    why:'The intercept is the baseline group’s level; each dummy coefficient is that group’s difference from the baseline.'};}},
   {type:'mc',q:'An analyst includes Government, Commercial, and Defense dummies <b>and</b> an intercept. Excel balks. Why?',
    opts:['The three dummies always sum to 1 — the same as the intercept column — creating perfect multicollinearity (the dummy-variable trap)','There are too few observations','Dummy variables can’t be used with an intercept','Excel can only handle two dummies'],a:0,
    why:'Drop one category to serve as the baseline: k categories → k − 1 dummies.'},
   {make:r=>{const k=ri(r,3,7);return {type:'num',q:`A bank models loan losses across <b>${k}</b> regions and includes an intercept. How many region dummies should it use?`,a:k-1,tol:0,

  ]};

/* ==== content/m4.js ==== */
/* ==========================================================================
   MODULE 4 — Regression assumptions for defensible decisions
   Stones: the Seven Lanterns (the classical assumptions) and the Hall of
   Residuals (diagnostics, standardized residuals, BLUE, precision).
   ========================================================================== */
const SEVEN=['Linearity in the coefficients and correct specification, with an additive error','Zero mean error','No endogeneity: X uncorrelated with the error','No serial correlation','Homoskedasticity: constant error variance','No perfect multicollinearity','Normally distributed errors (optional)'];

const RES_PATTERNS={
  random:{d:'Random scatter with roughly constant spread — consistent with homoskedasticity',sd:x=>9},
  spray:{d:'A spray: spread grows as X rises — heteroskedasticity',sd:x=>1+x*.75},
  funnel:{d:'A funnel: spread shrinks as X rises — heteroskedasticity',sd:x=>1+(31-x)*.75},
  bowtie:{d:'A bow-tie: spread shrinks, then grows — heteroskedasticity',sd:x=>1.5+Math.abs(x-15.5)*1.3},
  curve:{d:'A curve: residuals bend systematically — the functional form or a driver is missing',sd:x=>3.5,mean:x=>.14*(x-15.5)**2-11},
};
function genResid(r,key){const P=RES_PATTERNS[key],xs=[],es=[];for(let i=0;i<60;i++){const x=rr(r,1,30);xs.push(x);es.push((P.mean?P.mean(x):0)+rngGauss(r)*P.sd(x));}
  const m=es.reduce((a,b)=>a+b,0)/es.length;return {xs,es:es.map(e=>e-m)};}
const residPlot=(d,xl='X')=>Exhibit.scatter(d.xs,d.es,{xl,yl:'Residual',hline:0,title:'Residual plot'});

NODES['m4-seven']={kicker:'Module 4 · The classical assumptions',title:'The Seven Lanterns',
  intro:'Seven lanterns, seven assumptions. When they all burn, OLS earns its reputation. When one goes out, you need to know which claims you can still make — and which you can’t.',
  lessons:[
   {title:'The seven, in plain language',
    teach:`<div class="ex">${SEVEN.map((s,i)=>`${i+1} · ${s}`).join('<br>')}</div>
    <p><b>Linear</b> means linear in the <b>coefficients</b>, not the variables: Y = β₀ + β₁X², or β₁ln(X), is still fine. Y = β₀ + e^(β₁X) is not.</p>
    <p>Assumption 7 is optional: OLS can be <b>estimated</b> without normality; it matters for exact small-sample <b>inference</b>.</p>`,
    practice:[
     {type:'sort',q:'Is each equation linear in its parameters?',cats:['Linear in parameters','Not linear in parameters'],
      items:[{t:'Y = β₀ + β₁X²',c:0},{t:'Y = β₀ + β₁ln(X)',c:0},{t:'Y = β₀ + e^(β₁X)',c:1},{t:'Y = β₀ + β₁²X',c:1}],
      why:'Transforming X is fine as long as each β enters additively and to the first power.'},
     {type:'mc',q:'Which assumption is <b>not</b> needed just to compute OLS coefficients?',opts:['Normally distributed errors','Linearity in the coefficients','No perfect multicollinearity','An additive error term'],a:0,
      why:'Normality supports exact t and F inference, especially in small samples — not the estimation itself.'},
    ]},
   {title:'What residuals can and can’t tell you',
    teach:`<p>The population error ε is never observed, so we lean on residuals — but some assumptions can’t be checked that way.</p>
    <div class="ex"><b>Zero mean:</b> with an intercept, OLS residuals average zero automatically, so that proves nothing.<br><b>Endogeneity:</b> OLS residuals are uncorrelated with the included X’s by construction — a residual plot can’t reveal it.</div>
    <p>Instead, ask about omitted drivers, reverse causality, measurement error, and how the data were generated. Look for <b>systematic</b> misses: one customer group, big markets, certain periods.</p>`,
    practice:[
     {type:'mc',q:'Your residuals average exactly 0. What does that show about Assumption 2?',opts:['Nothing — OLS with an intercept forces that','It proves the error has mean zero','It proves there’s no endogeneity','It proves errors are normal'],a:0,
      why:'Σeᵢ = 0 is automatic. Look for systematic patterns instead.'},
     {type:'mc',q:'A price coefficient might be soaking up the effect of an omitted product-quality variable. Which assumption is at risk?',opts:['No endogeneity (Cov(X, ε) = 0)','Homoskedasticity','No serial correlation','Normality'],a:0,
      why:'If quality sits in ε and moves with price, price is correlated with the error — endogeneity, and a biased coefficient.'},
    ]},
  ],
  puzzles:[
   {type:'sort',q:'Match each warning sign to the assumption it threatens.',cats:['Endogeneity','Serial correlation','Heteroskedasticity','Perfect multicollinearity'],

/* ==========================================================================
   MODULE 5 — Hypothesis testing
   Stones: the Tribunal (hypotheses, errors, t-tests, critical values) and
   the Three Keys (critical value, p-value, confidence interval, F-test).
   ========================================================================== */
const tc1=(a,df)=>Stats.tinv(1-a,df), tc2=(a,df)=>Stats.tinv(1-a/2,df);
function genTestCase(r){ // a multiple regression with a meaningful mix of strong and weak coefficients
  const n=ri(r,25,40),X=[],Y=[];
  for(let i=0;i<n;i++){const c=ri(r,1,9),p=rr(r,20,90),inc=rr(r,30,90);X.push([c,p,inc]);Y.push(120-6*c+1.1*p+rr(r,-.3,.6)*inc+rngGauss(r)*18);}
  return {n,m:Stats.ols(X,Y,['Competitors','Population (000s)','Income ($000s)'])};
}

NODES['m5-tests']={kicker:'Module 5 · Hypotheses and t-tests',title:'The Tribunal',

NODES['m5-three']={kicker:'Module 5 · Three methods and the F-test',title:'The Three Keys',

/* ==========================================================================
   MODULE 6 — Regression and causation; choosing independent variables
   Stones: the Trial Orchard (random assignment, treatment effects) and the
   Missing Variable (omitted-variable bias, irrelevant variables, criteria).
   ========================================================================== */
function genTrial(r){
  const n=ri(r,4,6),T=[],C=[],eff=ri(r,8,22)*1000;
  for(let i=0;i<n;i++){T.push(Math.round((125000+eff+rngGauss(r)*5500)/100)*100);C.push(Math.round((125000+rngGauss(r)*5500)/100)*100);}
  const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;return {T,C,diff:mean(T)-mean(C),mT:mean(T),mC:mean(C)};
}

NODES['m6-omit']={kicker:'Module 6 · Choosing independent variables',title:'The Missing Variable',
  intro:'Something is missing from the model, and its effect has slipped into the error term. Find out when that creates bias, which way it pushes, and why stuffing in extra variables isn’t the cure.',
  lessons:[
   {title:'Omitted-variable bias',
    teach:`<p>Drop X₂ from the true model Y = β₀ + β₁X₁ + β₂X₂ + ε and its effect moves into the error. If X₂ moves with X₁, then X₁ is correlated with the error — Assumption 3 breaks.</p>
    <div class="ex">β₁* = β₁ + β₂·α₁ → <b>Bias = β₂·α₁</b><br>β₂ = effect of the omitted X₂ on Y · α₁ = slope of X₂ on X₁</div>
    <p>No bias if β₂ = 0 (X₂ doesn’t affect Y) <b>or</b> α₁ = 0 (X₂ unrelated to X₁). More data doesn’t fix it.</p>`,
    practice:[
     {make:r=>{const b2=round(rr(r,.2,1.5),2)*(r()<.3?-1:1),a1=round(rr(r,-.8,.8),2)||.4,bias=b2*a1;return {type:'num',q:`Omitted variable effect β₂ = <b>${b2}</b>; its relationship with the included X, α₁ = <b>${a1}</b>. What is the bias in β₁*?`,a:bias,tol:.006,
      hint:'Bias = β₂ × α₁',solution:`${b2} × ${a1} = ${round(bias,4)}.`,why:`${bias>0?'Positive bias: the estimate overstates β₁.':'Negative bias: the estimate understates β₁.'}`};}},
     {type:'mc',q:'Coffee and sleep both affect productivity, and heavy coffee drinkers sleep less. You omit sleep. The coffee coefficient…',opts:['Absorbs part of sleep’s effect and is biased','Stays unbiased','Becomes exactly zero','Only gets a larger standard error'],a:0,
      why:'Sleep affects productivity (β₂ ≠ 0) and moves with coffee (α₁ ≠ 0), so both bias conditions hold.'},
    ]},
   {title:'Irrelevant variables and the four criteria',
    teach:`<p>An <b>irrelevant</b> variable (true β = 0) doesn’t bias the others, but it adds noise: higher variance, larger SEs, smaller |t|, and often lower adjusted R².</p>
    <div class="ex"><b>Omitting something important → bias. Adding something useless → noise.</b></div>
    <p>To judge a variable, use all four criteria together: <b>1 Theory</b> · <b>2 t-test</b> (significant, expected sign) · <b>3 Adjusted R²</b> · <b>4 Coefficient stability</b> when it enters or leaves.</p>`,
    practice:[
     {type:'sort',q:'Which consequence goes with which mistake?',cats:['Omitted relevant variable','Included irrelevant variable'],
      items:[{t:'Biased coefficients that can even flip sign',c:0},{t:'Larger standard errors, but still unbiased',c:1},{t:'Breaks “holding other factors constant”',c:0},{t:'Adjusted R² slips slightly',c:1}],
      why:'Omission threatens validity; irrelevance threatens precision.'},
     {type:'mc',q:'Which criterion should carry the most weight when deciding if a variable belongs?',opts:['Theory','The t-score','Adjusted R²','Whether the other coefficients move'],a:0,why:'Theory first, statistics second — then use all four together.'},
    ]},
  ],
  puzzles:[
   {type:'sort',q:'Predict the direction of omitted-variable bias on β₁.',cats:['Overestimate (positive bias)','Underestimate (negative bias)'],
    items:[{t:'Omitted variable raises Y and moves with X₁',c:0},{t:'Omitted variable raises Y and moves against X₁',c:1},{t:'Omitted variable lowers Y and moves with X₁',c:1},{t:'Omitted variable lowers Y and moves against X₁',c:0}],
    why:'Bias = β₂·α₁. Same signs → positive bias (overestimate); opposite signs → negative bias (underestimate).'},
   {make:r=>{const b1=round(rr(r,1,4),2),b2=round(rr(r,.5,2.5),2),a1=round(rr(r,.2,.9),2),est=b1+b2*a1;return {type:'num',
    q:`True model: Y = β₀ + <b>${b1}</b>X₁ + <b>${b2}</b>X₂. You leave out X₂, and X₂ = α₀ + <b>${a1}</b>X₁ + v. What coefficient on X₁ should you expect to estimate?`,a:est,tol:.006,
    hint:'β₁* = β₁ + β₂·α₁',solution:`${b1} + ${b2} × ${a1} = ${round(est,4)}.`,why:'The included variable gets credit for part of the omitted variable’s effect.'};}},
   {type:'mc',q:'Dropping population from Woody’s model moves the competition coefficient from −10,605 (t = −5.07) to −1,684 (t = −0.81). What’s the likely explanation?',
    opts:['Omitted-variable bias — population affects sales and is correlated with competition','Population was irrelevant all along','Competition never mattered','A data-entry error in competition'],a:0,
    why:'Large coefficient changes across defensible specifications deserve investigation — here, the classic omitted-variable story.'},
   {type:'mc',q:'In a Brazilian-coffee demand model, its own price has a positive, insignificant coefficient. What’s the theory-first move?',
    opts:['Keep price and look for a missing substitute price, like Colombian coffee','Drop price — it isn’t significant','Conclude demand ignores price','Flip the sign by hand'],a:0,
    why:'Adding the substitute price restored the negative own-price coefficient. Don’t drop a variable theory says belongs just because one sample gives it a weak t.'},
   {type:'sort',q:'Sensitivity analysis or data mining?',cats:['Sensitivity analysis','Data mining'],
    items:[{t:'Start from theory, then check whether the key result survives reasonable alternatives',c:0},{t:'Add and drop variables until p-values look good',c:1},{t:'Report the model with and without SAT to test robustness',c:0},{t:'Search 40 variables and keep whichever three are significant',c:1}],
    why:'Sensitivity analysis tests a story; data mining creates one from the sample. Document the specifications you tried.'},
  ]};

/* ==========================================================================
   SUPPLY CACHES — one hidden near each stone. Each lock is a short problem
   that needs real arithmetic (the calculator helps). Reward: one item.
     lens    → strike out a wrong answer (multiple choice)

   ========================================================================== */
const CACHE=(id,item,puzzle)=>{NODES[id].cache={item,puzzle};};

/* ---- Signpost Woods: Modules 1–3 ---- */
CACHE('m1-signs','lens',{make:r=>{const a=ri(r,400,700),bp=ri(r,25,60),bc=ri(r,12,35),by=round(rr(r,.4,1.2),1),P=round(rr(r,3,6),2),Pc=round(rr(r,3.5,6.5),2),Y=ri(r,200,400),q=a-bp*P+bc*Pc+by*Y;
  return {type:'num',exhibit:Exhibit.eq(`Q = ${a} − ${bp}P + ${bc}Pᶜ + ${by}Y`),q:`A café’s weekly demand model is above. Predict Q when your price P = <b>$${P}</b>, the rival’s price Pᶜ = <b>$${Pc}</b>, and customer budget Y = <b>${Y}</b>.`,a:q,tol:.05,unit:'cups',
   hint:`${a} − ${bp}×${P} + ${bc}×${Pc} + ${by}×${Y}`,solution:`${a} − ${round(bp*P,2)} + ${round(bc*Pc,2)} + ${round(by*Y,2)} = ${round(q,2)}.`,why:'The signs carry the theory: own price pulls Q down, a pricier rival and a bigger budget push it up.'};}});

   hint:`Rate with offer = ${t}/${n}; without = ${c}/${n}; subtract and × 100.`,solution:`(${t} − ${c}) / ${n} × 100 = ${round(d,2)} points.`,why:'Random assignment is what lets you read this difference as the offer’s effect, not a coincidence or a third factor.'};}});

  return {type:'num',exhibit:Exhibit.table(['x','y'],x.map((v,i)=>[v,y[i]]))+Exhibit.eq('b₁ = Σ(x − x̄)(y − ȳ) / Σ(x − x̄)²'),q:'Compute the OLS slope b₁ by hand for these five points.',a:b1,tol:.006,

CACHE('m2-fit','charm',{make:r=>{const n=ri(r,30,60),R2a=round(rr(r,.55,.7),3),R2b=round(R2a+rr(r,.002,.012),3),ka=2,kb=3,adj=(R2,k)=>1-(1-R2)*(n-1)/(n-k-1),a=adj(R2b,kb);
  return {type:'num',q:`Model A (2 predictors) has R² = ${R2a}. Model B adds a third predictor: R² = <b>${R2b}</b>, n = <b>${n}</b>. Compute Model B’s adjusted R².`,a,tol:.0015,
   hint:'1 − (1 − R²)(n − 1)/(n − k − 1), with k = 3.',solution:`1 − (1 − ${R2b}) × ${n-1}/${n-4} = ${round(a,4)} (Model A: ${round(adj(R2a,ka),4)}).`,
   why:`${a<adj(R2a,ka)?'Adjusted R² fell, so the third predictor isn’t earning its degree of freedom.':'Adjusted R² rose slightly — but theory still decides whether it belongs.'}`};}});

  return {type:'num',exhibit:Exhibit.eq('SALES = 102,192 − 9,075·N + 0.355·P + 1.288·I')+Exhibit.table(['Site','Competitors N','Population P','Income I'],[['A',N[0],P[0].toLocaleString(),money(I[0],0)],['B',N[1],P[1].toLocaleString(),money(I[1],0)]]),

CACHE('m3-dummy','lens',{make:r=>{const b0=round(rr(r,17,20),2),b1=round(rr(r,1.5,3.2),2),b2=round(rr(r,4,7),2),d=b2-b1;
  return {type:'num',exhibit:Exhibit.eq(`Margin (%) = ${b0} + ${b1}·Commercial + ${b2}·Defense <small>(Government is the baseline)</small>`),q:'How many percentage points higher is the predicted margin for a <b>Defense</b> contract than for a <b>Commercial</b> one?',a:d,tol:.006,unit:'pts',

CACHE('m4-seven','charm',{make:r=>{const a=round(rr(r,1.2,2.6),2),b=round(rr(r,.25,.6),2),X=pick([50,100,200,400]),y=Math.exp(a+b*Math.log(X));

   hint:`Compute ${a} + ${b}·ln(${X}), then take e^ of the result.`,solution:`exp(${a} + ${b} × ln ${X}) = exp(${round(a+b*Math.log(X),4)}) = ${round(y,3)}.`,why:'Transforming the variables keeps the model linear in β — so OLS still applies.'};}});
CACHE('m4-plots','lens',{make:r=>{const s=round(rr(r,4,12),2),e=round((r()<.5?-1:1)*rr(r,s*1.2,s*3),2),z=e/s;

  return {type:'num',q:`Competition coefficient b = <b>${b.toLocaleString()}</b>, SE = <b>${se.toLocaleString()}</b>, df = 29. Compute t for H₀: β ≥ 0. (Left-tail critical value: −1.699.)`,a:t,tol:.006,
   hint:'t = b / SE',solution:`${b.toLocaleString()} / ${se.toLocaleString()} = ${round(t,3)} → ${t<-1.699?'reject H₀':'fail to reject H₀'}.`,why:'The rejection rule depends on the tail, α, and df — set before you look at the result.'};}});

  return {type:'num',q:`b = <b>${b}</b>, SE = <b>${se}</b>, df = ${df}. The two-tailed critical value is <b>${round(tc,3)}</b>. How wide is the 95% confidence interval (upper − lower)?`,a:2*round(tc,3)*se,tol:.02,
   hint:'Width = 2 × t × SE',solution:`2 × ${round(tc,3)} × ${se} = ${round(2*round(tc,3)*se,3)}.`,why:'A wider interval means less precision — it’s the plausible range managers need alongside the point estimate.'};}});
CACHE('m6-trial','lens',{make:r=>{const n=4,T=[],C=[];const eff=ri(r,6,18)*1000;for(let i=0;i<n;i++){T.push(Math.round((118000+eff+rngGauss(r)*4000)/100)*100);C.push(Math.round((118000+rngGauss(r)*4000)/100)*100);}
  const m=a=>a.reduce((s,v)=>s+v,0)/a.length,d=m(T)-m(C);

   hint:'Average each group with mean(…), then subtract.',solution:`${money(m(T),0)} − ${money(m(C),0)} = ${money(d,0)}.`,why:'With a single 0/1 regressor, OLS’s slope is exactly this difference in means.'};}});
CACHE('m6-omit','feather',{make:r=>{const est=round(rr(r,1.5,3.5),2),b2=round(rr(r,.4,1.2),2),a1=round(rr(r,.3,.9),2),tru=est-b2*a1;
  return {type:'num',q:`Omitting X₂ gave an estimated β₁* = <b>${est}</b>. You know β₂ = <b>${b2}</b> and α₁ = <b>${a1}</b>. What is the true β₁?`,a:tru,tol:.006,
   hint:'β₁* = β₁ + β₂·α₁, so β₁ = β₁* − β₂·α₁.',solution:`${est} − ${b2} × ${a1} = ${round(tru,4)}.`,why:'Positive β₂ and positive α₁ make the bias positive — the short model overstated β₁.'};}});

/* ---------- save ---------- */
const SAVE_KEY='frostmere-save-v1';
const blankSave=()=>({v:1,scene:'hub',done:{},missed:[],seen:{},lessons:{},locked:{},caches:{},inv:{lens:0,feather:0,charm:0},tod:'dusk',stats:{answered:0,first:0}});
const FREEZE_AT=2; // misses on a stone attempt that freeze it
let SAVE=blankSave();
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.v===1)SAVE={...blankSave(),...s,inv:{...blankSave().inv,...(s.inv||{})}};}catch(e){}}
function persist(){SAVE.scene=curScene||'hub';SAVE.tod=todKey;try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}renderHud();}

/* ---------- progress rules ---------- */
const regionById=id=>COURSE.regions.find(r=>r.id===id);
const liveNodes=reg=>reg.nodes.filter(id=>NODES[id]&&!NODES[id].sealed);
const regionDone=id=>{const r=regionById(id);if(!r)return true;const l=liveNodes(r);return l.length>0&&l.every(n=>SAVE.done[n]);};
const regionUnlocked=id=>{if(id==='hub')return true;const r=regionById(id);return !r.requires||regionDone(r.requires);};
function nodeState(id){const n=NODES[id];if(!n||n.sealed)return 'sealed';if(SAVE.done[id])return 'done';return SAVE.locked[id]?'frozen':'todo';}
const lessonId=(id,j)=>`${id}#L${j+1}`;
const lessonsOf=id=>NODES[id]?.lessons||[];
const lessonsDone=id=>lessonsOf(id).filter((_,j)=>SAVE.lessons[lessonId(id,j)]).length;
function lessonState(id,j){if(SAVE.lessons[lessonId(id,j)])return 'lessonDone';if(j>0&&!SAVE.lessons[lessonId(id,j-1)])return 'blocked';return SAVE.done[id]?'none':'lesson';}
function registerLessons(){for(const id of Object.keys(NODES)){const C=NODES[id].cache;if(C)NODES[id+'#C']={cacheOf:id,title:'Supply cache',kicker:`Supply cache · ${NODES[id].title}`,puzzles:[C.puzzle]};lessonsOf(id).forEach((L,j)=>{NODES[lessonId(id,j)]={lessonOf:id,j,title:L.title,kicker:`Waypoint ${j+1} of ${lessonsOf(id).length} · ${NODES[id].title}`,puzzles:L.practice};});}}

/* ---------- HUD, toasts, banners ---------- */
const $=id=>document.getElementById(id);
function renderHud(){
  const reg=regionById(curScene);
  $('hName').textContent=reg?reg.name:COURSE.hubName;
  $('hSub').textContent=reg?reg.sub:COURSE.hubSub;
  let line='';
  if(reg){const l=liveNodes(reg);const fz=l.filter(n=>nodeState(n)==='frozen').length;line=`Study stones restored: ${l.filter(n=>SAVE.done[n]).length} / ${l.length}`+(fz?` · ${fz} frozen`:'')+(reg.nodes.length>l.length?` · ${reg.nodes.length-l.length} sealed`:'');}
  else{const all=COURSE.regions.flatMap(liveNodes);line=`Course progress: ${all.filter(n=>SAVE.done[n]).length} / ${all.length} stones`+(SAVE.missed.length?` · ${SAVE.missed.length} to review`:'');}
  $('hLine').textContent=line;
  const iv=invText();$('hInv').textContent=iv?`Carrying: ${iv}`:'';$('hInv').classList.toggle('hidden',!iv);
}
let toastT=0;
function toast(msg,ms=2600){const t=$('toast');t.innerHTML=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms);}
function banner(title,sub){const b=$('banner');b.querySelector('b').textContent=title;b.querySelector('span').textContent=sub||'';b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}
const uiOpen=()=>!card.classList.contains('hidden')||!$('log').classList.contains('hidden')||fading;

/* ---------- dialogs ---------- */
function openDialog(npc,i=0){
  const lines=typeof npc.lines==='function'?npc.lines():npc.lines;
  showCard(`<div class="kicker">${esc(npc.role||'')}</div><h2>${esc(npc.name)}</h2><p class="say">${lines[i]}</p><div class="acts"><span class="pg">${i+1} / ${lines.length}</span></div>`);
  const acts=card.querySelector('.acts'),b=btn(i<lines.length-1?'Next':'Close','primary');acts.appendChild(b);b.focus();
  b.onclick=()=>{if(i<lines.length-1)openDialog(npc,i+1);else{SAVE.seen[npc.id]=true;persist();closeCard();}};
}
function openWelcome(){openDialog(COURSE.welcome);}
function lessonListHtml(id){return `<ul class="wl">${lessonsOf(id).map((L,j)=>{const st=lessonState(id,j);return `<li class="${st}"><i class="ic ${st==='lessonDone'?'done':st==='blocked'?'sealed':'todo'}">${st==='lessonDone'?'✓':j+1}</i>${esc(L.title)}</li>`;}).join('')}</ul>`;}
function openNode(id){
  const n=NODES[id];
  if(!n||n.sealed){showCard(`<div class="kicker">${esc(n?.kicker||'Sealed stone')}</div><h2>${esc(n?.title||'Sealed')}</h2><p class="say">${n?.sealedText||'This stone is still sealed. Its quests are added in a later build.'}</p>`);return;}
  const L=lessonsOf(id).length,ld=lessonsDone(id),prev=SAVE.done[id];
  if(nodeState(id)==='frozen'){
    showCard(`<div class="kicker">${esc(n.kicker)} · frozen</div><h2>${esc(n.title)}</h2><p class="say">The stone rejected your answers and froze solid. To thaw it, finish its waypoints on the path behind you, in order — each is a short lesson with practice questions.</p>${lessonListHtml(id)}<p class="meta">${ld} of ${L} waypoints complete</p>`);return;}
  const rule=L&&!prev?(ld<L?`<p class="rule">Restore it with <b>at most one miss</b>. Miss ${FREEZE_AT} or more and it freezes until you finish its ${L} waypoints (${ld} done so far). Feeling unsure? The waypoints are on the path just before this stone.</p>`
      :`<p class="rule">You've finished all ${L} waypoints. Restore it with at most one miss — it won't freeze again.</p>`):'';
  showCard(`<div class="kicker">${esc(n.kicker)}</div><h2>${esc(n.title)}</h2><p class="say">${n.intro}</p>${rule}
    <p class="meta">${n.puzzles.length} challenges${prev?` · best first-try score ${prev.best} / ${n.puzzles.length}`:''}${invText()?` · you carry ${invText()}`:''}</p><div class="acts"></div>`);
  const b=btn(prev?'Study again':'Challenge the stone','primary');card.querySelector('.acts').appendChild(b);b.focus();
  b.onclick=()=>startSession(n.title,n.kicker,n.puzzles.map((_,idx)=>({node:id,idx})),items=>{
    const miss=items.filter(x=>x.missed).length,first=items.length-miss,wasDone=!!SAVE.done[id],regBefore=regionDone(curScene);
    if(wasDone){SAVE.done[id].best=Math.max(first,SAVE.done[id].best);persist();toast(`Studied again · ${first} / ${items.length} on the first try`);return;}
    if(miss>=FREEZE_AT){
      if(L&&lessonsDone(id)<L){SAVE.locked[id]=true;persist();freezeFx(id);
        toast(`<b>${esc(n.title)}</b> froze over · ${miss} misses. Finish its ${L} waypoints to thaw it.`,4200);}
      else{persist();toast(`The stone dims · ${miss} misses. It needs at most one — try again.`,3600);}
      return;}
    delete SAVE.locked[id];SAVE.done[id]={best:first,ts:Date.now()};persist();
    burst();toast(`<b>${esc(n.title)}</b> restored · ${first} / ${items.length} on the first try`);
    if(!regBefore&&regionDone(curScene)){const nx=COURSE.regions.find(r=>r.requires===curScene);
      setTimeout(()=>banner(`${regionById(curScene).name} restored`,nx?`The gate to ${nx.name} is unsealed`:'Every stone in this region is restored'),900);}
  },'stone');
}
function openLesson(id,j){
  const Ls=lessonsOf(id),L=Ls[j],lid=lessonId(id,j),st=lessonState(id,j),n=NODES[id];
  const kick=`Waypoint ${j+1} of ${Ls.length} · leads to ${n.title}`;
  if(st==='blocked'){showCard(`<div class="kicker">${esc(kick)}</div><h2>${esc(L.title)}</h2><p class="say">The pages are blank for now. Waypoints open in order — finish <b>${esc(Ls[j-1].title)}</b> first; it's back along the path.</p>`);return;}
  showCard(`<div class="kicker">${esc(kick)}</div><h2>${esc(L.title)}</h2><div class="teach">${L.teach}</div>
    <p class="meta">${L.practice.length} practice question${L.practice.length>1?'s':''}${SAVE.lessons[lid]?' · completed':''}</p><div class="acts"></div>`);
  const b=btn(SAVE.lessons[lid]?'Practice again':'Practice','primary');card.querySelector('.acts').appendChild(b);b.focus();
  b.onclick=()=>startSession(L.title,kick,L.practice.map((_,idx)=>({node:lid,idx})),()=>{
    const was=SAVE.lessons[lid];SAVE.lessons[lid]=true;
    const all=lessonsDone(id)===Ls.length;
    if(all&&SAVE.locked[id]){delete SAVE.locked[id];persist();thawFx(id);toast(`<b>${esc(n.title)}</b> thaws — challenge it again.`,3600);return;}
    persist();if(!was)toast(all?`All waypoints for <b>${esc(n.title)}</b> complete.`:`Waypoint complete · next one is further along the path.`);
  });
}
const ITEM={lens:{n:'Lens',d:'strikes out one wrong answer on a multiple-choice question'},feather:{n:'Feather',d:'reveals the first step on a calculation question'},charm:{n:'Warding Charm',d:'arm it before answering — your next miss on that question won’t count'}};
function invText(){return Object.keys(ITEM).filter(k=>SAVE.inv[k]).map(k=>`${SAVE.inv[k]} ${ITEM[k].n}${SAVE.inv[k]>1&&k!=='charm'?'s':''}`).join(', ');}
function openCache(id){
  const C=NODES[id].cache,cid=id+'#C',it=ITEM[C.item];
  if(SAVE.caches[cid]){showCard(`<div class="kicker">Supply cache · ${esc(NODES[id].title)}</div><h2>Empty cache</h2><p class="say">You already took the ${it.n} from this one.</p>`);return;}
  showCard(`<div class="kicker">Supply cache · near ${esc(NODES[id].title)}</div><h2>A frozen supply cache</h2><p class="say">A rune-lock seals it. Solve the problem etched on the lid to open it. Inside: a <b>${it.n}</b> — it ${it.d}. Items work only during a stone challenge.</p><div class="acts"></div>`);
  const b=btn('Read the lock','primary');card.querySelector('.acts').appendChild(b);b.focus();
  b.onclick=()=>startSession('Supply cache',`Supply cache · ${NODES[id].title}`,[{node:cid,idx:0}],()=>{
    SAVE.caches[cid]=true;SAVE.inv[C.item]=(SAVE.inv[C.item]||0)+1;persist();
    const o=objects.find(o=>o.cache===id);if(o){o.spr=SPR.cacheOpen;burst();}
    toast(`Found a <b>${it.n}</b> — it ${it.d}.`,4200);},'cache');
}
function stoneObj(id){return objects.find(o=>o.kind==='stone'&&o.node===id);}
let shake=0;
function freezeFx(id){const o=stoneObj(id);shake=.45;if(!o||!FX.particles)return;
  for(let i=0;i<70;i++){const a=rand(0,TAU),v=rand(30,160);emit({t:'spark',x:o.x+rand(-14,14),y:o.y-rand(10,70),vx:Math.cos(a)*v,vy:Math.sin(a)*v*.6,l:0,m:rand(.6,1.4),sz:rand(3,7)});}}
function thawFx(id){const o=stoneObj(id);if(!o||!FX.particles)return;
  for(let i=0;i<50;i++){emit({t:'mote',warm:1,x:o.x+rand(-20,20),y:o.y-rand(0,80),vx:rand(-20,20),vy:rand(-60,-20),l:0,m:rand(1,2),sz:rand(2,5),ph:rand(0,9)});}}
function openReview(){
  if(!SAVE.missed.length){showCard(`<div class="kicker">Review board</div><h2>Nothing to review</h2><p class="say">Questions you miss anywhere in the world are pinned here, so you can retry them with fresh numbers. The board is empty — nice work.</p>`);return;}
  const pickN=shuffle(SAVE.missed).slice(0,6);
  showCard(`<div class="kicker">Review board</div><h2>${SAVE.missed.length} pinned question${SAVE.missed.length>1?'s':''}</h2><p class="say">Here are ${pickN.length} of them, with fresh numbers where the question uses data. Answer one right on the first try and it comes off the board.</p><div class="acts"></div>`);
  const b=btn('Start review','primary');card.querySelector('.acts').appendChild(b);b.focus();
  b.onclick=()=>{startSession('Review board','Spaced review',pickN,items=>{
    let cleared=0;for(const it of items)if(!it.missed){SAVE.missed=SAVE.missed.filter(m=>!(m.node===it.node&&m.idx===it.idx));cleared++;}
    persist();toast(`Review done · ${cleared} cleared · ${SAVE.missed.length} left`);},'review');};
}
function burst(){if(!FX.particles)return;for(let i=0;i<60;i++){const a=rand(0,TAU),v=rand(40,170);emit({t:'mote',warm:1,x:player.x+rand(-10,10),y:player.y-30,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,l:0,m:rand(.8,1.8),sz:rand(2,5),ph:rand(0,9)});}}

/* ---------- quest log + save tools ---------- */
function renderLog(){
  const icon=s=>({done:'<i class="ic done">✓</i>',todo:'<i class="ic todo">!</i>',sealed:'<i class="ic sealed"></i>',frozen:'<i class="ic frozen">❄</i>'}[s]);
  let h=`<button class="close" id="logClose" aria-label="Close">×</button><div class="kicker">Quest log</div><h2>The course map</h2>`;
  for(const r of COURSE.regions){
    const un=regionUnlocked(r.id),dn=regionDone(r.id);
    h+=`<section class="reg ${un?'':'locked'}"><div class="rh"><b>${esc(r.name)}</b><span>${dn?'Restored':un?'Open':'Sealed — restore '+esc(regionById(r.requires).name)+' first'}</span></div><div class="rs">${esc(r.sub)}</div><ul>`;
    for(const id of r.nodes){const n=NODES[id],st=nodeState(id),L=lessonsOf(id).length;h+=`<li>${icon(st)}<span>${esc(n?.title||id)}${L?`<small> · waypoints ${lessonsDone(id)}/${L}</small>`:''}</span><em>${st==='done'?`${SAVE.done[id].best} / ${n.puzzles.length}`:st==='sealed'?'later build':st==='frozen'?'frozen':''}</em></li>`;}
    const cs=r.nodes.filter(id=>NODES[id]?.cache);if(cs.length)h+=`<li class="cl"><i class="ic cache"></i><span>Supply caches found</span><em>${cs.filter(id=>SAVE.caches[id+'#C']).length} / ${cs.length}</em></li>`;
    h+=`</ul></section>`;
  }
  const acc=SAVE.stats.answered?Math.round(100*SAVE.stats.first/SAVE.stats.answered):0;
  h+=`<p class="meta">${invText()?`Carrying: ${invText()} · `:''}${SAVE.stats.answered} answered · ${acc}% right on the first try · ${SAVE.missed.length} pinned for review</p>
  <details class="tools"><summary>Save &amp; transfer</summary><p class="meta">Progress saves in this browser automatically. To move it to another device, copy this code and paste it there.</p>
  <textarea id="saveCode" rows="3" readonly></textarea><div class="acts"><button class="opt" id="copyCode">Copy code</button><button class="opt" id="importBtn">Paste a code…</button><button class="opt danger" id="resetBtn">Reset progress</button></div><div id="toolMsg" class="meta"></div></details>`;
  const L=$('log');L.innerHTML=h;
  $('saveCode').value=btoa(unescape(encodeURIComponent(JSON.stringify(SAVE))));
  $('logClose').onclick=()=>L.classList.add('hidden');
  $('copyCode').onclick=async()=>{try{await navigator.clipboard.writeText($('saveCode').value);$('toolMsg').textContent='Copied.';}catch(e){$('saveCode').select();$('toolMsg').textContent='Select the code above and copy it.';}};
  $('importBtn').onclick=()=>{const ta=$('saveCode');ta.readOnly=false;ta.value='';ta.focus();$('toolMsg').textContent='Paste your code, then press Load.';
    const b=$('importBtn');b.textContent='Load';b.onclick=()=>{try{const s=JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))));if(s.v!==1)throw 0;SAVE={...blankSave(),...s};persist();travel(SAVE.scene,'start');L.classList.add('hidden');toast('Progress loaded.');}catch(e){$('toolMsg').textContent='That code could not be read.';}};};
  $('resetBtn').onclick=()=>{const b=$('resetBtn');if(b.dataset.arm){SAVE=blankSave();persist();travel('hub','start');L.classList.add('hidden');toast('Progress reset.');}else{b.dataset.arm=1;b.textContent='Tap again to erase everything';}};
}
function toggleLog(){const L=$('log');if(L.classList.contains('hidden')){renderLog();L.classList.remove('hidden');keys.clear();}else L.classList.add('hidden');}
$('logBtn').onclick=toggleLog;

/* ---------- interaction + travel ---------- */
let nearI=null,fading=false;
const readBtn=$('readBtn');
function tryRead(){if(nearI&&!uiOpen())nearI.act();}
readBtn.onclick=tryRead;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='q'&&card.classList.contains('hidden'))toggleLog();
  if(k==='escape'){closeCard();$('log').classList.add('hidden');}
  if(k==='enter'&&!uiOpen())tryRead();});
function travel(to,spawnKey){
  fading=true;const f=$('fade');f.classList.add('on');
  setTimeout(()=>{setScene(to,spawnKey);persist();const reg=regionById(to);
    banner(reg?reg.name:COURSE.hubName,reg?reg.sub:COURSE.hubSub);
    f.classList.remove('on');setTimeout(()=>fading=false,250);},420);
}
function updateWorldLogic(dt){
  // gates
  for(const gt of GATES){gt.cool-=dt;const d=Math.hypot(player.x-gt.x,player.y-gt.y);
    gt.light.col=regionUnlocked(gt.to)?[255,200,120]:[120,140,200];
    if(d<44&&gt.cool<=0&&!fading){
      if(regionUnlocked(gt.to)){gt.cool=2;travel(gt.to,gt.spawnKey);}
      else{gt.cool=1.4;const r=regionById(gt.to);toast(`<b>${esc(r.name)}</b> is sealed. Restore every stone in ${esc(regionById(r.requires).name)} first.`);
        const nx=(player.x-gt.x)/(d||1),ny=(player.y-gt.y)/(d||1);player.vx=nx*220;player.vy=ny*220;tapTarget=null;}
    }}
  // stone lights follow quest state
  for(const L of lights)if(L.node){const s=nodeState(L.node);L.col=s==='done'?[120,230,150]:s==='sealed'?[110,125,190]:s==='frozen'?[140,205,255]:[255,205,120];L.i=s==='sealed'?.45:.85;}
  for(const o of objects)if(o.cache&&!SAVE.caches[o.cache+'#C']&&FX.particles&&Math.hypot(player.x-o.x,player.y-o.y)<380&&R()<dt*5)emit({t:'spark',x:o.x+rand(-12,12),y:o.y-rand(4,22),vx:rand(-6,6),vy:rand(-22,-8),l:0,m:rand(.6,1.2),sz:rand(2,4)});
  // nearest interactable
  let best=null,bd=1e9;for(const it of INTER){const d=Math.hypot(player.x-it.x,player.y-it.y);if(d<it.r&&d<bd){bd=d;best=it;}}
  if(best!==nearI){nearI=best;readBtn.classList.toggle('hidden',!best);}
  if(best)readBtn.querySelector('span').textContent=best.label();
}

/* ---------- effects panel ---------- */
const fxPanel=$('fx');
$('fxBtn').onclick=()=>fxPanel.classList.toggle('hidden');
fxPanel.querySelectorAll('input[data-fx]').forEach(i=>i.onchange=()=>{FX[i.dataset.fx]=i.checked;if(i.dataset.fx==='particles')parts.length=0;});
function syncTodButtons(){document.querySelectorAll('#tod button').forEach(x=>x.classList.toggle('on',x.dataset.t===todKey));}
document.querySelectorAll('#tod button').forEach(b=>b.onclick=()=>{todKey=b.dataset.t;syncTodButtons();persist();});

/* ---------- main loop ---------- */
let last=performance.now(),dtLast=1/60,fpsAcc=0,fpsN=0,hintT=0;
const hint=$('hint'),fpsEl=$('fps');
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;dtLast=dt;const t=now/1000;
  wind=FX.wind?windAt(t):0;
  const T=TOD[todKey],e=1-Math.exp(-2.5*dt);
  for(let i=0;i<3;i++){amb.c[i]=lerp(amb.c[i],T.amb[i],e);amb.tint[i]=lerp(amb.tint[i],T.tint[i],e);}
  amb.a=lerp(amb.a,T.a,e);amb.glow=lerp(amb.glow,T.glow,e);amb.ta=lerp(amb.ta,T.ta,e);
  if(!uiOpen())updatePlayer(dt,t);else{player.vx*=.8;player.vy*=.8;}
  playerLight.x=player.lantern.x;playerLight.y=player.lantern.y;
  cam.px=cam.x;cam.py=cam.y;
  const tx=player.x+player.vx*.32,ty=player.y-24+player.vy*.32,ce=1-Math.exp(-3.6*dt);
  cam.x+=(tx-cam.x)*ce;cam.y+=(ty-cam.y)*ce;
  const hw=VW/2/ZOOM,hh=VH/2/ZOOM;
  cam.x=hw*2>=W?W/2:clamp(cam.x,hw,W-hw);cam.y=hh*2>=H?H/2:clamp(cam.y,hh,H-hh);
  if(shake>0){shake-=dt;const k=shake*14;cam.x+=rand(-k,k);cam.y+=rand(-k,k);}
  updateParticles(dt,t);
  updateWorldLogic(dt);
  render(t);
  hintT+=dt;if(hintT>10&&hint.style.opacity!=='0')hint.style.opacity='0';
  fpsAcc+=dt;fpsN++;if(fpsAcc>.5){fpsEl.textContent=`${Math.round(fpsN/fpsAcc)} fps · ${parts.length} particles`;fpsAcc=0;fpsN=0;}
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
loadSave();
registerLessons();
loadArt().then(()=>{
initSprites();
applyArt();
resize();
setScene(regionById(SAVE.scene)&&regionUnlocked(SAVE.scene)?SAVE.scene:'hub','start');
renderHud();
{const reg=regionById(curScene);banner(reg?reg.name:COURSE.hubName,reg?reg.sub:COURSE.hubSub);}
window.__game={get run(){return run;},openCache,Calc,objs:()=>objects,openLesson,player,cam,FX,SAVE:()=>SAVE,setTod:k=>{todKey=k;},travel,keys,NODES,Stats,openNode,regionDone};
requestAnimationFrame(frame);
});

}
</script>
</body>
</html>
